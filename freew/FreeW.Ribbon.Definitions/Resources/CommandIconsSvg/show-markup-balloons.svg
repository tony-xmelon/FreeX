<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="Show Revisions in Balloons">
  <rect width="32" height="32" fill="none"/>
  <!-- Document page outline -->
  <path d="M5 4h14v24H5z" fill="#F8F8F8" stroke="#888" stroke-width="1.2"/>
  <!-- Text lines on page -->
  <path d="M8 9h8M8 13h6M8 17h8M8 21h5" stroke="#BBBDBE" stroke-width="1" stroke-linecap="round"/>
  <!-- Balloon 1 (comment) -->
  <rect x="20" y="7" width="10" height="7" rx="2" fill="#FFF4CE" stroke="#E5C365" stroke-width="1.2"/>
  <!-- Balloon 2 (revision) -->
  <rect x="20" y="17" width="10" height="7" rx="2" fill="#D9F0E0" stroke="#60A970" stroke-width="1.2"/>
  <!-- Leader lines from page to balloons -->
  <line x1="13" y1="11" x2="20" y2="11" stroke="#A0A0A0" stroke-width="0.9" stroke-dasharray="2,1"/>
  <line x1="11" y1="20" x2="20" y2="20" stroke="#A0A0A0" stroke-width="0.9" stroke-dasharray="2,1"/>
</svg>
