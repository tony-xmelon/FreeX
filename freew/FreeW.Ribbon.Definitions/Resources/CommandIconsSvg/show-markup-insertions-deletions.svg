  <path d="M6 18h8" stroke="#2e7d32" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Deleted run: red text with strikethrough -->
  <path d="M6 23h8" stroke="#c62828" stroke-width="2" stroke-linecap="round"/>
  <path d="M6 22h8" stroke="#c62828" stroke-width="1.2" stroke-linecap="round"/>
