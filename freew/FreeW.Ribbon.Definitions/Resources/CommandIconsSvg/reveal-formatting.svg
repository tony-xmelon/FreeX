<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="Reveal Formatting">
  <rect width="32" height="32" fill="none"/>
  <!-- outer document chrome -->
  <rect x="3" y="4" width="26" height="24" rx="2" fill="#ffffff" stroke="#242424" stroke-width="1.3"/>
  <!-- right panel divider -->
  <line x1="20" y1="5" x2="20" y2="27" stroke="#d0d0d0" stroke-width="1"/>
  <!-- left content lines (document body) -->
  <line x1="6" y1="10" x2="18" y2="10" stroke="#c0c0c0" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="6" y1="14" x2="18" y2="14" stroke="#c0c0c0" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="6" y1="17" x2="15" y2="17" stroke="#c0c0c0" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="6" y1="20" x2="18" y2="20" stroke="#c0c0c0" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="6" y1="23" x2="14" y2="23" stroke="#c0c0c0" stroke-width="1.2" stroke-linecap="round"/>
  <!-- right pane: FONT label (blue accent) -->
  <line x1="22" y1="10" x2="28" y2="10" stroke="#2B5797" stroke-width="1.6" stroke-linecap="round"/>
  <!-- right pane: property lines -->
  <line x1="22" y1="13" x2="28" y2="13" stroke="#8a8a8a" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="22" y1="16" x2="28" y2="16" stroke="#8a8a8a" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="22" y1="19" x2="28" y2="19" stroke="#2B5797" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="22" y1="22" x2="28" y2="22" stroke="#8a8a8a" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="22" y1="25" x2="28" y2="25" stroke="#8a8a8a" stroke-width="1.1" stroke-linecap="round"/>
</svg>
