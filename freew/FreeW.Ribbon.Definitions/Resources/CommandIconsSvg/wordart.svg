<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="WordArt">
  <rect width="32" height="32" fill="none"/>
  <!-- Decorative outlined/skewed capital — the WordArt glyph -->
  <text x="16" y="18" font-size="23" fill="#A26714" stroke="#4B2F12" stroke-width="0.8" font-family="Segoe UI,Arial,sans-serif" font-weight="800" text-anchor="middle" dominant-baseline="central" transform="skewX(-9)">A</text>
</svg>
