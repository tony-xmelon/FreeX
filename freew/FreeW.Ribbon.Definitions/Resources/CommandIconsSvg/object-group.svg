<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="Group Objects">
  <rect width="32" height="32" fill="none"/>
  <!-- group bounding box dashed -->
  <rect x="3" y="3" width="26" height="26" rx="2" fill="none" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="3 2"/>
  <!-- child A: blue rect -->
  <rect x="7" y="7" width="9" height="9" rx="1.5" fill="#A26714" opacity="0.85"/>
  <!-- child B: orange rect -->
  <rect x="16" y="16" width="9" height="9" rx="1.5" fill="#E07020" opacity="0.85"/>
  <!-- corner handles -->
  <rect x="2" y="2" width="3" height="3" rx="0.5" fill="#242424"/>
  <rect x="27" y="2" width="3" height="3" rx="0.5" fill="#242424"/>
  <rect x="2" y="27" width="3" height="3" rx="0.5" fill="#242424"/>
  <rect x="27" y="27" width="3" height="3" rx="0.5" fill="#242424"/>
</svg>
