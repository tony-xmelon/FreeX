<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="Ungroup Objects">
  <rect width="32" height="32" fill="none"/>
  <!-- group bounding box dashed (fading) -->
  <rect x="3" y="3" width="26" height="26" rx="2" fill="none" stroke="#c0c0c0" stroke-width="1.2" stroke-dasharray="3 2"/>
  <!-- child A: separating to top-left -->
  <rect x="5" y="5" width="10" height="10" rx="1.5" fill="#A26714" opacity="0.85"/>
  <!-- child B: separating to bottom-right -->
  <rect x="17" y="17" width="10" height="10" rx="1.5" fill="#E07020" opacity="0.85"/>
  <!-- individual selection handles on child A -->
  <rect x="4" y="4" width="2.5" height="2.5" rx="0.4" fill="#242424"/>
  <rect x="13" y="4" width="2.5" height="2.5" rx="0.4" fill="#242424"/>
  <rect x="4" y="13" width="2.5" height="2.5" rx="0.4" fill="#242424"/>
  <rect x="13" y="13" width="2.5" height="2.5" rx="0.4" fill="#242424"/>
  <!-- individual selection handles on child B -->
  <rect x="16" y="16" width="2.5" height="2.5" rx="0.4" fill="#242424"/>
  <rect x="25.5" y="16" width="2.5" height="2.5" rx="0.4" fill="#242424"/>
  <rect x="16" y="25.5" width="2.5" height="2.5" rx="0.4" fill="#242424"/>
  <rect x="25.5" y="25.5" width="2.5" height="2.5" rx="0.4" fill="#242424"/>
</svg>
