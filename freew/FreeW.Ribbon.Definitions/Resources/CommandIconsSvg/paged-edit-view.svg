<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="Page Edit">
  <rect width="32" height="32" fill="none"/>
  <!-- Top page (partially behind) -->
  <rect x="9" y="4" width="13" height="10" rx="1" fill="#f0f0f0" stroke="#8a8a8a" stroke-width="1.2"/>
  <!-- Bottom / main page -->
  <rect x="7" y="9" width="13" height="17" rx="1" fill="#ffffff" stroke="#242424" stroke-width="1.4"/>
  <!-- Text lines in main page -->
  <path d="M10 13.5h7M10 16.5h7M10 19.5h5" fill="none" stroke="#8a8a8a" stroke-width="1.1" stroke-linecap="round"/>
  <!-- Blue editing cursor mark -->
  <path d="M10 22.5h4" fill="none" stroke="#0F6D8C" stroke-width="1.3" stroke-linecap="round"/>
  <rect x="14" y="21.5" width="1" height="2.5" rx="0.4" fill="#0F6D8C"/>
  <!-- Page number badge -->
  <text x="24.5" y="25" font-size="7" fill="#0F6D8C" font-family="Segoe UI,Arial,sans-serif" font-weight="700" text-anchor="middle" dominant-baseline="central">P</text>
</svg>
