<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Page outline -->
  <rect x="4" y="3" width="18" height="23" rx="1.5" fill="#ffffff" stroke="#242424" stroke-width="1.4"/>
  <!-- Original text lines (deletions visible as plain, insertions hidden) -->
  <path d="M7 8h12M7 12h12" stroke="#242424" stroke-width="1.1" stroke-linecap="round"/>
  <!-- Deleted run shown as plain text -->
  <path d="M7 16h8" stroke="#242424" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Inserted run hidden (dashed / faint) -->
  <path d="M7 21h8" stroke="#cccccc" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="2 2"/>
  <!-- "Original" badge: rewind arrow -->
  <circle cx="26" cy="26" r="5" fill="#1565c0"/>
  <path d="M24 23.5v2.5l2 1.5" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M29 26a3 3 0 1 1-3-3" stroke="#ffffff" stroke-width="1.3" fill="none" stroke-linecap="round"/>
</svg>
