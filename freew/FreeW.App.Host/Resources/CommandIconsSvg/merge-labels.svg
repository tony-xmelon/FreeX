<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" role="img" aria-label="Labels">
  <rect width="32" height="32" fill="none"/>
  <!-- Label sheet: 2×3 grid of label cells -->
  <rect x="5" y="5" width="22" height="22" rx="1.5" fill="#ffffff" stroke="#242424" stroke-width="1.3"/>
  <line x1="16" y1="5" x2="16" y2="27" stroke="#242424" stroke-width="1.1"/>
  <line x1="5" y1="12.3" x2="27" y2="12.3" stroke="#242424" stroke-width="1.1"/>
  <line x1="5" y1="19.7" x2="27" y2="19.7" stroke="#242424" stroke-width="1.1"/>
  <!-- Accent lines representing text on the top-left label -->
  <line x1="7.5" y1="8.5" x2="13.5" y2="8.5" stroke="#0F6D8C" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="7.5" y1="10.5" x2="11.5" y2="10.5" stroke="#0F6D8C" stroke-width="1.1" stroke-linecap="round"/>
</svg>
