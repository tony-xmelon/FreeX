  <rect x="3" y="3" width="20" height="26" rx="1.5" fill="#ffffff" stroke="#242424" stroke-width="1.4"/>
  <!-- Plain text lines -->
  <path d="M6 8h14M6 12h14" stroke="#8a8a8a" stroke-width="1.1" stroke-linecap="round"/>
