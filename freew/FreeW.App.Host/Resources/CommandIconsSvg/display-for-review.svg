<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Page outline -->
  <rect x="4" y="3" width="18" height="23" rx="1.5" fill="#ffffff" stroke="#242424" stroke-width="1.4"/>
  <!-- Text lines representing marked-up content -->
  <path d="M7 8h12M7 12h12M7 16h8" stroke="#8a8a8a" stroke-width="1.1" stroke-linecap="round"/>
  <!-- Revision mark: inserted text underline (green) -->
  <path d="M7 20h6" stroke="#2e7d32" stroke-width="2" stroke-linecap="round"/>
  <!-- Revision mark: deleted text strikethrough (red) -->
  <path d="M15 20h4" stroke="#c62828" stroke-width="2" stroke-linecap="round"/>
  <path d="M15 20h4" stroke="#c62828" stroke-width="1.2" stroke-linecap="round" transform="translate(0 -1)"/>
  <!-- Dropdown arrow -->
  <path d="M24 14l3 4-3 4" fill="none" stroke="#242424" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
