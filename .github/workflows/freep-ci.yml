name: FreeP CI

# Dedicated build + test gate for the FreeP presentations app (freep/, FreeP.slnx).
# Manual-only: dispatch via the Actions tab (workflow_dispatch), or it runs as part of
# app-tester-release.yml's FreeP test lane on every tester release.
#
# History: this was manual-only (workflow_dispatch-only) from scaffold-time through 2026-08-06,
# then R124 restored automatic push/PR triggers (mirroring freew-ci.yml) because manual-only had
# made a FreeP.slnx build/test break invisible to anything automated. As of this change, every
# push/PR to main was triggering a full FreeP build that reliably failed, which is pure waste
# rather than a useful gate - reverted to manual-only DELIBERATELY, not by accident. Coverage is
# not lost: app-tester-release.yml already runs the FreeP test lane (freep-tests) on every
# manual tester release, so a FreeP-breaking change is still caught before it ships, just not on
# every individual commit.
on:
  workflow_dispatch:

concurrency:
  group: freep-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  freep-tests:
    name: FreeP test lane
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.111

      - name: Build (Release, 0 warnings enforced)
        shell: pwsh
        run: dotnet build FreeP.slnx --configuration Release

      - name: Test
        shell: pwsh
        run: dotnet test FreeP.slnx --configuration Release --no-build
