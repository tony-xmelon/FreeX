name: FreeP CI

# Dedicated app-scoped commit gate. It avoids duplicate FreeX solution runs while ensuring a
# FreeP or shared-library change is validated before a tester-release workflow can publish it.
on:
  push:
    branches: [main]
    paths: ["freep/**", "shared/**", "eng/test-gates.json", "tools/Invoke-TestGate.ps1", ".github/workflows/freep-ci.yml"]
  pull_request:
    branches: [main]
    paths: ["freep/**", "shared/**", "eng/test-gates.json", "tools/Invoke-TestGate.ps1", ".github/workflows/freep-ci.yml"]
  workflow_dispatch:

concurrency:
  group: freep-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  freep-tests:
    name: FreeP ${{ matrix.platform }} commit gate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
          - platform: linux
            runner: ubuntu-latest
          - platform: macos
            runner: macos-15-intel

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.111

      - name: Build (Release, 0 warnings enforced)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: dotnet build FreeP.slnx --configuration Release

      - name: Commit gate
        shell: pwsh
        run: pwsh -NoProfile -File tools/Invoke-TestGate.ps1 -Gate commit -App FreeP -Platform ${{ matrix.platform }} ${{ matrix.platform == 'windows' && '-NoBuild' || '' }}
