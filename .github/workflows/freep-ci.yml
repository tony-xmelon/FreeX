name: FreeP CI

# Dedicated build + test gate for the FreeP presentations app (freep/, FreeP.slnx).
# Runs automatically on every push/PR to main (mirroring ci.yml's default-tests lane and
# freew-ci.yml), plus on demand via the Actions tab (workflow_dispatch) for ad-hoc validation.
#
# R124: this was manual-only (workflow_dispatch-only) from scaffold-time through 2026-08-06,
# which made a FreeP.slnx build/test break invisible to anything automated -- the same shape of
# gap that left freew-ci.yml disabled for six weeks (see the R121 note in freew-ci.yml) and that
# left FreeP.slnx out of the routine per-round gate entirely. Restored to an automatic gate so a
# FreeP-breaking change on main is caught the same push/PR cycle it lands in.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: freep-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  freep-tests:
    name: FreeP test lane
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build (Release, 0 warnings enforced)
        shell: pwsh
        run: dotnet build FreeP.slnx --configuration Release

      - name: Test
        shell: pwsh
        run: dotnet test FreeP.slnx --configuration Release --no-build
