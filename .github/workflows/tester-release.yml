name: Tester Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Optional release version override, for example 0.5
        required: false
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        default: false
        type: boolean
      release_notes:
        description: Optional tester-facing release notes to append to the generated notes
        required: false
        type: string
      include_macos_preview:
        description: Optionally attach matching macOS internal-preview artifacts from the macOS App Preview workflow
        required: true
        default: false
        type: boolean
      macos_preview_run_id:
        description: Optional macOS App Preview run id to bundle; when omitted, the workflow finds the latest successful run for this commit
        required: false
        type: string
      public_preview_candidate:
        description: Promote this build as a public-preview candidate only when all accessibility gate inputs are true
        required: true
        default: false
        type: boolean
      accessibility_keyboard_only:
        description: Keyboard-only smoke validation was recorded
        required: true
        default: false
        type: boolean
      accessibility_screen_reader:
        description: Screen-reader smoke validation was recorded
        required: true
        default: false
        type: boolean
      accessibility_uia_catalog:
        description: UI Automation catalog review was recorded
        required: true
        default: false
        type: boolean
      accessibility_known_issues:
        description: Known accessibility issues were reviewed and listed, or explicitly marked none
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: tester-release
  cancel-in-progress: false

jobs:
  build-release:
    name: Build tester release
    runs-on: windows-latest
    timeout-minutes: 180
    environment: public-preview

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate latest release source
        shell: pwsh
        run: |
          $isMainRelease = $env:GITHUB_REF -eq "refs/heads/main"
          $isDailyReleaseBranch = $env:GITHUB_REF -like "refs/heads/codex/daily-tester-release-*"
          if (-not ($isMainRelease -or $isDailyReleaseBranch)) {
            throw "Tester releases publish stable latest assets and must run from refs/heads/main or a codex/daily-tester-release-* branch."
          }
          if ($isDailyReleaseBranch) {
            git fetch origin main:refs/remotes/origin/main --no-tags
            if ($LASTEXITCODE -ne 0) {
              throw "Could not fetch origin/main while validating the tester release source."
            }

            git merge-base --is-ancestor origin/main HEAD
            if ($LASTEXITCODE -ne 0) {
              throw "Daily tester release branches must contain the current origin/main commit."
            }
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.111

      - name: Repository preflight
        shell: pwsh
        run: pwsh -NoProfile -File tools/Test-RepositoryPreflight.ps1

      - name: Build
        shell: pwsh
        run: dotnet build FreeX.slnx --configuration Release

      - name: Release gate
        shell: pwsh
        run: pwsh -NoProfile -File tools/Invoke-TestGate.ps1 -Gate release -App FreeX -Platform windows -NoBuild -ResultsDirectory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: freex-${{ github.run_id }}-${{ github.run_attempt }}-test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: warn

      - name: Compute release metadata
        id: meta
        shell: pwsh
        run: |
          $runNumber = [int]$env:GITHUB_RUN_NUMBER
          $runAttempt = [int]$env:GITHUB_RUN_ATTEMPT
          $versionLabel = "${{ inputs.release_version }}"
          if ([string]::IsNullOrWhiteSpace($versionLabel)) {
            $progressPath = "release/progress.json"
            if (-not (Test-Path -LiteralPath $progressPath)) {
              throw "Could not read release progress metadata from $progressPath"
            }

            $releaseProgress = Get-Content -LiteralPath $progressPath -Raw | ConvertFrom-Json
            foreach ($propertyName in @("major", "overallCompletion", "releasePatchBase", "releasePatchSource", "channel")) {
              if (-not $releaseProgress.PSObject.Properties.Name.Contains($propertyName)) {
                throw "release/progress.json is missing required property '$propertyName'."
              }
            }

            if ($releaseProgress.releasePatchSource -ne "github_run_number") {
              throw "Unsupported releasePatchSource '$($releaseProgress.releasePatchSource)'."
            }

            $major = [int]$releaseProgress.major
            $overallCompletion = [int]$releaseProgress.overallCompletion
            $releasePatchBase = [int]$releaseProgress.releasePatchBase
            $channel = [string]$releaseProgress.channel
            if ($major -lt 0) {
              throw "release/progress.json major must be non-negative."
            }
            if ($overallCompletion -lt 0 -or $overallCompletion -gt 100) {
              throw "release/progress.json overallCompletion must be between 0 and 100."
            }
            if ($releasePatchBase -lt 0) {
              throw "release/progress.json releasePatchBase must be non-negative."
            }
            if ($channel -ne "test") {
              throw "Unsupported release channel '$channel'."
            }

            if ($overallCompletion -ge 99) { $minor = 9 }
            elseif ($overallCompletion -ge 95) { $minor = 8 }
            elseif ($overallCompletion -ge 93) { $minor = 7 }
            elseif ($overallCompletion -ge 90) { $minor = 6 }
            else { $minor = 5 }
            $releasePatch = $releasePatchBase + $runNumber
            $versionLabel = "$major.$minor.$releasePatch"
          }
          if ($versionLabel -match "[`r`n]") {
            throw "Release version must be a single line."
          }

          $versionSlug = $versionLabel.ToLowerInvariant()
          $versionSlug = $versionSlug -replace '^version\s+', ''
          $versionSlug = $versionSlug -replace '[^a-z0-9]+', '-'
          $versionSlug = $versionSlug.Trim('-')
          if ([string]::IsNullOrWhiteSpace($versionSlug)) {
            throw "Release version produced an empty slug."
          }

          $shortSha = git rev-parse --short=8 HEAD
          $releaseStamp = Get-Date -AsUTC -Format "yyyy-MM-dd-HH-mm-ss"
          $releaseId = "$versionSlug-$releaseStamp-run$runNumber-attempt$runAttempt"
          $tag = "v$releaseId+$shortSha"
          $displayVersion = $versionLabel.Trim()
          if ($displayVersion -notmatch '^[vV]') {
            $displayVersion = "v$displayVersion"
          }
          $releaseName = "FreeX (Test Release) $displayVersion ($releaseStamp) Run $runNumber Attempt $runAttempt ($shortSha)"

          "version=$versionLabel" >> $env:GITHUB_OUTPUT
          "version_slug=$versionSlug" >> $env:GITHUB_OUTPUT
          "release_id=$releaseId" >> $env:GITHUB_OUTPUT
          "short_sha=$shortSha" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "release_name=$releaseName" >> $env:GITHUB_OUTPUT

      - name: Publish single-file tester exe
        shell: pwsh
        run: |
          $outputRoot = Join-Path $env:RUNNER_TEMP "freex-release"
          New-Item -ItemType Directory -Force -Path $outputRoot | Out-Null
          tools/Publish-UserTestBuild.ps1 `
            -Configuration Release `
            -RuntimeIdentifier win-x64 `
            -OutputRoot $outputRoot `
            -Version "${{ steps.meta.outputs.version }}" `
            -PublishMode SingleFile

          $versionedExe = Get-ChildItem -LiteralPath $outputRoot -Filter "freex-*-win-x64-singlefile.exe" |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if ($null -eq $versionedExe) {
            throw "Publish script did not create a versioned single-file exe."
          }

          $uploadRoot = Join-Path $env:GITHUB_WORKSPACE "artifacts\upload"
          New-Item -ItemType Directory -Force -Path $uploadRoot | Out-Null
          Copy-Item -LiteralPath $versionedExe.FullName -Destination (Join-Path $uploadRoot $versionedExe.Name) -Force
          $latestExePath = Join-Path $uploadRoot "FreeX-latest-win-x64.exe"
          Copy-Item -LiteralPath $versionedExe.FullName -Destination $latestExePath -Force

          $versionedHashPath = "$($versionedExe.FullName).sha256"
          if (-not (Test-Path -LiteralPath $versionedHashPath)) {
            throw "Publish script did not create a versioned single-file exe checksum."
          }

          Copy-Item -LiteralPath $versionedHashPath -Destination (Join-Path $uploadRoot "$($versionedExe.Name).sha256") -Force
          $latestHash = Get-FileHash -LiteralPath $latestExePath -Algorithm SHA256
          Set-Content -LiteralPath "$latestExePath.sha256" -Value "$($latestHash.Hash.ToLowerInvariant())  FreeX-latest-win-x64.exe" -Encoding ASCII

      - name: Publish MSIX package
        shell: pwsh
        run: |
          $outputRoot = Join-Path $env:RUNNER_TEMP "freex-release"
          $certificatePath = ""
          $env:FREEX_MSIX_CERTIFICATE_PASSWORD = "${{ secrets.FREEX_MSIX_CERTIFICATE_PASSWORD }}"
          $certificateBase64 = "${{ secrets.FREEX_MSIX_CERTIFICATE_BASE64 }}"
          $signParameters = @{}
          if (-not [string]::IsNullOrWhiteSpace($certificateBase64)) {
            $certificatePath = Join-Path $env:RUNNER_TEMP "freex-msix-signing.pfx"
            [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($certificateBase64))
            $signParameters.MsixCertificatePath = $certificatePath

            $timestampUrl = "${{ vars.FREEX_MSIX_TIMESTAMP_URL }}"
            if (-not [string]::IsNullOrWhiteSpace($timestampUrl)) {
              $signParameters.MsixTimestampUrl = $timestampUrl
            }
          } else {
            $signParameters.AllowUnsignedMsix = $true
          }

          tools/Publish-UserTestBuild.ps1 `
            -Configuration Release `
            -RuntimeIdentifier win-x64 `
            -OutputRoot $outputRoot `
            -Version "${{ steps.meta.outputs.version }}" `
            -PublishMode Msix `
            @signParameters

          $versionedMsix = Get-ChildItem -LiteralPath $outputRoot -Filter "freex-*-win-x64-msix.msix" |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if ($null -eq $versionedMsix) {
            throw "Publish script did not create a versioned MSIX."
          }

          $uploadRoot = Join-Path $env:GITHUB_WORKSPACE "artifacts\upload"
          New-Item -ItemType Directory -Force -Path $uploadRoot | Out-Null
          Copy-Item -LiteralPath $versionedMsix.FullName -Destination (Join-Path $uploadRoot $versionedMsix.Name) -Force
          $latestMsixPath = Join-Path $uploadRoot "FreeX-latest-win-x64.msix"
          Copy-Item -LiteralPath $versionedMsix.FullName -Destination $latestMsixPath -Force

          $versionedHashPath = "$($versionedMsix.FullName).sha256"
          if (-not (Test-Path -LiteralPath $versionedHashPath)) {
            throw "Publish script did not create a versioned MSIX checksum."
          }

          Copy-Item -LiteralPath $versionedHashPath -Destination (Join-Path $uploadRoot "$($versionedMsix.Name).sha256") -Force
          $latestHash = Get-FileHash -LiteralPath $latestMsixPath -Algorithm SHA256
          Set-Content -LiteralPath "$latestMsixPath.sha256" -Value "$($latestHash.Hash.ToLowerInvariant())  FreeX-latest-win-x64.msix" -Encoding ASCII

      - name: Pack Velopack (installer + portable)
        shell: pwsh
        run: |
          $outputRoot = Join-Path $env:RUNNER_TEMP "freex-release"
          tools/Publish-UserTestBuild.ps1 `
            -Configuration Release `
            -RuntimeIdentifier win-x64 `
            -OutputRoot $outputRoot `
            -Version "${{ steps.meta.outputs.version }}" `
            -PublishMode Velopack

          $vpkOut = Join-Path $outputRoot "velopack-win-x64"
          if (-not (Test-Path -LiteralPath $vpkOut)) {
            throw "vpk pack did not create the Velopack output directory."
          }

          # Stage every Velopack artifact (Setup.exe, *-Portable.zip, full .nupkg, RELEASES/assets feed)
          # for release upload. The RELEASES/assets feed is what installed clients poll to self-update.
          $uploadRoot = Join-Path $env:GITHUB_WORKSPACE "artifacts\velopack"
          New-Item -ItemType Directory -Force -Path $uploadRoot | Out-Null
          Get-ChildItem -LiteralPath $vpkOut -File | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination (Join-Path $uploadRoot $_.Name) -Force
            Write-Host "Staged Velopack asset: $($_.Name)"
          }

      - name: Upload Velopack artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: freex-${{ steps.meta.outputs.release_id }}-${{ steps.meta.outputs.short_sha }}-win-x64-velopack
          path: artifacts/velopack/*
          if-no-files-found: error

      - name: Upload versioned artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: freex-${{ steps.meta.outputs.release_id }}-${{ steps.meta.outputs.short_sha }}-win-x64-singlefile
          path: artifacts/upload/freex-*-win-x64-singlefile.exe
          if-no-files-found: error

      - name: Upload latest artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: FreeX-latest-win-x64.exe
          path: artifacts/upload/FreeX-latest-win-x64.exe
          if-no-files-found: error

      - name: Upload EXE checksum artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: freex-${{ steps.meta.outputs.release_id }}-${{ steps.meta.outputs.short_sha }}-win-x64-singlefile-sha256
          path: artifacts/upload/*.exe.sha256
          if-no-files-found: error

      - name: Upload versioned MSIX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: freex-${{ steps.meta.outputs.release_id }}-${{ steps.meta.outputs.short_sha }}-win-x64-msix
          path: artifacts/upload/freex-*-win-x64-msix.msix
          if-no-files-found: error

      - name: Upload latest MSIX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: FreeX-latest-win-x64.msix
          path: artifacts/upload/FreeX-latest-win-x64.msix
          if-no-files-found: error

      - name: Upload MSIX checksum artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: freex-${{ steps.meta.outputs.release_id }}-${{ steps.meta.outputs.short_sha }}-win-x64-msix-sha256
          path: artifacts/upload/*.msix.sha256
          if-no-files-found: error

      - name: Create or update GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          FREEX_RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $title = "${{ steps.meta.outputs.release_name }}"
          $releaseId = "${{ steps.meta.outputs.release_id }}"
          $shortSha = "${{ steps.meta.outputs.short_sha }}"
          $includeMacOsPreview = "${{ inputs.include_macos_preview }}" -eq "true"
          $publicPreviewCandidate = "${{ inputs.public_preview_candidate }}" -eq "true"
          $accessibilityGate = [ordered]@{
            "Keyboard-only smoke validation" = "${{ inputs.accessibility_keyboard_only }}" -eq "true"
            "Screen-reader smoke validation" = "${{ inputs.accessibility_screen_reader }}" -eq "true"
            "UI Automation catalog review" = "${{ inputs.accessibility_uia_catalog }}" -eq "true"
            "Known accessibility issues reviewed/listed" = "${{ inputs.accessibility_known_issues }}" -eq "true"
          }

          $missingAccessibilityGate = @(
            foreach ($item in $accessibilityGate.GetEnumerator()) {
              if (-not $item.Value) { $item.Key }
            }
          )

          function Copy-ReleaseAsset {
            param(
              [Parameter(Mandatory = $true)][string]$SourcePath,
              [Parameter(Mandatory = $true)][string]$DestinationName
            )

            $destinationPath = Join-Path "artifacts/upload" $DestinationName
            Copy-Item -LiteralPath $SourcePath -Destination $destinationPath -Force
            return $destinationPath
          }

          function Write-Sha256File {
            param([Parameter(Mandatory = $true)][string]$AssetPath)

            $hash = Get-FileHash -LiteralPath $AssetPath -Algorithm SHA256
            $assetName = Split-Path -Leaf $AssetPath
            Set-Content -LiteralPath "$AssetPath.sha256" -Value "$($hash.Hash.ToLowerInvariant())  $assetName" -Encoding ASCII
          }

          function Find-DownloadedArtifactFile {
            param(
              [Parameter(Mandatory = $true)][string]$Root,
              [Parameter(Mandatory = $true)][string]$FileName,
              [Parameter(Mandatory = $true)][string]$ArtifactName
            )

            $matches = @(Get-ChildItem -LiteralPath $Root -Recurse -File -Filter $FileName)
            if ($matches.Count -eq 0) {
              throw "macOS artifact '$ArtifactName' is missing required file '$FileName' under '$Root'."
            }
            if ($matches.Count -gt 1) {
              $matchList = ($matches | ForEach-Object { $_.FullName }) -join ', '
              throw "macOS artifact '$ArtifactName' contains multiple '$FileName' files: $matchList."
            }

            return $matches[0].FullName
          }

          $macOsNotes = @("macOS preview assets: not attached for this release.")
          if ($includeMacOsPreview) {
            $macOsRunInput = "${{ inputs.macos_preview_run_id }}".Trim()
            $macOsRun = $null
            if (-not [string]::IsNullOrWhiteSpace($macOsRunInput)) {
              $macOsRun = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$macOsRunInput" | ConvertFrom-Json
            } else {
              $encodedBranchName = [System.Uri]::EscapeDataString($env:GITHUB_REF_NAME)
              $runs = gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/macos-app.yml/runs?branch=$encodedBranchName&status=success&per_page=50" | ConvertFrom-Json
              $macOsRun = $runs.workflow_runs |
                Where-Object { $_.head_sha -eq $env:GITHUB_SHA -and $_.conclusion -eq "success" } |
                Sort-Object created_at -Descending |
                Select-Object -First 1
            }

            if ($null -eq $macOsRun) {
              throw "include_macos_preview=true requires a successful macOS App Preview run for commit $env:GITHUB_SHA on branch $env:GITHUB_REF_NAME, or pass macos_preview_run_id."
            }
            if ($macOsRun.head_sha -ne $env:GITHUB_SHA) {
              throw "macOS App Preview run $($macOsRun.id) targets $($macOsRun.head_sha), but this release targets $env:GITHUB_SHA."
            }
            if ($macOsRun.conclusion -ne "success") {
              throw "macOS App Preview run $($macOsRun.id) must be completed successfully before bundling."
            }

            $macOsRunAttempt = [int]$macOsRun.run_attempt
            $macOsRunUrl = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$($macOsRun.id)"
            $macOsDownloadRoot = Join-Path $env:RUNNER_TEMP "freex-macos-preview"
            New-Item -ItemType Directory -Force -Path $macOsDownloadRoot | Out-Null

            $macOsNotes = @(
              "macOS internal-preview assets are attached from macOS App Preview run $($macOsRun.id) attempt ${macOsRunAttempt}: $macOsRunUrl",
              "These macOS builds are unsigned/ad-hoc internal previews until Developer ID signing and notarization are configured."
            )

            foreach ($runtime in @("osx-arm64", "osx-x64")) {
              $assetLabel = if ($runtime -eq "osx-arm64") { "arm64" } else { "x64" }
              $artifactName = "freex-$($macOsRun.id)-$macOsRunAttempt-$runtime-macos-app"
              $runtimeRoot = Join-Path $macOsDownloadRoot $runtime
              New-Item -ItemType Directory -Force -Path $runtimeRoot | Out-Null
              gh run download $($macOsRun.id) --name $artifactName --dir $runtimeRoot
              if ($LASTEXITCODE -ne 0) {
                throw "Failed to download macOS artifact '$artifactName'."
              }

              $innerZip = Find-DownloadedArtifactFile -Root $runtimeRoot -FileName "freex-$runtime-macos-app.zip" -ArtifactName $artifactName
              $instructions = Find-DownloadedArtifactFile -Root $runtimeRoot -FileName "freex-$runtime-macos-tester-instructions.md" -ArtifactName $artifactName
              $evidence = Find-DownloadedArtifactFile -Root $runtimeRoot -FileName "freex-$runtime-macos-evidence.txt" -ArtifactName $artifactName

              $versionedZip = Copy-ReleaseAsset -SourcePath $innerZip -DestinationName "freex-$releaseId-$shortSha-macos-$assetLabel.zip"
              $latestZip = Copy-ReleaseAsset -SourcePath $innerZip -DestinationName "FreeX-latest-macos-$assetLabel.zip"
              Write-Sha256File -AssetPath $versionedZip
              Write-Sha256File -AssetPath $latestZip
              Copy-ReleaseAsset -SourcePath $instructions -DestinationName "FreeX-latest-macos-$assetLabel-instructions.md" | Out-Null
              Copy-ReleaseAsset -SourcePath $evidence -DestinationName "FreeX-latest-macos-$assetLabel-evidence.txt" | Out-Null
            }
          }

          if ($publicPreviewCandidate -and $missingAccessibilityGate.Count -gt 0) {
            throw "Public-preview promotion requires completed accessibility gate inputs: $($missingAccessibilityGate -join ', ')."
          }

          function Format-GateStatus {
            param([bool]$Complete)
            if ($Complete) { return "recorded" }
            return "missing"
          }

          $keyboardOnlyStatus = Format-GateStatus $accessibilityGate["Keyboard-only smoke validation"]
          $screenReaderStatus = Format-GateStatus $accessibilityGate["Screen-reader smoke validation"]
          $uiaCatalogStatus = Format-GateStatus $accessibilityGate["UI Automation catalog review"]
          $knownIssuesStatus = Format-GateStatus $accessibilityGate["Known accessibility issues reviewed/listed"]
          $promotionStatus = if ($publicPreviewCandidate) {
            "All public-preview accessibility gate inputs were completed; this build is public-preview eligible."
          } else {
            "This build is internal-only unless release notes separately document a completed public-preview accessibility gate."
          }
          $macOsTesterSection = if ($includeMacOsPreview) {
            @"
          macOS tester downloads:
          - Apple Silicon: FreeX-latest-macos-arm64.zip and FreeX-latest-macos-arm64.zip.sha256
          - Intel Mac: FreeX-latest-macos-x64.zip and FreeX-latest-macos-x64.zip.sha256
          - Per-runtime instructions and evidence files are attached when macOS preview bundling is enabled.

          macOS tester steps:
          1. Pick arm64 for Apple Silicon Macs or x64 for Intel Macs.
          2. Verify the checksum from Terminal: shasum -a 256 -c FreeX-latest-macos-arm64.zip.sha256, or use the x64 checksum for Intel.
          3. Extract the app with Finder/Archive Utility, or run: ditto -x -k FreeX-latest-macos-arm64.zip .
          4. Open FreeX.app. If macOS blocks the unsigned/internal preview, use Control-click or right-click > Open. If needed, open System Settings > Privacy & Security and choose Open Anyway.
          5. Do not disable Gatekeeper globally. These macOS builds are internal previews until Developer ID signing, notarization, and stapling evidence are attached.

          $($macOsNotes -join "`n")
          "@
          } else {
            @"
          macOS tester downloads:
          macOS preview assets are not attached to this release. Dispatch Tester Release with include_macos_preview=true after a successful same-commit macOS App Preview run to bundle macOS zips.
          "@
          }

          $notes = @"
          Tester build for FreeX.

          Commit: ${{ github.sha }}
          Download the stable latest asset: FreeX-latest-win-x64.exe
          Checksum for the latest single-file asset: FreeX-latest-win-x64.exe.sha256
          MSIX package: FreeX-latest-win-x64.msix
          Checksum for the latest MSIX package: FreeX-latest-win-x64.msix.sha256

          This is a framework-dependent single-file Windows x64 build. It requires the Microsoft .NET Desktop Runtime if Windows prompts for it.
          The MSIX package is signed when the release certificate secret is configured; otherwise it is published unsigned for tester continuity until a certificate is available. Installer trust validation and Store submission remain release-gate tasks.

          Windows tester steps:
          1. Download FreeX-latest-win-x64.exe and FreeX-latest-win-x64.exe.sha256 from this release.
          2. Verify the checksum with PowerShell: Get-FileHash .\FreeX-latest-win-x64.exe -Algorithm SHA256, then compare it with FreeX-latest-win-x64.exe.sha256.
          3. Run FreeX-latest-win-x64.exe. If Windows SmartScreen warns about an unknown publisher, continue only if the checksum matches this GitHub release and you expected this internal tester build.
          4. Prefer the .exe for normal testing. Use the MSIX only for package/install validation; unsigned MSIX packages may need trusted internal-test machine settings until signing is configured.

          $macOsTesterSection

          Tester message:
          This is an internal preview while signing certificates are pending. macOS and Windows may warn that the publisher cannot be verified. Only open the build if you expected this test release from the FreeX team and the checksum matches the release asset.

          Public-preview accessibility gate:
          - Keyboard-only smoke validation: $keyboardOnlyStatus.
          - Screen-reader smoke validation: $screenReaderStatus.
          - UI Automation catalog review: $uiaCatalogStatus.
          - Known accessibility issues reviewed/listed: $knownIssuesStatus.

          $promotionStatus
          "@
          $extraNotes = $env:FREEX_RELEASE_NOTES
          if (-not [string]::IsNullOrWhiteSpace($extraNotes)) {
            $notes = $notes.TrimEnd() + @"


          Additional tester notes:

          $extraNotes
          "@
          }

          $releaseExists = $false
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            $releaseExists = $true
          }

          $prereleaseArgs = @()
          if ("${{ inputs.prerelease }}" -eq "true") {
            $prereleaseArgs += "--prerelease"
          }

          $latestArgs = @()
          if ("${{ inputs.prerelease }}" -ne "true") {
            $latestArgs += "--latest"
          }

          $assetPaths = @(
            "artifacts/upload/*.exe",
            "artifacts/upload/*.exe.sha256",
            "artifacts/upload/*.msix",
            "artifacts/upload/*.msix.sha256",
            # Velopack installer, portable zip, full nupkg, and the RELEASES/assets feed clients poll.
            "artifacts/velopack/*"
          )
          if ($includeMacOsPreview) {
            $assetPaths += @(
              "artifacts/upload/*.zip",
              "artifacts/upload/*.zip.sha256",
              "artifacts/upload/FreeX-latest-macos-*-instructions.md",
              "artifacts/upload/FreeX-latest-macos-*-evidence.txt"
            )
          }

          if ($releaseExists) {
            gh release upload $tag @assetPaths --clobber
            gh release edit $tag --title $title --notes $notes @prereleaseArgs @latestArgs
          } else {
            gh release create $tag @assetPaths --target $env:GITHUB_SHA --title $title --notes $notes --draft @prereleaseArgs
            gh release edit $tag --draft=false @latestArgs
          }
