name: FreeW Release

# Manual-only release channel for the FreeW WPF word processor, mirroring the
# Linux Avalonia release lane. Produces a self-contained win-x64 build, zips it,
# and uploads the artifact. This lane is intentionally NOT run on push/PR.
# Dispatch with:
#   gh workflow run freew-release.yml --ref <branch> -f release_version=0.1.0
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version, for example 0.1.0
        required: true
        default: "0.1.0"
        type: string

permissions:
  contents: read

concurrency:
  group: freew-release
  cancel-in-progress: false

jobs:
  build:
    name: FreeW release build (win-x64)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.111

      - name: Publish self-contained win-x64 build + zip
        shell: pwsh
        run: ./freew/build/publish-windows.ps1 -Version "${{ inputs.release_version }}"

      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: FreeW-win-x64-${{ inputs.release_version }}
          path: artifacts/FreeW-win-x64-${{ inputs.release_version }}.zip
          if-no-files-found: error
          retention-days: 14
