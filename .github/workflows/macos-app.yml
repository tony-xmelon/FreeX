            grep -q "native_unmerge_cells_menu_item=true" "$launch_smoke_report"
            grep -q "native_decrease_indent_menu_item=true" "$launch_smoke_report"
            grep -q "native_increase_indent_menu_item=true" "$launch_smoke_report"
            grep -q "native_align_left_menu_item=true" "$launch_smoke_report"
            grep -q "native_align_center_menu_item=true" "$launch_smoke_report"
            grep -q "native_align_right_menu_item=true" "$launch_smoke_report"
            grep -q "native_show_gridlines_menu_item=true" "$launch_smoke_report"
            grep -q "native_show_headings_menu_item=true" "$launch_smoke_report"
            grep -q "native_zoom_in_menu_item=true" "$launch_smoke_report"
            grep -q "native_zoom_out_menu_item=true" "$launch_smoke_report"
            grep -q "native_zoom_100_menu_item=true" "$launch_smoke_report"
            grep -q "native_zoom_to_selection_menu_item=true" "$launch_smoke_report"
            grep -q "native_freeze_panes_menu_item=true" "$launch_smoke_report"
            grep -q "native_freeze_top_row_menu_item=true" "$launch_smoke_report"
            grep -q "native_freeze_first_column_menu_item=true" "$launch_smoke_report"
            grep -q "native_unfreeze_panes_menu_item=true" "$launch_smoke_report"
            grep -q "native_show_formulas_menu_item=true" "$launch_smoke_report"
            grep -q "native_minimize_window_menu_item=true" "$launch_smoke_report"
            grep -q "native_zoom_window_menu_item=true" "$launch_smoke_report"
            grep -q "native_bring_all_to_front_menu_item=true" "$launch_smoke_report"
            grep -q "native_help_online_menu_item=true" "$launch_smoke_report"
            grep -q "native_send_feedback_menu_item=true" "$launch_smoke_report"
            grep -q "native_check_for_updates_menu_item=true" "$launch_smoke_report"
            grep -q "native_about_menu_item=true" "$launch_smoke_report"
            grep -q "native_legal_notices_menu_item=true" "$launch_smoke_report"
            grep -q "native_quit_menu_item=true" "$launch_smoke_report"

            open_with_smoke_file="$RUNNER_TEMP/freex-$runtime-open-with.csv"
            printf 'Name,Amount\nFreeX Open With,126\n' > "$open_with_smoke_file"
            run_bounded_launchservices_smoke "open_with" "$open_with_report" \
              run_launchservices_with_validation "$open_with_report" "$open_with_smoke_file" \
                open -W -n -a "$app_path" "$open_with_smoke_file"
            grep -q "macos_launch_smoke=passed" "$open_with_report"
            grep -q "app_diagnostics_directory_configured=true" "$open_with_report"
            grep -q "window_shown=true" "$open_with_report"
            grep -q "opened_source_path=.*freex-$runtime-open-with.csv" "$open_with_report"
            grep -q "viewport_rows=[1-9]" "$open_with_report"
            grep -q "viewport_columns=[1-9]" "$open_with_report"
            grep -q "native_open_recent_menu_item=true" "$open_with_report"
            grep -q "native_open_recent_item_count=[1-9]" "$open_with_report"

            default_open_smoke_file="$RUNNER_TEMP/freex-$runtime-default-open.fxl"
            printf '%s\n' \
              '{' \
              '  "FileFormat": "FreeX.NativeJsonWorkbook",' \
              '  "SchemaVersion": 1,' \
              '  "MinimumReaderVersion": 1,' \
              '  "Name": "macOS Default Open Smoke",' \
              '  "Sheets": [' \
              '    {' \
              '      "Name": "Default Open"' \
              '    }' \
              '  ]' \
              '}' > "$default_open_smoke_file"
            run_bounded_launchservices_smoke "default_open" "$default_open_report" \
              run_launchservices_with_validation "$default_open_report" "$default_open_smoke_file" \
                open -W -n "$default_open_smoke_file"
            grep -q "macos_launch_smoke=passed" "$default_open_report"
            grep -q "app_diagnostics_directory_configured=true" "$default_open_report"
            grep -q "window_shown=true" "$default_open_report"
            grep -q "opened_source_path=.*freex-$runtime-default-open.fxl" "$default_open_report"
            grep -q "viewport_rows=[1-9]" "$default_open_report"
            grep -q "viewport_columns=[1-9]" "$default_open_report"
            grep -q "native_open_recent_menu_item=true" "$default_open_report"
            grep -q "native_open_recent_item_count=[1-9]" "$default_open_report"
            grep -q "launchservices_default_open_attempted=true" "$default_open_report"
            grep -q "launchservices_default_open_app_override=false" "$default_open_report"
            grep -q "launchservices_default_open_document_extension=fxl" "$default_open_report"
            grep -q "launchservices_default_open_boundary=ci_open_document_without_app_override_not_finder_double_click" "$default_open_report"

            app_diagnostics_events_path="$app_diagnostics_dir/events.jsonl"
            app_diagnostics_crash_reports_dir="$app_diagnostics_dir/CrashReports"
            if [[ -d "$app_diagnostics_crash_reports_dir" ]]; then
              app_diagnostics_crash_count="$(find "$app_diagnostics_crash_reports_dir" -type f -name '*.json' | wc -l | tr -d ' ')"
            else
              app_diagnostics_crash_count=0
            fi
            {
              echo "app_diagnostics_artifact=freex-$runtime-macos-app-diagnostics"
              echo "app_diagnostics_events_jsonl=true"
              echo "app_diagnostics_crash_report_count=$app_diagnostics_crash_count"
            } >> "$evidence_path"
            test -f "$app_diagnostics_events_path"
            grep -q '"eventName":"app_start"' "$app_diagnostics_events_path"
            grep -q '"eventName":"app_ready"' "$app_diagnostics_events_path"
            grep -q '"eventName":"macos_launch_smoke"' "$app_diagnostics_events_path"
          else
            echo "Skipping launch smoke for $runtime on $host_arch host." | tee "$smoke_log"
            echo "smoke_status=skipped_host_arch_mismatch" >> "$evidence_path"
            echo "macos_launch_smoke=skipped_host_arch_mismatch" > "$launch_smoke_report"
            echo "macos_launch_smoke=skipped_host_arch_mismatch" > "$open_with_report"
            echo "macos_launch_smoke=skipped_host_arch_mismatch" > "$default_open_report"
            echo "app_artifact_upload_blocked=host_arch_mismatch" >> "$evidence_path"
            rm -f "$zip_path" "$zip_path.sha256"
            echo "Host/runtime architecture mismatch for $runtime on $host_arch cannot publish a macOS app artifact." | tee -a "$smoke_log" >&2
            exit 1
          fi

          tester_channel_summary="This artifact is a macOS port validation build. Internal-preview artifacts are not a public release channel; distribution-candidate artifacts must show Developer ID signing, accepted notarization, stapler validation, and accepted Gatekeeper assessment in evidence."
          tester_internal_preview_summary=""
          tester_open_guidance="If artifact_channel=distribution-candidate, reject the artifact unless it has Developer ID signing, accepted notarization, stapling evidence, and gatekeeper_assessment_status=accepted from gatekeeper_assessment_source=Notarized Developer ID."
          tester_internal_preview_open_guidance=""
          if [[ "$distribution_candidate" != "true" ]]; then
            tester_internal_preview_summary="For artifact_channel=internal-preview: This artifact is a preview build for macOS port validation. It is not a public release channel."
            tester_open_guidance="If artifact_channel=internal-preview, ad-hoc signed or non-notarized previews may require Control-click or right-click > Open for trusted internal testing."
            tester_internal_preview_open_guidance="For artifact_channel=internal-preview: Ad-hoc signed or non-notarized previews may require Control-click or right-click > Open for trusted internal testing."
          fi

          cat > "$tester_instructions_path" <<EOF
          # FreeX macOS App ($artifact_channel, $runtime)

          $tester_channel_summary
          $tester_internal_preview_summary

          Use osx-arm64 for Apple Silicon Macs and osx-x64 for Intel Macs. Unzip the GitHub Actions artifact wrapper first; these files are inside it.

          ## Download

          Download these files from the same GitHub Actions artifact:

          - $zip_name
          - $zip_name.sha256
          - freex-$runtime-macos-evidence.txt
          - freex-$runtime-macos-packaging-smoke.log
          - freex-$runtime-macos-launch-smoke.txt
          - freex-$runtime-macos-open-with-launch-smoke.txt
          - freex-$runtime-macos-default-open-launch-smoke.txt
          - freex-$runtime-macos-notarization.log

          ## Verify

          Run this in Terminal from the directory containing the downloaded files:

          \`\`\`bash
          shasum -a 256 -c $zip_name.sha256
          \`\`\`

          Expected result:

          \`\`\`text
          $zip_name: OK
          \`\`\`

          ## Open

          Extract $zip_name with Finder/Archive Utility, or run ditto -x -k $zip_name . from Terminal, then open FreeX.app. If macOS Gatekeeper blocks the preview, check freex-$runtime-macos-evidence.txt first:

          - artifact_channel=$artifact_channel
          - distribution_candidate=$distribution_candidate
          - distribution_readiness=$distribution_readiness
          - codesign_mode=$signing_mode
          - notarization_status=$notarization_status
          - stapler_validated=$stapler_validated
          - gatekeeper_assessment_attempted=true
          - gatekeeper_assessment_required=$gatekeeper_assessment_required
          - gatekeeper_assessment_status=$gatekeeper_assessment_status
          - gatekeeper_assessment_source=$gatekeeper_assessment_source
          - zip_sha256=$zip_sha256

          $tester_open_guidance
          $tester_internal_preview_open_guidance

          ## Report

          When filing feedback, include the runtime ($runtime), the GitHub Actions run, freex-$runtime-macos-evidence.txt, the matching macOS diagnostics artifact, and the smoke logs when relevant.
          EOF

      - name: Require hosted smoke before app artifact upload
        shell: bash
        env:
          FREEX_RUNTIME: ${{ matrix.runtime }}
        run: |
          set -euo pipefail

          runtime="$FREEX_RUNTIME"
          artifact_root="$GITHUB_WORKSPACE/artifacts"
          evidence_path="$artifact_root/freex-$runtime-macos-evidence.txt"
          launch_smoke_report="$artifact_root/freex-$runtime-macos-launch-smoke.txt"
          open_with_report="$artifact_root/freex-$runtime-macos-open-with-launch-smoke.txt"
          default_open_report="$artifact_root/freex-$runtime-macos-default-open-launch-smoke.txt"

          if grep -q "^smoke_status=skipped_host_arch_mismatch$" "$evidence_path"; then
            echo "Host/runtime architecture mismatch for $runtime cannot publish a macOS app artifact." >&2
            exit 1
          fi

          grep -q "^smoke_status=passed$" "$evidence_path"
          grep -q "^macos_launch_smoke=passed$" "$launch_smoke_report"
          grep -q "^macos_launch_smoke=passed$" "$open_with_report"
          grep -q "^macos_launch_smoke=passed$" "$default_open_report"

      - name: Pack Velopack (macOS)
        shell: bash
        env:
          FREEX_RUNTIME: ${{ matrix.runtime }}
        run: |
          set -euo pipefail

          runtime="$FREEX_RUNTIME"
          output_root="$RUNNER_TEMP/freex-$runtime"
          app="$output_root/FreeX.app"
          artifact_root="$GITHUB_WORKSPACE/artifacts"
          vpk_out="$artifact_root/velopack-$runtime"

          test -d "$app"
          app_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")"

          dotnet tool install -g vpk || true
          export PATH="$PATH:$HOME/.dotnet/tools"

          rm -rf "$vpk_out"
          mkdir -p "$vpk_out"

          # packId "FreeXApp" (not "FreeX") so the Velopack install location stays distinct from
          # the app's own data directory, matching the Windows pack. packTitle stays "FreeX".
          vpk pack \
            --packId FreeXApp \
            --packVersion "$app_version" \
            --packDir "$app" \
            --mainExe FreeX \
            --outputDir "$vpk_out" \
            --packTitle FreeX \
            --channel osx

          echo "Created Velopack artifacts in $vpk_out"
          ls -1 "$vpk_out"

      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: freex-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.runtime }}-macos-app
          path: |
            artifacts/freex-${{ matrix.runtime }}-macos-app.zip
            artifacts/freex-${{ matrix.runtime }}-macos-app.zip.sha256
            artifacts/freex-${{ matrix.runtime }}-macos-evidence.txt
            artifacts/freex-${{ matrix.runtime }}-macos-packaging-smoke.log
            artifacts/freex-${{ matrix.runtime }}-macos-launch-smoke.txt
            artifacts/freex-${{ matrix.runtime }}-macos-open-with-launch-smoke.txt
            artifacts/freex-${{ matrix.runtime }}-macos-default-open-launch-smoke.txt
            artifacts/freex-${{ matrix.runtime }}-macos-notarization.log
            artifacts/freex-${{ matrix.runtime }}-macos-tester-instructions.md
            artifacts/velopack-${{ matrix.runtime }}/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload app diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: freex-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.runtime }}-macos-diagnostics
          path: |
            artifacts/freex-${{ matrix.runtime }}-macos-evidence.txt
            artifacts/freex-${{ matrix.runtime }}-macos-packaging-smoke.log
            artifacts/freex-${{ matrix.runtime }}-macos-launch-smoke.txt
            artifacts/freex-${{ matrix.runtime }}-macos-open-with-launch-smoke.txt
            artifacts/freex-${{ matrix.runtime }}-macos-default-open-launch-smoke.txt
            artifacts/freex-${{ matrix.runtime }}-macos-notarization.log
            artifacts/freex-${{ matrix.runtime }}-macos-tester-instructions.md
            artifacts/freex-${{ matrix.runtime }}-portable-pdf-exporter-tests.trx
            artifacts/freex-${{ matrix.runtime }}-export-path-tests.trx
            artifacts/freex-${{ matrix.runtime }}-macos-app-diagnostics/**
            artifacts/freex-${{ matrix.runtime }}-macos-app.zip
            artifacts/freex-${{ matrix.runtime }}-macos-app.zip.sha256
          if-no-files-found: warn
          retention-days: 14

  macos-tfm-build:
    name: macOS TFM compile validation (${{ matrix.runtime }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.validate_macos_tfm == true }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: osx-arm64
            arch: arm64
            runner: macos-26
          - runtime: osx-x64
            arch: x64
            runner: macos-26-intel

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      FREEX_DOTNET_WORKLOAD_SET_VERSION: 10.0.300.3
      FREEX_MACOS_ARCH: ${{ matrix.arch }}
      FREEX_MACOS_TFM: net10.0-macos
      FREEX_MACOS_TFM_EVIDENCE: artifacts/freex-${{ matrix.arch }}-macos-tfm-build-evidence.txt
      FREEX_RUNTIME: ${{ matrix.runtime }}
      FREEX_XCODE_PATH: /Applications/Xcode_26.5.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.300

      - name: Capture macOS TFM toolchain evidence
        shell: bash
        run: |
          set -euo pipefail

          test -d "$FREEX_XCODE_PATH"
          sudo xcode-select -s "$FREEX_XCODE_PATH"

          mkdir -p "$(dirname "$FREEX_MACOS_TFM_EVIDENCE")"
          {
            echo "runtime=$FREEX_RUNTIME"
            echo "arch=$FREEX_MACOS_ARCH"
            echo "macos_tfm=$FREEX_MACOS_TFM"
            echo "dotnet_workload_set_version=$FREEX_DOTNET_WORKLOAD_SET_VERSION"
            echo "github_run_id=${GITHUB_RUN_ID}"
            echo "github_run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "runner_label=${{ matrix.runner }}"
            echo "runner_os=${RUNNER_OS:-unknown}"
            echo "runner_arch=${RUNNER_ARCH:-unknown}"
            echo "image_os=${ImageOS:-unknown}"
            echo "image_version=${ImageVersion:-unknown}"
            echo "xcode_path=$FREEX_XCODE_PATH"
            echo "[sw_vers]"
            sw_vers
            echo "[uname -m]"
            uname -m
            echo "[dotnet --version]"
            dotnet --version
            echo "[dotnet --info]"
            dotnet --info
            echo "[xcodebuild -version]"
            xcodebuild -version
            echo "[dotnet workload search macos]"
            dotnet workload search macos
            echo "[dotnet workload list before install]"
            dotnet workload list || true
          } | tee "$FREEX_MACOS_TFM_EVIDENCE"

      - name: Install macOS workload
        shell: bash
        run: |
          set -euo pipefail

          {
            echo ""
            echo "[dotnet workload install macos]"
            dotnet workload install macos --version "$FREEX_DOTNET_WORKLOAD_SET_VERSION"
            echo "[dotnet workload --info]"
            dotnet workload --info
            echo "[dotnet workload list after install]"
            dotnet workload list
            echo "macos_tfm_workload=installed"
          } | tee -a "$FREEX_MACOS_TFM_EVIDENCE"

      - name: Build opt-in macOS TFM
        shell: bash
        run: |
          set -euo pipefail

          compile_items_path="artifacts/freex-${FREEX_MACOS_ARCH}-macos-tfm-compile-items-evidence.txt"

          dotnet build src/FreeX.App.Avalonia/FreeX.App.Avalonia.csproj \
            --configuration Release \
            --framework "$FREEX_MACOS_TFM" \
            --runtime "$FREEX_RUNTIME" \
            -p:EnableMacOsTargetFramework=true \
            -p:ApplicationId=io.github.tony-xmelon.freex \
            -p:ILLinkTreatWarningsAsErrors=false \
            -p:NoWarn=IL2026

          dotnet msbuild src/FreeX.App.Avalonia/FreeX.App.Avalonia.csproj \
            -p:Configuration=Release \
            -p:EnableMacOsTargetFramework=true \
            -p:TargetFramework="$FREEX_MACOS_TFM" \
            -p:RuntimeIdentifier="$FREEX_RUNTIME" \
            -p:ApplicationId=io.github.tony-xmelon.freex \
            -getItem:Compile \
            > "$compile_items_path"

          grep -q "MacOsWorkbookShareSheetService.cs" "$compile_items_path"

          {
            echo "macos_tfm_build=passed"
            echo "macos_tfm=$FREEX_MACOS_TFM"
            echo "runtime=$FREEX_RUNTIME"
            echo "macos_tfm_source_boundary=src/FreeX.App.Avalonia/MacOs"
            echo "macos_tfm_native_share_sheet_source=src/FreeX.App.Avalonia/MacOs/MacOsWorkbookShareSheetService.cs"
            echo "macos_tfm_native_source_compiled=true"
            echo "macos_tfm_compile_items_artifact=freex-${FREEX_MACOS_ARCH}-macos-tfm-compile-items-evidence.txt"
            echo "macos_tfm_artifact_channel=evidence-only"
          } | tee -a "$FREEX_MACOS_TFM_EVIDENCE"

      - name: Upload macOS TFM build evidence
        uses: actions/upload-artifact@v7
        with:
          name: freex-${{ github.run_id }}-${{ github.run_attempt }}-macos-tfm-build-${{ matrix.arch }}-evidence
          path: artifacts/freex-${{ matrix.arch }}-macos-tfm-*-evidence.txt
          if-no-files-found: error
          retention-days: 14

  macos-preview-readiness:
    name: Aggregate macOS preview evidence
    needs: macos-app
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download macOS preview artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: "freex-${{ github.run_id }}-${{ github.run_attempt }}-osx-*-macos-*"
          path: artifacts/macos-preview-evidence
          merge-multiple: false

      - name: Validate aggregate readiness
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          $artifactRoot = Join-Path $env:GITHUB_WORKSPACE "artifacts/macos-preview-evidence"
          $expectedWrapperNames = @(
            "freex-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-osx-arm64-macos-app",
            "freex-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-osx-arm64-macos-diagnostics",
            "freex-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-osx-x64-macos-app",
            "freex-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-osx-x64-macos-diagnostics"
          )
          if (-not (Test-Path -LiteralPath $artifactRoot -PathType Container)) {
            throw "Downloaded macOS preview artifact root was not found: $artifactRoot"
          }

          $downloadedWrapperNames = @(Get-ChildItem -LiteralPath $artifactRoot -Directory | ForEach-Object { $_.Name } | Sort-Object)
          $missingWrapperNames = @($expectedWrapperNames | Where-Object { $downloadedWrapperNames -cnotcontains $_ })
          $unexpectedWrapperNames = @($downloadedWrapperNames | Where-Object { $expectedWrapperNames -cnotcontains $_ })
          if ($missingWrapperNames.Count -gt 0) {
            throw "Missing downloaded macOS preview artifact wrapper(s): $($missingWrapperNames -join ', ')"
          }
          if ($unexpectedWrapperNames.Count -gt 0) {
            throw "Unexpected downloaded macOS preview artifact wrapper(s): $($unexpectedWrapperNames -join ', ')"
          }

          $arguments = @{
            ArtifactRoot = $artifactRoot
            ExpectedRunId = $env:GITHUB_RUN_ID
            ExpectedRunAttempt = $env:GITHUB_RUN_ATTEMPT
            RequireSeparateDiagnosticsArtifact = $true
          }
          if ("${{ github.event_name == 'workflow_dispatch' && inputs.distribution_candidate == true }}" -eq "true") {
            $arguments.DistributionCandidate = $true
          }

          & (Join-Path $env:GITHUB_WORKSPACE "tools/Test-MacOsPublicPreviewReadiness.ps1") @arguments

      - name: Write aggregate manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          $artifactRoot = Join-Path $env:GITHUB_WORKSPACE "artifacts/macos-preview-evidence"
          $outputRoot = Join-Path $env:GITHUB_WORKSPACE "artifacts/macos-preview-readiness"
          Remove-Item -LiteralPath $outputRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $outputRoot | Out-Null

          $artifactDigestByName = @{}
          $artifactRows = @(gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID/artifacts?per_page=100" --jq '.artifacts[] | [.name, (.digest // "")] | @tsv')
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to query current run artifacts."
          }

          foreach ($row in $artifactRows) {
            $parts = $row -split "`t", 2
            if ($parts.Count -eq 2 -and -not [string]::IsNullOrWhiteSpace($parts[0])) {
              $artifactDigestByName[$parts[0]] = $parts[1]
            }
          }

          function Get-LatestEvidenceMarkers {
            param(
              [Parameter(Mandatory = $true)][string]$Path,
              [Parameter(Mandatory = $true)][string[]]$Keys
            )

            $markers = [ordered]@{}
            $lines = @(Get-Content -LiteralPath $Path)
            foreach ($key in $Keys) {
              $value = $null
              $escapedKey = [System.Text.RegularExpressions.Regex]::Escape($key)
              foreach ($line in $lines) {
                $match = [System.Text.RegularExpressions.Regex]::Match($line, "^$escapedKey=(.*)$")
                if ($match.Success) {
                  $value = $match.Groups[1].Value
                }
              }

              $markers[$key] = $value
            }

            return $markers
          }

          function Find-DownloadedArtifactFile {
            param(
              [Parameter(Mandatory = $true)][string]$Root,
              [Parameter(Mandatory = $true)][string]$FileName,
              [Parameter(Mandatory = $true)][string]$ArtifactName
            )

            $matches = @(Get-ChildItem -LiteralPath $Root -Recurse -File -Filter $FileName)
            if ($matches.Count -eq 0) {
              throw "macOS artifact '$ArtifactName' is missing required file '$FileName' under '$Root'."
            }
            if ($matches.Count -gt 1) {
              $matchList = ($matches | ForEach-Object { $_.FullName }) -join ', '
              throw "macOS artifact '$ArtifactName' contains multiple '$FileName' files: $matchList."
            }

            return $matches[0].FullName
          }

          $markerKeys = @(
            "github_run_id",
            "github_run_attempt",
            "artifact_channel",
            "distribution_candidate",
            "distribution_readiness",
            "smoke_status",
            "artifact_bundle_metadata_subject",
            "bundle_executable",
            "bundle_icon",
            "bundle_identifier",
            "bundle_package_type",
            "bundle_minimum_system_version",
            "bundle_high_resolution_capable",
            "artifact_document_extensions_subject",
            "native_document_type",
            "native_document_extension",
            "native_document_extensions",
            "native_document_handler_rank",
            "imported_document_type",
            "imported_document_extension",
            "imported_document_extensions",
            "imported_document_handler_rank",
            "codesign_mode",
            "notarization_status",
            "stapler_validated",
            "gatekeeper_assessment_status",
            "gatekeeper_assessment_source",
            "zip_sha256"
          )

          $runtimeEntries = @()
          foreach ($runtime in @("osx-arm64", "osx-x64")) {
            $appArtifactName = "freex-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$runtime-macos-app"
            $diagnosticsArtifactName = "freex-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$runtime-macos-diagnostics"
            $appDirectory = Join-Path $artifactRoot $appArtifactName
            $diagnosticsDirectory = Join-Path $artifactRoot $diagnosticsArtifactName
            if (-not (Test-Path -LiteralPath $appDirectory -PathType Container)) {
              throw "Downloaded app artifact wrapper was not found: $appArtifactName"
            }
            if (-not (Test-Path -LiteralPath $diagnosticsDirectory -PathType Container)) {
              throw "Downloaded diagnostics artifact wrapper was not found: $diagnosticsArtifactName"
            }

            $zipPath = Find-DownloadedArtifactFile -Root $appDirectory -FileName "freex-$runtime-macos-app.zip" -ArtifactName $appArtifactName
            $checksumPath = Find-DownloadedArtifactFile -Root $appDirectory -FileName "freex-$runtime-macos-app.zip.sha256" -ArtifactName $appArtifactName
            $evidencePath = Find-DownloadedArtifactFile -Root $appDirectory -FileName "freex-$runtime-macos-evidence.txt" -ArtifactName $appArtifactName
            $zipSha256 = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
            $checksumText = (Get-Content -LiteralPath $checksumPath -Raw).Trim()
            $evidenceMarkers = Get-LatestEvidenceMarkers -Path $evidencePath -Keys $markerKeys

            $runtimeEntries += [ordered]@{
              runtime = $runtime
              app_artifact = $appArtifactName
              app_artifact_digest = $artifactDigestByName[$appArtifactName]
              diagnostics_artifact = $diagnosticsArtifactName
              diagnostics_artifact_digest = $artifactDigestByName[$diagnosticsArtifactName]
              zip_sha256 = $zipSha256
              checksum_file = $checksumText
              evidence_file = "freex-$runtime-macos-evidence.txt"
              evidence_markers = $evidenceMarkers
            }
          }

          $manifest = [ordered]@{
            schema = "io.github.tony-xmelon.freex.macos-preview-readiness.v1"
            repository = $env:GITHUB_REPOSITORY
            workflow = $env:GITHUB_WORKFLOW
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            commit = $env:GITHUB_SHA
            generated_at_utc = (Get-Date).ToUniversalTime().ToString("o")
            source_artifact_pattern = "freex-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-osx-*-macos-*"
            readiness_script = "tools/Test-MacOsPublicPreviewReadiness.ps1"
            require_separate_diagnostics_artifact = $true
            runtimes = $runtimeEntries
          }

          $manifestPath = Join-Path $outputRoot "macos-preview-readiness-manifest.json"
          $manifest | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $manifestPath -Encoding ascii

          $summaryLines = @(
            "macos_preview_readiness=passed",
            "run_id=$env:GITHUB_RUN_ID",
            "run_attempt=$env:GITHUB_RUN_ATTEMPT",
            "source_artifact_pattern=freex-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-osx-*-macos-*"
          )
          foreach ($entry in $runtimeEntries) {
            $summaryLines += "runtime=$($entry.runtime)"
            $summaryLines += "app_artifact=$($entry.app_artifact)"
            $summaryLines += "app_artifact_digest=$($entry.app_artifact_digest)"
            $summaryLines += "diagnostics_artifact=$($entry.diagnostics_artifact)"
            $summaryLines += "diagnostics_artifact_digest=$($entry.diagnostics_artifact_digest)"
            $summaryLines += "zip_sha256=$($entry.zip_sha256)"
            $summaryLines += "artifact_channel=$($entry.evidence_markers.artifact_channel)"
            $summaryLines += "distribution_readiness=$($entry.evidence_markers.distribution_readiness)"
            $summaryLines += "smoke_status=$($entry.evidence_markers.smoke_status)"
            $summaryLines += "bundle_identifier=$($entry.evidence_markers.bundle_identifier)"
            $summaryLines += "bundle_package_type=$($entry.evidence_markers.bundle_package_type)"
          }

          Set-Content -LiteralPath (Join-Path $outputRoot "macos-preview-readiness-summary.txt") -Value $summaryLines -Encoding ascii

      - name: Upload aggregate readiness
        uses: actions/upload-artifact@v7
        with:
          name: freex-${{ github.run_id }}-${{ github.run_attempt }}-macos-preview-readiness
          path: artifacts/macos-preview-readiness/*
          if-no-files-found: error
          retention-days: 14

  publish-distribution-candidate:
    name: Publish macOS distribution candidate
    needs: [macos-app, macos-preview-readiness]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.distribution_candidate == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      actions: read
      contents: write

    concurrency:
      group: macos-distribution-candidate-release
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download macOS app artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: freex-${{ github.run_id }}-${{ github.run_attempt }}-*-macos-app
          path: artifacts/macos-distribution-candidate
          merge-multiple: true

      - name: Prepare release-channel assets
        id: candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          $inputRoot = Join-Path $env:GITHUB_WORKSPACE "artifacts/macos-distribution-candidate"
          $releaseRoot = Join-Path $env:GITHUB_WORKSPACE "artifacts/macos-release-assets"
          if (-not (Test-Path -LiteralPath $inputRoot -PathType Container)) {
            throw "Downloaded macOS distribution-candidate artifact directory was not found: $inputRoot"
          }

          Remove-Item -LiteralPath $releaseRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $releaseRoot | Out-Null

          function Find-RequiredCandidateFile {
            param(
              [Parameter(Mandatory = $true)][string]$Root,
              [Parameter(Mandatory = $true)][string]$FileName
            )

            $matches = @(Get-ChildItem -LiteralPath $Root -Recurse -File -Filter $FileName)
            if ($matches.Count -ne 1) {
              throw "Expected exactly one downloaded candidate file named '$FileName', but found $($matches.Count)."
            }

            return $matches[0].FullName
          }

          function Assert-ContainsRequiredText {
            param(
              [Parameter(Mandatory = $true)][string]$Text,
              [Parameter(Mandatory = $true)][string]$Needle,
              [Parameter(Mandatory = $true)][string]$Label
            )

            if ($Text.IndexOf($Needle, [System.StringComparison]::Ordinal) -lt 0) {
              throw "$Label is missing required distribution-candidate marker: $Needle"
            }
          }

          $shortSha = (git rev-parse --short=8 HEAD).Trim()
          $releaseId = "macos-distribution-candidate-run$($env:GITHUB_RUN_NUMBER)-attempt$($env:GITHUB_RUN_ATTEMPT)-$shortSha"
          $tag = "macos-distribution-candidate-$($env:GITHUB_RUN_NUMBER)-$($env:GITHUB_RUN_ATTEMPT)-$shortSha"
          $releaseName = "FreeX macOS Distribution Candidate Run $($env:GITHUB_RUN_NUMBER) Attempt $($env:GITHUB_RUN_ATTEMPT) ($shortSha)"

          "release_id=$releaseId" >> $env:GITHUB_OUTPUT
          "short_sha=$shortSha" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "release_name=$releaseName" >> $env:GITHUB_OUTPUT

          $runtimePlans = @(
            [ordered]@{
              Runtime = "osx-arm64"
              AssetLabel = "macos-arm64"
              StableZip = "FreeX-latest-macos-arm64.zip"
            },
            [ordered]@{
              Runtime = "osx-x64"
              AssetLabel = "macos-x64"
              StableZip = "FreeX-latest-macos-x64.zip"
            }
          )

          $manifestAssets = @()
          foreach ($plan in $runtimePlans) {
            $runtime = [string]$plan.Runtime
            $assetLabel = [string]$plan.AssetLabel
            $stableZipName = [string]$plan.StableZip

            $zipPath = Find-RequiredCandidateFile -Root $inputRoot -FileName "freex-$runtime-macos-app.zip"
            $checksumPath = Find-RequiredCandidateFile -Root $inputRoot -FileName "freex-$runtime-macos-app.zip.sha256"
            $evidencePath = Find-RequiredCandidateFile -Root $inputRoot -FileName "freex-$runtime-macos-evidence.txt"
            $packagingSmokePath = Find-RequiredCandidateFile -Root $inputRoot -FileName "freex-$runtime-macos-packaging-smoke.log"
            $launchSmokePath = Find-RequiredCandidateFile -Root $inputRoot -FileName "freex-$runtime-macos-launch-smoke.txt"
            $openWithSmokePath = Find-RequiredCandidateFile -Root $inputRoot -FileName "freex-$runtime-macos-open-with-launch-smoke.txt"
            $defaultOpenSmokePath = Find-RequiredCandidateFile -Root $inputRoot -FileName "freex-$runtime-macos-default-open-launch-smoke.txt"
            $notarizationLogPath = Find-RequiredCandidateFile -Root $inputRoot -FileName "freex-$runtime-macos-notarization.log"
            $testerInstructionsPath = Find-RequiredCandidateFile -Root $inputRoot -FileName "freex-$runtime-macos-tester-instructions.md"

            $evidenceText = Get-Content -LiteralPath $evidencePath -Raw
            foreach ($marker in @(
              "artifact_channel=distribution-candidate",
              "distribution_candidate=true",
              "distribution_contract=distribution_candidate_requires_developer_id_notarization_stapling",
              "github_run_id=$($env:GITHUB_RUN_ID)",
              "github_run_attempt=$($env:GITHUB_RUN_ATTEMPT)",
              "distribution_readiness=distribution_candidate_ready",
              "smoke_status=passed",
              "codesign_verified=true",
              "codesign_mode=developer-id",
              "notarization_status=accepted",
              "stapler_validated=true",
              "gatekeeper_assessment_attempted=true",
              "gatekeeper_assessment_required=true",
              "gatekeeper_assessment_subject=unzipped_app_bundle",
              "gatekeeper_assessment_type=execute",
              "gatekeeper_assessment_exit_code=0",
              "gatekeeper_assessment_status=accepted",
              "gatekeeper_assessment_source=Notarized Developer ID",
              "zip_sha256="
            )) {
              Assert-ContainsRequiredText -Text $evidenceText -Needle $marker -Label "$runtime evidence"
            }

            $packagingSmokeText = Get-Content -LiteralPath $packagingSmokePath -Raw
            foreach ($marker in @("Packaging smoke opened", "format_cells_style_roundtrip=true", "edited, saved, and reopened")) {
              Assert-ContainsRequiredText -Text $packagingSmokeText -Needle $marker -Label "$runtime packaging smoke"
            }

            foreach ($smokeReport in @(
              [ordered]@{ Path = $launchSmokePath; Label = "$runtime launch smoke" },
              [ordered]@{ Path = $openWithSmokePath; Label = "$runtime Open With launch smoke" },
              [ordered]@{ Path = $defaultOpenSmokePath; Label = "$runtime default-open launch smoke" }
            )) {
              $smokeReportText = Get-Content -LiteralPath ([string]$smokeReport.Path) -Raw
              Assert-ContainsRequiredText -Text $smokeReportText -Needle "macos_launch_smoke=passed" -Label ([string]$smokeReport.Label)
            }

            $notarizationText = Get-Content -LiteralPath $notarizationLogPath -Raw
            foreach ($marker in @(
              "artifact_channel=distribution-candidate",
              "distribution_contract=distribution_candidate_requires_developer_id_notarization_stapling",
              "`"status`"",
              "Accepted",
              "stapler"
            )) {
              Assert-ContainsRequiredText -Text $notarizationText -Needle $marker -Label "$runtime notarization log"
            }

            $instructionsText = Get-Content -LiteralPath $testerInstructionsPath -Raw
            foreach ($marker in @("distribution-candidate", "Developer ID", "notarization", "stapling", "reject")) {
              Assert-ContainsRequiredText -Text $instructionsText -Needle $marker -Label "$runtime tester instructions"
            }

            $actualHash = (Get-FileHash -LiteralPath $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()
            $checksumText = Get-Content -LiteralPath $checksumPath -Raw
            if ($checksumText.IndexOf($actualHash, [System.StringComparison]::OrdinalIgnoreCase) -lt 0) {
              throw "$runtime checksum file does not match the downloaded signed/notarized app zip."
            }

            $stableZipPath = Join-Path $releaseRoot $stableZipName
            Copy-Item -LiteralPath $zipPath -Destination $stableZipPath -Force
            Set-Content -LiteralPath "$stableZipPath.sha256" -Value "$actualHash  $stableZipName" -Encoding ascii

            $stableEvidenceName = "FreeX-latest-$assetLabel-evidence.txt"
            $stablePackagingSmokeName = "FreeX-latest-$assetLabel-packaging-smoke.log"
            $stableLaunchSmokeName = "FreeX-latest-$assetLabel-launch-smoke.txt"
            $stableOpenWithSmokeName = "FreeX-latest-$assetLabel-open-with-launch-smoke.txt"
            $stableDefaultOpenSmokeName = "FreeX-latest-$assetLabel-default-open-launch-smoke.txt"
            $stableNotarizationName = "FreeX-latest-$assetLabel-notarization.log"
            $stableInstructionsName = "FreeX-latest-$assetLabel-tester-instructions.md"

            Copy-Item -LiteralPath $evidencePath -Destination (Join-Path $releaseRoot $stableEvidenceName) -Force
            Copy-Item -LiteralPath $packagingSmokePath -Destination (Join-Path $releaseRoot $stablePackagingSmokeName) -Force
            Copy-Item -LiteralPath $launchSmokePath -Destination (Join-Path $releaseRoot $stableLaunchSmokeName) -Force
            Copy-Item -LiteralPath $openWithSmokePath -Destination (Join-Path $releaseRoot $stableOpenWithSmokeName) -Force
            Copy-Item -LiteralPath $defaultOpenSmokePath -Destination (Join-Path $releaseRoot $stableDefaultOpenSmokeName) -Force
            Copy-Item -LiteralPath $notarizationLogPath -Destination (Join-Path $releaseRoot $stableNotarizationName) -Force
            Copy-Item -LiteralPath $testerInstructionsPath -Destination (Join-Path $releaseRoot $stableInstructionsName) -Force

            $manifestAssets += [ordered]@{
              runtime = $runtime
              asset_label = $assetLabel
              original_zip = "freex-$runtime-macos-app.zip"
              stable_zip = $stableZipName
              stable_zip_checksum = "$stableZipName.sha256"
              sha256 = $actualHash
              evidence = $stableEvidenceName
              packaging_smoke_log = $stablePackagingSmokeName
              launch_smoke_report = $stableLaunchSmokeName
              open_with_launch_smoke_report = $stableOpenWithSmokeName
              default_open_launch_smoke_report = $stableDefaultOpenSmokeName
              notarization_log = $stableNotarizationName
              tester_instructions = $stableInstructionsName
            }
          }

          $manifestPath = Join-Path $releaseRoot "FreeX-latest-macos-distribution-candidate-manifest.json"
          $manifest = [ordered]@{
            schema = "io.github.tony-xmelon.freex.macos-distribution-candidate.v1"
            release_id = $releaseId
            tag = $tag
            repository = $env:GITHUB_REPOSITORY
            workflow = $env:GITHUB_WORKFLOW
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
            release_assets_artifact = "freex-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)-macos-release-assets"
            commit = $env:GITHUB_SHA
            generated_at_utc = (Get-Date).ToUniversalTime().ToString("o")
            source_artifact_pattern = "freex-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)-*-macos-app"
            distribution_candidate_required_markers = @(
              "artifact_channel=distribution-candidate",
              "distribution_candidate=true",
              "distribution_readiness=distribution_candidate_ready",
              "smoke_status=passed",
              "codesign_mode=developer-id",
              "notarization_status=accepted",
              "stapler_validated=true",
              "gatekeeper_assessment_attempted=true",
              "gatekeeper_assessment_required=true",
              "gatekeeper_assessment_exit_code=0",
              "gatekeeper_assessment_status=accepted",
              "gatekeeper_assessment_source=Notarized Developer ID"
            )
            assets = $manifestAssets
          }
          $manifest | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $manifestPath -Encoding ascii

          $instructionsPath = Join-Path $releaseRoot "FreeX-latest-macos-distribution-candidate-instructions.md"
          Set-Content -LiteralPath $instructionsPath -Encoding ascii -Value @"
          # FreeX macOS Distribution Candidate

          This release was published only after both hosted runtime artifacts completed and this publication job revalidated distribution-candidate smoke evidence, Developer ID signing, accepted notarization, stapler validation, and accepted Gatekeeper assessment.

          Commit: $($env:GITHUB_SHA)
          Run: $($env:GITHUB_RUN_ID)
          Attempt: $($env:GITHUB_RUN_ATTEMPT)
          Actions artifact wrapper: freex-$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)-macos-release-assets

          ## Stable Assets

          - FreeX-latest-macos-arm64.zip for Apple Silicon Macs
          - FreeX-latest-macos-arm64.zip.sha256
          - FreeX-latest-macos-x64.zip for Intel Macs
          - FreeX-latest-macos-x64.zip.sha256
          - FreeX-latest-macos-distribution-candidate-manifest.json

          Each runtime also publishes stable evidence, packaging smoke, launch smoke, Open With launch smoke, default-open launch smoke, notarization log, and tester-instruction assets. Reject the candidate if the evidence does not show artifact_channel=distribution-candidate, distribution_readiness=distribution_candidate_ready, smoke_status=passed, codesign_mode=developer-id, notarization_status=accepted, stapler_validated=true, gatekeeper_assessment_status=accepted, and gatekeeper_assessment_source=Notarized Developer ID.

          ## Verify

          Run shasum -a 256 -c against the checksum file next to the downloaded zip before opening FreeX.app.
          "@

      - name: Upload release-channel prepared assets
        uses: actions/upload-artifact@v7
        with:
          name: freex-${{ github.run_id }}-${{ github.run_attempt }}-macos-release-assets
          path: artifacts/macos-release-assets/*
          if-no-files-found: error

      - name: Create or update GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          $tag = "${{ steps.candidate.outputs.tag }}"
          $title = "${{ steps.candidate.outputs.release_name }}"
          $notesPath = "artifacts/macos-release-assets/FreeX-latest-macos-distribution-candidate-instructions.md"
          $assetPaths = @(
            Get-ChildItem -LiteralPath "artifacts/macos-release-assets" -File |
              Sort-Object Name |
              ForEach-Object { $_.FullName }
          )
          if ($assetPaths.Count -eq 0) {
            throw "No macOS distribution-candidate release assets were prepared."
          }

          $releaseExists = $false
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            $releaseExists = $true
          }

          if ($releaseExists) {
            gh release upload $tag @assetPaths --clobber
            gh release edit $tag --title $title --notes-file $notesPath --prerelease
          } else {
            gh release create $tag @assetPaths --target $env:GITHUB_SHA --title $title --notes-file $notesPath --draft --prerelease
            gh release edit $tag --draft=false --prerelease
          }
