name: macOS App Preview

on:
  workflow_dispatch:
    inputs:
      distribution_candidate:
        description: Require Developer ID signing, accepted notarization, stapled ticket, and Gatekeeper assessment evidence.
        required: false
        type: boolean
        default: false
      validate_macos_tfm:
        description: Compile the opt-in net10.0-macos target with the hosted macOS workload; evidence only, no app artifact.
        required: false
        type: boolean
        default: false
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  macos-app:
    name: macOS app bundle (${{ matrix.runtime }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: osx-arm64
            runner: macos-15
          - runtime: osx-x64
            runner: macos-15-intel

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Capture runner toolchain evidence
        shell: bash
        run: |
          set -euo pipefail

          runtime="${{ matrix.runtime }}"
          artifact_root="$GITHUB_WORKSPACE/artifacts"
          evidence_path="$artifact_root/freex-$runtime-macos-evidence.txt"

          mkdir -p "$artifact_root"
          {
            echo "runtime=$runtime"
            echo "github_run_id=${GITHUB_RUN_ID}"
            echo "github_run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "runner_label=${{ matrix.runner }}"
            echo "runner_os=${RUNNER_OS:-unknown}"
            echo "runner_arch=${RUNNER_ARCH:-unknown}"
            echo "image_os=${ImageOS:-unknown}"
            echo "image_version=${ImageVersion:-unknown}"
            echo "[sw_vers]"
            sw_vers
            echo "[uname -m]"
            uname -m
            echo "[dotnet --info]"
            dotnet --info
            echo "[xcodebuild -version]"
            xcodebuild -version
          } | tee "$evidence_path"

      - name: Test portable PDF macOS route
        shell: bash
        run: |
          set -euo pipefail

          dotnet test tests/FreeX.App.Services.Tests/FreeX.App.Services.Tests.csproj \
            --configuration Release \
            --filter 'FullyQualifiedName~FreeX.App.Services.Tests.PortablePdfDocumentExporterTests|FullyQualifiedName~FreeX.App.Services.Tests.PortablePdfExportPlannerTests|FullyQualifiedName~FreeX.App.Services.Tests.PortablePdfPageContentPlannerTests|FullyQualifiedName~FreeX.App.Services.Tests.PortablePdfTextCapabilityPlannerTests|FullyQualifiedName~FreeX.App.Services.Tests.WorkbookExportPrintPlannerTests|FullyQualifiedName~FreeX.App.Services.Tests.DocumentShareActionPlannerWorkbookTests|FullyQualifiedName~FreeX.App.Services.Tests.WorkbookViewportScrollPlannerTests|FullyQualifiedName~FreeX.App.Services.Tests.OpenRecentWorkbookMenuPlannerTests|FullyQualifiedName~FreeX.App.Services.Tests.AppDiagnosticsFileStoreTests|FullyQualifiedName~FreeX.App.Services.Tests.AppServicesPortabilityGuardTests|FullyQualifiedName~FreeX.App.Services.Tests.AvaloniaProjectPortabilityGuardTests|FullyQualifiedName~FreeX.App.Services.Tests.ApplicationDataPathGuardTests|FullyQualifiedName~FreeX.App.Services.Tests.AppStoragePathPlannerTests|FullyQualifiedName~FreeX.App.Services.Tests.AppOptionsStoreTests|FullyQualifiedName~FreeX.App.Services.Tests.AtomicFileWriterTests|FullyQualifiedName~FreeX.App.Services.Tests.AvaloniaShellSourceTests|FullyQualifiedName~FreeX.App.Services.Tests.MacOsLaunchSmokeReportKeyDriftGuardTests' \
            --logger "trx;LogFileName=freex-${{ matrix.runtime }}-portable-pdf-exporter-tests.trx" \
            --results-directory artifacts

          dotnet test tests/FreeX.Core.Model.Tests/FreeX.Core.Model.Tests.csproj \
            --configuration Release \
            --filter 'FullyQualifiedName~FreeX.Core.Model.Tests.ExportPathPlannerTests' \
            --logger "trx;LogFileName=freex-${{ matrix.runtime }}-export-path-tests.trx" \
            --results-directory artifacts

      - name: Build app project
        shell: pwsh
        run: dotnet build src/FreeX.App.Avalonia/FreeX.App.Avalonia.csproj --configuration Release

      - name: Publish app bundle
        shell: bash
        env:
          MACOS_CODESIGN_CERTIFICATE_P12: ${{ secrets.MACOS_CODESIGN_CERTIFICATE_P12 }}
          MACOS_CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CODESIGN_CERTIFICATE_PASSWORD }}
          MACOS_DEVELOPER_ID_APPLICATION: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          FREEX_RUNTIME: ${{ matrix.runtime }}
          FREEX_DISTRIBUTION_CANDIDATE: ${{ github.event_name == 'workflow_dispatch' && inputs.distribution_candidate == true }}
        run: |
          set -euo pipefail

          runtime="$FREEX_RUNTIME"
          output_root="$RUNNER_TEMP/freex-$runtime"
          app="$output_root/FreeX.app"
          artifact_root="$GITHUB_WORKSPACE/artifacts"
          zip_name="freex-$runtime-macos-app.zip"
          zip_path="$artifact_root/$zip_name"
          evidence_path="$artifact_root/freex-$runtime-macos-evidence.txt"
          smoke_log="$artifact_root/freex-$runtime-macos-packaging-smoke.log"
          launch_smoke_report="$artifact_root/freex-$runtime-macos-launch-smoke.txt"
          packaged_product_launch_report="$RUNNER_TEMP/freex-$runtime-packaged-product-launch.txt"
          packaged_product_launch_log="$RUNNER_TEMP/freex-$runtime-packaged-product-launch.log"
          packaged_product_probe_home="$RUNNER_TEMP/freex-$runtime-packaged-product-home"
          open_with_report="$artifact_root/freex-$runtime-macos-open-with-launch-smoke.txt"
          default_open_report="$artifact_root/freex-$runtime-macos-default-open-launch-smoke.txt"
          app_diagnostics_dir="$artifact_root/freex-$runtime-macos-app-diagnostics"
          validation_published="$RUNNER_TEMP/freex-$runtime-validation-publish"
          notary_log="$artifact_root/freex-$runtime-macos-notarization.log"
          tester_instructions_path="$artifact_root/freex-$runtime-macos-tester-instructions.md"
          distribution_candidate="$FREEX_DISTRIBUTION_CANDIDATE"
          artifact_channel="internal-preview"
          distribution_contract="internal_preview_not_for_distribution_notarization_optional"
          if [[ "$distribution_candidate" == "true" ]]; then
            artifact_channel="distribution-candidate"
            distribution_contract="distribution_candidate_requires_developer_id_notarization_stapling"
          fi
          signing_mode="ad-hoc"
          notarization_status="skipped_not_developer_id_signed"
          stapler_validated="false"
          keychain_path=""
          certificate_path=""
          cleanup_signing_keychain() {
            if [[ -n "$keychain_path" ]]; then
              security delete-keychain "$keychain_path" >/dev/null 2>&1 || true
            fi
            if [[ -n "$certificate_path" ]]; then
              rm -f "$certificate_path"
            fi
          }
          trap cleanup_signing_keychain EXIT

          rm -rf "$output_root"
          rm -rf "$app_diagnostics_dir"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" "$artifact_root" "$app_diagnostics_dir"
          : > "$notary_log"
          {
            echo ""
            echo "[artifact-channel]"
            echo "artifact_channel=$artifact_channel"
            echo "distribution_candidate=$distribution_candidate"
            echo "distribution_contract=$distribution_contract"
          } >> "$evidence_path"
          {
            echo "artifact_channel=$artifact_channel"
            echo "distribution_candidate=$distribution_candidate"
            echo "distribution_contract=$distribution_contract"
          } >> "$notary_log"

          has_any_signing_secret=false
          for signing_secret in \
            "$MACOS_CODESIGN_CERTIFICATE_P12" \
            "$MACOS_CODESIGN_CERTIFICATE_PASSWORD" \
            "$MACOS_DEVELOPER_ID_APPLICATION"; do
            if [[ -n "$signing_secret" ]]; then
              has_any_signing_secret=true
            fi
          done
          if [[ "$distribution_candidate" == "true" ]]; then
            if [[ -z "$MACOS_CODESIGN_CERTIFICATE_P12" ||
                  -z "$MACOS_CODESIGN_CERTIFICATE_PASSWORD" ||
                  -z "$MACOS_DEVELOPER_ID_APPLICATION" ]]; then
              echo "Distribution-candidate macOS app runs require Developer ID signing secrets: MACOS_CODESIGN_CERTIFICATE_P12, MACOS_CODESIGN_CERTIFICATE_PASSWORD, and MACOS_DEVELOPER_ID_APPLICATION." | tee -a "$notary_log" >&2
              exit 1
            fi
          fi
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" && "$has_any_signing_secret" == "true" ]]; then
            echo "Developer ID signing is disabled for pull_request events; using ad-hoc signing."
          elif [[ "$has_any_signing_secret" == "true" ]]; then
            if [[ -z "$MACOS_CODESIGN_CERTIFICATE_P12" ||
                  -z "$MACOS_CODESIGN_CERTIFICATE_PASSWORD" ||
                  -z "$MACOS_DEVELOPER_ID_APPLICATION" ]]; then
              echo "Developer ID signing requires MACOS_CODESIGN_CERTIFICATE_P12, MACOS_CODESIGN_CERTIFICATE_PASSWORD, and MACOS_DEVELOPER_ID_APPLICATION." >&2
              exit 1
            fi

            signing_mode="developer-id"
            keychain_password="$(uuidgen)"
            keychain_path="$RUNNER_TEMP/freex-$runtime-signing.keychain-db"
            certificate_path="$RUNNER_TEMP/freex-$runtime-developer-id.p12"
            printf '%s' "$MACOS_CODESIGN_CERTIFICATE_P12" | base64 -D > "$certificate_path"
            security create-keychain -p "$keychain_password" "$keychain_path"
            security set-keychain-settings -lut 21600 "$keychain_path"
            security unlock-keychain -p "$keychain_password" "$keychain_path"
            security import "$certificate_path" -P "$MACOS_CODESIGN_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
            security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | tr -d '"')
            security find-identity -v -p codesigning "$keychain_path" | grep -F "$MACOS_DEVELOPER_ID_APPLICATION"
          fi

          dotnet publish src/FreeX.App.Avalonia/FreeX.App.Avalonia.csproj \
            --configuration Release \
            --framework net10.0 \
            --runtime "$runtime" \
            --self-contained true \
            -p:UseAppHost=true \
            -p:PublishReadyToRun=false \
            -p:PublishSingleFile=false \
            --output "$app/Contents/MacOS"

          dotnet publish tools/FreeX.Validation.Avalonia/FreeX.Validation.Avalonia.csproj \
            --configuration Release \
            --framework net10.0 \
            --runtime "$runtime" \
            --self-contained true \
            -p:UseAppHost=true \
            -p:PublishReadyToRun=false \
            -p:PublishSingleFile=false \
            --output "$validation_published"
          validation_host="$validation_published/FreeX.Validation.Avalonia"
          test -x "$validation_host"

          cp src/FreeX.App.Avalonia/Packaging/macos/Info.plist "$app/Contents/Info.plist"
          cp src/FreeX.App.Avalonia/Packaging/macos/FreeX.icns "$app/Contents/Resources/FreeX.icns"
          plutil -lint "$app/Contents/Info.plist"
          chmod +x "$app/Contents/MacOS/FreeX"
          test -f "$app/Contents/MacOS/FreeX"
          test -x "$app/Contents/MacOS/FreeX"
          test -f "$app/Contents/MacOS/FreeX.dll"
          test -f "$app/Contents/Resources/FreeX.icns"
          native_document_extensions=(fxl)
          imported_document_extensions=(xlsx xlsm xltx xltm xls xlsb xlt csv tsv tab)
          assert_bundle_document_extensions() {
            local plist_path="$1"
            local document_type_index="$2"
            shift 2
            local expected_extensions=("$@")
            local extension_index
            for extension_index in "${!expected_extensions[@]}"; do
              test "$(/usr/libexec/PlistBuddy -c "Print :CFBundleDocumentTypes:$document_type_index:CFBundleTypeExtensions:$extension_index" "$plist_path")" = "${expected_extensions[$extension_index]}"
            done
          }
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")" = "FreeX"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$app/Contents/Info.plist")" = "FreeX.icns"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = "io.github.tony-xmelon.freex"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundlePackageType' "$app/Contents/Info.plist")" = "APPL"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")" = "12.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSHighResolutionCapable' "$app/Contents/Info.plist")" = "true"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:0:CFBundleTypeName' "$app/Contents/Info.plist")" = "FreeX Workbook"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:0:CFBundleTypeExtensions:0' "$app/Contents/Info.plist")" = "fxl"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:0:LSHandlerRank' "$app/Contents/Info.plist")" = "Owner"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:1:CFBundleTypeName' "$app/Contents/Info.plist")" = "Spreadsheet Workbooks"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:1:CFBundleTypeExtensions:0' "$app/Contents/Info.plist")" = "xlsx"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:1:LSHandlerRank' "$app/Contents/Info.plist")" = "Alternate"
          assert_bundle_document_extensions "$app/Contents/Info.plist" 0 "${native_document_extensions[@]}"
          assert_bundle_document_extensions "$app/Contents/Info.plist" 1 "${imported_document_extensions[@]}"
          binary_archs="$(lipo -archs "$app/Contents/MacOS/FreeX")"
          if [[ "$runtime" == "osx-arm64" ]]; then
            echo "$binary_archs" | grep -qw arm64
          else
            echo "$binary_archs" | grep -qw x86_64
          fi
          if [[ "$signing_mode" == "developer-id" ]]; then
            codesign --force --deep --options runtime --timestamp --sign "$MACOS_DEVELOPER_ID_APPLICATION" "$app"
          else
            codesign --force --deep --sign - "$app"
          fi
          codesign --verify --deep --strict "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$zip_path"
          has_any_notary_secret=false
          for notary_secret in \
            "$MACOS_NOTARY_APPLE_ID" \
            "$MACOS_NOTARY_TEAM_ID" \
            "$MACOS_NOTARY_PASSWORD"; do
            if [[ -n "$notary_secret" ]]; then
              has_any_notary_secret=true
            fi
          done
          if [[ "$distribution_candidate" == "true" ]]; then
            if [[ -z "$MACOS_NOTARY_APPLE_ID" ||
                  -z "$MACOS_NOTARY_TEAM_ID" ||
                  -z "$MACOS_NOTARY_PASSWORD" ]]; then
              echo "Distribution-candidate macOS app runs require notarization secrets: MACOS_NOTARY_APPLE_ID, MACOS_NOTARY_TEAM_ID, and MACOS_NOTARY_PASSWORD." | tee -a "$notary_log" >&2
              exit 1
            fi
          fi
          if [[ "$has_any_notary_secret" == "true" ]]; then
            if [[ "$signing_mode" != "developer-id" ]]; then
              notarization_status="skipped_missing_developer_id_signature"
              echo "notarization_status=skipped_missing_developer_id_signature" | tee -a "$notary_log"
            elif [[ -z "$MACOS_NOTARY_APPLE_ID" ||
                    -z "$MACOS_NOTARY_TEAM_ID" ||
                    -z "$MACOS_NOTARY_PASSWORD" ]]; then
              echo "Notarization requires MACOS_NOTARY_APPLE_ID, MACOS_NOTARY_TEAM_ID, and MACOS_NOTARY_PASSWORD." >&2
              exit 1
            else
              xcrun notarytool submit "$zip_path" \
                --apple-id "$MACOS_NOTARY_APPLE_ID" \
                --team-id "$MACOS_NOTARY_TEAM_ID" \
                --password "$MACOS_NOTARY_PASSWORD" \
                --wait \
                --output-format json | tee "$notary_log"
              grep -q '"status": *"Accepted"' "$notary_log"
              {
                echo "artifact_channel=$artifact_channel"
                echo "distribution_candidate=$distribution_candidate"
                echo "distribution_contract=$distribution_contract"
              } >> "$notary_log"
              xcrun stapler staple "$app" | tee -a "$notary_log"
              xcrun stapler validate "$app" | tee -a "$notary_log"
              stapler_validated="true"
              ditto -c -k --sequesterRsrc --keepParent "$app" "$zip_path"
              notarization_status="accepted"
            fi
          else
            notarization_status="skipped_missing_credentials"
            echo "notarization_status=skipped_missing_credentials" | tee -a "$notary_log"
          fi
          if [[ "$distribution_candidate" == "true" ]]; then
            if [[ "$signing_mode" != "developer-id" ||
                  "$notarization_status" != "accepted" ||
                  "$stapler_validated" != "true" ]]; then
              distribution_readiness=distribution_candidate_blocked_missing_required_evidence
              {
                echo "distribution_readiness=$distribution_readiness"
                echo "codesign_mode=$signing_mode"
                echo "notarization_status=$notarization_status"
                echo "stapler_validated=$stapler_validated"
              } >> "$evidence_path"
              echo "Distribution-candidate run requires codesign_mode=developer-id, notarization_status=accepted, and stapler_validated=true." | tee -a "$notary_log" >&2
              exit 1
            fi
            distribution_readiness=distribution_candidate_ready
          else
            distribution_readiness=internal_preview_not_for_distribution
          fi
          (cd "$artifact_root" && shasum -a 256 "$zip_name" > "$zip_name.sha256")
          (cd "$artifact_root" && shasum -a 256 -c "$zip_name.sha256")
          zip_sha256="$(cut -d ' ' -f 1 "$artifact_root/$zip_name.sha256")"
          unzip_root="$RUNNER_TEMP/freex-$runtime-unzip"
          app_path="$unzip_root/FreeX.app"
          rm -rf "$unzip_root"
          mkdir -p "$unzip_root"
          ditto -x -k "$zip_path" "$unzip_root"
          app_info_plist="$unzip_root/FreeX.app/Contents/Info.plist"
          test -f "$app_info_plist"
          test -x "$unzip_root/FreeX.app/Contents/MacOS/FreeX"
          test -f "$unzip_root/FreeX.app/Contents/MacOS/FreeX.dll"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_info_plist")" = "io.github.tony-xmelon.freex"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundlePackageType' "$app_info_plist")" = "APPL"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app_info_plist")" = "12.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSHighResolutionCapable' "$app_info_plist")" = "true"
          assert_bundle_document_extensions "$app_info_plist" 0 "${native_document_extensions[@]}"
          assert_bundle_document_extensions "$app_info_plist" 1 "${imported_document_extensions[@]}"
          codesign --verify --deep --strict "$unzip_root/FreeX.app"
          gatekeeper_assessment_required="$distribution_candidate"
          set +e
          gatekeeper_assessment_output="$(/usr/sbin/spctl --assess --type execute --verbose=4 "$app_path" 2>&1)"
          gatekeeper_assessment_exit_code=$?
          set -e
          if [[ "$gatekeeper_assessment_exit_code" -eq 0 ]]; then
            gatekeeper_assessment_status="accepted"
          else
            gatekeeper_assessment_status="rejected"
          fi
          gatekeeper_assessment_source="$(awk '/^source=/{print substr($0, 8); exit}' <<< "$gatekeeper_assessment_output")"
          if [[ -z "$gatekeeper_assessment_source" ]]; then
            gatekeeper_assessment_source="unavailable"
          fi
          {
            echo ""
            echo "[gatekeeper-assessment]"
            echo "gatekeeper_assessment_attempted=true"
            echo "gatekeeper_assessment_required=$gatekeeper_assessment_required"
            echo "gatekeeper_assessment_subject=unzipped_app_bundle"
            echo "gatekeeper_assessment_type=execute"
            echo "gatekeeper_assessment_exit_code=$gatekeeper_assessment_exit_code"
            echo "gatekeeper_assessment_status=$gatekeeper_assessment_status"
            echo "gatekeeper_assessment_source=$gatekeeper_assessment_source"
            if [[ -z "$gatekeeper_assessment_output" ]]; then
              echo "gatekeeper_assessment_output=<empty>"
            else
              while IFS= read -r gatekeeper_line; do
                echo "gatekeeper_assessment_output=$gatekeeper_line"
              done <<< "$gatekeeper_assessment_output"
            fi
          } >> "$evidence_path"
          if [[ "$distribution_candidate" == "true" ]]; then
            if [[ "$gatekeeper_assessment_exit_code" -ne 0 ||
                  "$gatekeeper_assessment_status" != "accepted" ||
                  "$gatekeeper_assessment_source" != "Notarized Developer ID" ]]; then
              distribution_readiness=distribution_candidate_blocked_gatekeeper_assessment
              echo "distribution_readiness=$distribution_readiness" >> "$evidence_path"
              echo "Distribution-candidate run requires accepted Gatekeeper assessment from Notarized Developer ID." | tee -a "$notary_log" >&2
              exit 1
            fi
          fi
          host_arch="$(uname -m)"
          {
            echo ""
            echo "[bundle]"
            echo "runtime=$runtime"
            echo "artifact_channel=$artifact_channel"
            echo "distribution_candidate=$distribution_candidate"
            echo "distribution_contract=$distribution_contract"
            echo "distribution_readiness=$distribution_readiness"
            echo "host_arch=$host_arch"
            echo "binary_archs=$binary_archs"
            echo "zip_name=$zip_name"
            echo "artifact_bundle_metadata_subject=unzipped_app_bundle"
            echo "bundle_executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_info_plist")"
            echo "bundle_icon=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$app_info_plist")"
            echo "bundle_identifier=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_info_plist")"
            echo "bundle_package_type=$(/usr/libexec/PlistBuddy -c 'Print :CFBundlePackageType' "$app_info_plist")"
            echo "bundle_minimum_system_version=$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app_info_plist")"
            echo "bundle_high_resolution_capable=$(/usr/libexec/PlistBuddy -c 'Print :NSHighResolutionCapable' "$app_info_plist")"
            echo "native_document_type=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:0:CFBundleTypeName' "$app_info_plist")"
            echo "native_document_extension=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:0:CFBundleTypeExtensions:0' "$app_info_plist")"
            echo "artifact_document_extensions_subject=unzipped_app_bundle"
            echo "native_document_extensions=$(IFS=';'; echo "${native_document_extensions[*]}")"
            echo "native_document_handler_rank=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:0:LSHandlerRank' "$app_info_plist")"
            echo "imported_document_type=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:1:CFBundleTypeName' "$app_info_plist")"
            echo "imported_document_extension=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:1:CFBundleTypeExtensions:0' "$app_info_plist")"
            echo "imported_document_extensions=$(IFS=';'; echo "${imported_document_extensions[*]}")"
            echo "imported_document_handler_rank=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:1:LSHandlerRank' "$app_info_plist")"
            echo "codesign_verified=true"
            echo "codesign_mode=$signing_mode"
            echo "notarization_status=$notarization_status"
            echo "stapler_validated=$stapler_validated"
            echo "gatekeeper_assessment_attempted=true"
            echo "gatekeeper_assessment_required=$gatekeeper_assessment_required"
            echo "gatekeeper_assessment_subject=unzipped_app_bundle"
            echo "gatekeeper_assessment_type=execute"
            echo "gatekeeper_assessment_exit_code=$gatekeeper_assessment_exit_code"
            echo "gatekeeper_assessment_status=$gatekeeper_assessment_status"
            echo "gatekeeper_assessment_source=$gatekeeper_assessment_source"
            echo "zip_sha256=$zip_sha256"
          } >> "$evidence_path"
          if [[ ("$runtime" == "osx-arm64" && "$host_arch" == "arm64") || ("$runtime" == "osx-x64" && "$host_arch" == "x86_64") ]]; then
            "$validation_host" --packaging-smoke | tee "$smoke_log"
            grep -q "Packaging smoke opened" "$smoke_log"
            grep -q "macOS Preview Workbook" "$smoke_log"
            grep -q "drawing_object_previews=3" "$smoke_log"
            grep -q "roundtrip_drawing_object_previews=3" "$smoke_log"
            grep -q "format_cells_style_roundtrip=true" "$smoke_log"
            grep -q "edited, saved, and reopened" "$smoke_log"

            smoke_file="$RUNNER_TEMP/freex-$runtime-smoke.csv"
            printf 'Name,Amount\nFreeX,42\n' > "$smoke_file"
            "$validation_host" --packaging-smoke "$smoke_file" | tee -a "$smoke_log"
            grep -q "Packaging smoke opened" "$smoke_log"
            grep -q "edited, saved, and reopened" "$smoke_log"
            format_cells_style_roundtrip_count="$(grep -c "format_cells_style_roundtrip=true" "$smoke_log")"
            test "$format_cells_style_roundtrip_count" -ge 2
            {
              echo "format_cells_style_roundtrip=true"
              echo "format_cells_style_roundtrip_count=$format_cells_style_roundtrip_count"
            } >> "$evidence_path"

            # Bounded probe against the executable inside the extracted app bundle. The
            # validation host continues to own the fixture-heavy packaging and UI checks.
            rm -rf "$packaged_product_probe_home"
            HOME="$packaged_product_probe_home" \
              bash tools/Run-PackagedProductLaunchProbe.sh \
                --executable "$unzip_root/FreeX.app/Contents/MacOS/FreeX" \
                --readiness-root "$packaged_product_probe_home" \
                --report "$packaged_product_launch_report" \
                --log "$packaged_product_launch_log" \
                -- "$smoke_file"
            grep -Fqx "packaged_product_launch_status=passed" "$packaged_product_launch_report"
            grep -Fqx "packaged_product_executable=$unzip_root/FreeX.app/Contents/MacOS/FreeX" "$packaged_product_launch_report"
            cat "$packaged_product_launch_report" >> "$evidence_path"
            echo "smoke_status=passed" >> "$evidence_path"

            launchservices_smoke_timeout_seconds=60
            launchservices_cleanup_timeout_seconds=10
            quit_launchservices_app() {
              osascript -e 'tell application id "io.github.tony-xmelon.freex" to quit' || true
            }
            launchservices_process_is_active() {
              local launchservices_pid="$1"
              local process_state
              process_state="$(ps -o stat= -p "$launchservices_pid" 2>/dev/null | tr -d ' ')"
              [[ -n "$process_state" && "$process_state" != Z* ]]
            }
            append_launchservices_failure_diagnostics() {
              local report_path="$1"
              {
                if [[ -d "$app_diagnostics_dir" ]]; then
                  echo "app_diagnostics_directory_configured=true"
                else
                  echo "app_diagnostics_directory_configured=false"
                fi
                if [[ -f "$app_diagnostics_dir/events.jsonl" ]]; then
                  echo "app_diagnostics_events_jsonl=true"
                else
                  echo "app_diagnostics_events_jsonl=false"
                fi
              } >> "$report_path"
            }
            append_launchservices_smoke_markers() {
              local smoke_name="$1"
              local report_path="$2"
              if [[ "$smoke_name" == "default_open" ]]; then
                {
                  echo "launchservices_default_open_attempted=true"
                  echo "launchservices_default_open_app_override=false"
                  echo "launchservices_default_open_document_extension=fxl"
                  echo "launchservices_default_open_boundary=ci_open_document_without_app_override_not_finder_double_click"
                } >> "$report_path"
              fi
            }
            write_launchservices_missing_report() {
              local smoke_name="$1"
              local report_path="$2"
              local timed_out="$3"
              {
                echo "macos_launch_smoke=missing_report"
                echo "launchservices_smoke_name=$smoke_name"
                echo "launchservices_smoke_timeout_seconds=$launchservices_smoke_timeout_seconds"
                echo "launchservices_smoke_timed_out=$timed_out"
              } > "$report_path"
              append_launchservices_smoke_markers "$smoke_name" "$report_path"
              append_launchservices_failure_diagnostics "$report_path"
            }
            wait_for_bounded_launchservices_cleanup() {
              local launchservices_pid="$1"
              local smoke_name="$2"
              local report_path="$3"
              local elapsed=0
              while (( elapsed < launchservices_cleanup_timeout_seconds )); do
                if ! launchservices_process_is_active "$launchservices_pid"; then
                  local launchservices_status=0
                  wait "$launchservices_pid" || launchservices_status=$?
                  return "$launchservices_status"
                fi
                sleep 1
                elapsed=$((elapsed + 1))
              done
              local forced_cleanup=false
              if launchservices_process_is_active "$launchservices_pid"; then
                forced_cleanup=true
                kill "$launchservices_pid" 2>/dev/null || true
                sleep 1
                if launchservices_process_is_active "$launchservices_pid"; then
                  kill -9 "$launchservices_pid" 2>/dev/null || true
                fi
              fi
              local launchservices_status=0
              wait "$launchservices_pid" || launchservices_status=$?
              if [[ "$forced_cleanup" == "true" ]]; then
                {
                  echo "launchservices_smoke_cleanup_timeout=true"
                  echo "launchservices_smoke_cleanup_timeout_seconds=$launchservices_cleanup_timeout_seconds"
                  echo "launchservices_smoke_name=$smoke_name"
                } >> "$report_path"
                return 124
              fi
              return "$launchservices_status"
            }
            run_bounded_launchservices_smoke() {
              local smoke_name="$1"
              local report_path="$2"
              shift 2
              rm -f "$report_path"
              "$@" &
              local launchservices_pid=$!
              local elapsed=0
              local timed_out=false
              while (( elapsed < launchservices_smoke_timeout_seconds )); do
                if [[ -f "$report_path" ]]; then
                  break
                fi
                if ! launchservices_process_is_active "$launchservices_pid"; then
                  break
                fi
                sleep 1
                elapsed=$((elapsed + 1))
              done
              if [[ ! -f "$report_path" && "$elapsed" -ge "$launchservices_smoke_timeout_seconds" ]] &&
                 launchservices_process_is_active "$launchservices_pid"; then
                timed_out=true
              fi
              if [[ ! -f "$report_path" ]]; then
                write_launchservices_missing_report "$smoke_name" "$report_path" "$timed_out"
                quit_launchservices_app
                wait_for_bounded_launchservices_cleanup "$launchservices_pid" "$smoke_name" "$report_path" || true
                cat "$report_path" >> "$evidence_path"
                return 1
              fi
              quit_launchservices_app
              local cleanup_status=0
              wait_for_bounded_launchservices_cleanup "$launchservices_pid" "$smoke_name" "$report_path" || cleanup_status=$?
              append_launchservices_smoke_markers "$smoke_name" "$report_path"
              cat "$report_path" >> "$evidence_path"
              if [[ "$cleanup_status" -ne 0 ]]; then
                return "$cleanup_status"
              fi
            }
            run_launchservices_with_validation() {
              local report_path="$1"
              local source_path="$2"
              shift 2
              "$@" &
              local open_pid=$!
              sleep 3
              local validation_status=0
              "$validation_host" \
