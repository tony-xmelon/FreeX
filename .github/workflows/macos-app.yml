name: macOS App Preview

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  macos-app:
    name: macOS app bundle (${{ matrix.runtime }})
    runs-on: macos-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        runtime:
          - osx-arm64
          - osx-x64

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build app project
        shell: pwsh
        run: dotnet build src/FreeX.App.Avalonia/FreeX.App.Avalonia.csproj --configuration Release

      - name: Publish app bundle
        shell: bash
        env:
          MACOS_CODESIGN_CERTIFICATE_P12: ${{ secrets.MACOS_CODESIGN_CERTIFICATE_P12 }}
          MACOS_CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CODESIGN_CERTIFICATE_PASSWORD }}
          MACOS_DEVELOPER_ID_APPLICATION: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail

          runtime="${{ matrix.runtime }}"
          output_root="$RUNNER_TEMP/freex-$runtime"
          app="$output_root/FreeX.app"
          artifact_root="$GITHUB_WORKSPACE/artifacts"
          zip_name="freex-$runtime-macos-app.zip"
          zip_path="$artifact_root/$zip_name"
          evidence_path="$artifact_root/freex-$runtime-macos-evidence.txt"
          smoke_log="$artifact_root/freex-$runtime-macos-packaging-smoke.log"
          launch_smoke_report="$artifact_root/freex-$runtime-macos-launch-smoke.txt"
          notary_log="$artifact_root/freex-$runtime-macos-notarization.log"
          tester_instructions_path="$artifact_root/freex-$runtime-macos-tester-instructions.md"
          signing_mode="ad-hoc"
          notarization_status="skipped_not_developer_id_signed"
          stapler_validated="false"
          keychain_path=""
          certificate_path=""
          cleanup_signing_keychain() {
            if [[ -n "$keychain_path" ]]; then
              security delete-keychain "$keychain_path" >/dev/null 2>&1 || true
            fi
            if [[ -n "$certificate_path" ]]; then
              rm -f "$certificate_path"
            fi
          }
          trap cleanup_signing_keychain EXIT

          rm -rf "$output_root"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" "$artifact_root"
          : > "$notary_log"

          has_any_signing_secret=false
          for signing_secret in \
            "$MACOS_CODESIGN_CERTIFICATE_P12" \
            "$MACOS_CODESIGN_CERTIFICATE_PASSWORD" \
            "$MACOS_DEVELOPER_ID_APPLICATION"; do
            if [[ -n "$signing_secret" ]]; then
              has_any_signing_secret=true
            fi
          done
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" && "$has_any_signing_secret" == "true" ]]; then
            echo "Developer ID signing is disabled for pull_request events; using ad-hoc signing."
          elif [[ "$has_any_signing_secret" == "true" ]]; then
            if [[ -z "$MACOS_CODESIGN_CERTIFICATE_P12" ||
                  -z "$MACOS_CODESIGN_CERTIFICATE_PASSWORD" ||
                  -z "$MACOS_DEVELOPER_ID_APPLICATION" ]]; then
              echo "Developer ID signing requires MACOS_CODESIGN_CERTIFICATE_P12, MACOS_CODESIGN_CERTIFICATE_PASSWORD, and MACOS_DEVELOPER_ID_APPLICATION." >&2
              exit 1
            fi

            signing_mode="developer-id"
            keychain_password="$(uuidgen)"
            keychain_path="$RUNNER_TEMP/freex-$runtime-signing.keychain-db"
            certificate_path="$RUNNER_TEMP/freex-$runtime-developer-id.p12"
            printf '%s' "$MACOS_CODESIGN_CERTIFICATE_P12" | base64 -D > "$certificate_path"
            security create-keychain -p "$keychain_password" "$keychain_path"
            security set-keychain-settings -lut 21600 "$keychain_path"
            security unlock-keychain -p "$keychain_password" "$keychain_path"
            security import "$certificate_path" -P "$MACOS_CODESIGN_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
            security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | tr -d '"')
            security find-identity -v -p codesigning "$keychain_path" | grep -F "$MACOS_DEVELOPER_ID_APPLICATION"
          fi

          dotnet publish src/FreeX.App.Avalonia/FreeX.App.Avalonia.csproj \
            --configuration Release \
            --framework net10.0 \
            --runtime "$runtime" \
            --self-contained true \
            -p:UseAppHost=true \
            -p:PublishReadyToRun=false \
            -p:PublishSingleFile=false \
            --output "$app/Contents/MacOS"

          cp src/FreeX.App.Avalonia/Packaging/macos/Info.plist "$app/Contents/Info.plist"
          cp src/FreeX.App.Avalonia/Packaging/macos/FreeX.icns "$app/Contents/Resources/FreeX.icns"
          plutil -lint "$app/Contents/Info.plist"
          chmod +x "$app/Contents/MacOS/FreeX"
          test -f "$app/Contents/MacOS/FreeX"
          test -x "$app/Contents/MacOS/FreeX"
          test -f "$app/Contents/MacOS/FreeX.dll"
          test -f "$app/Contents/Resources/FreeX.icns"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")" = "FreeX"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$app/Contents/Info.plist")" = "FreeX.icns"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:0:CFBundleTypeName' "$app/Contents/Info.plist")" = "FreeX Workbook"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:0:CFBundleTypeExtensions:0' "$app/Contents/Info.plist")" = "fxl"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:0:LSHandlerRank' "$app/Contents/Info.plist")" = "Owner"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:1:CFBundleTypeName' "$app/Contents/Info.plist")" = "Spreadsheet Workbooks"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:1:CFBundleTypeExtensions:0' "$app/Contents/Info.plist")" = "xlsx"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:1:LSHandlerRank' "$app/Contents/Info.plist")" = "Alternate"
          binary_archs="$(lipo -archs "$app/Contents/MacOS/FreeX")"
          if [[ "$runtime" == "osx-arm64" ]]; then
            echo "$binary_archs" | grep -qw arm64
          else
            echo "$binary_archs" | grep -qw x86_64
          fi
          if [[ "$signing_mode" == "developer-id" ]]; then
            codesign --force --deep --options runtime --timestamp --sign "$MACOS_DEVELOPER_ID_APPLICATION" "$app"
          else
            codesign --force --deep --sign - "$app"
          fi
          codesign --verify --deep --strict "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$zip_path"
          has_any_notary_secret=false
          for notary_secret in \
            "$MACOS_NOTARY_APPLE_ID" \
            "$MACOS_NOTARY_TEAM_ID" \
            "$MACOS_NOTARY_PASSWORD"; do
            if [[ -n "$notary_secret" ]]; then
              has_any_notary_secret=true
            fi
          done
          if [[ "$has_any_notary_secret" == "true" ]]; then
            if [[ "$signing_mode" != "developer-id" ]]; then
              notarization_status="skipped_missing_developer_id_signature"
              echo "notarization_status=skipped_missing_developer_id_signature" | tee "$notary_log"
            elif [[ -z "$MACOS_NOTARY_APPLE_ID" ||
                    -z "$MACOS_NOTARY_TEAM_ID" ||
                    -z "$MACOS_NOTARY_PASSWORD" ]]; then
              echo "Notarization requires MACOS_NOTARY_APPLE_ID, MACOS_NOTARY_TEAM_ID, and MACOS_NOTARY_PASSWORD." >&2
              exit 1
            else
              xcrun notarytool submit "$zip_path" \
                --apple-id "$MACOS_NOTARY_APPLE_ID" \
                --team-id "$MACOS_NOTARY_TEAM_ID" \
                --password "$MACOS_NOTARY_PASSWORD" \
                --wait \
                --output-format json | tee "$notary_log"
              grep -q '"status": *"Accepted"' "$notary_log"
              xcrun stapler staple "$app"
              xcrun stapler validate "$app"
              stapler_validated="true"
              ditto -c -k --sequesterRsrc --keepParent "$app" "$zip_path"
              notarization_status="accepted"
            fi
          else
            notarization_status="skipped_missing_credentials"
            echo "notarization_status=skipped_missing_credentials" | tee "$notary_log"
          fi
          (cd "$artifact_root" && shasum -a 256 "$zip_name" > "$zip_name.sha256")
          (cd "$artifact_root" && shasum -a 256 -c "$zip_name.sha256")
          zip_sha256="$(cut -d ' ' -f 1 "$artifact_root/$zip_name.sha256")"
          unzip_root="$RUNNER_TEMP/freex-$runtime-unzip"
          rm -rf "$unzip_root"
          mkdir -p "$unzip_root"
          unzip -q "$zip_path" -d "$unzip_root"
          test -x "$unzip_root/FreeX.app/Contents/MacOS/FreeX"
          test -f "$unzip_root/FreeX.app/Contents/MacOS/FreeX.dll"
          codesign --verify --deep --strict "$unzip_root/FreeX.app"
          host_arch="$(uname -m)"
          {
            echo "runtime=$runtime"
            echo "host_arch=$host_arch"
            echo "binary_archs=$binary_archs"
            echo "zip_name=$zip_name"
            echo "bundle_executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
            echo "bundle_icon=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$app/Contents/Info.plist")"
            echo "native_document_type=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:0:CFBundleTypeName' "$app/Contents/Info.plist")"
            echo "native_document_extension=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:0:CFBundleTypeExtensions:0' "$app/Contents/Info.plist")"
            echo "native_document_handler_rank=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:0:LSHandlerRank' "$app/Contents/Info.plist")"
            echo "imported_document_type=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:1:CFBundleTypeName' "$app/Contents/Info.plist")"
            echo "imported_document_extension=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:1:CFBundleTypeExtensions:0' "$app/Contents/Info.plist")"
            echo "imported_document_handler_rank=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:1:LSHandlerRank' "$app/Contents/Info.plist")"
            echo "codesign_verified=true"
            echo "codesign_mode=$signing_mode"
            echo "notarization_status=$notarization_status"
            echo "stapler_validated=$stapler_validated"
            echo "zip_sha256=$zip_sha256"
          } > "$evidence_path"
          if [[ ("$runtime" == "osx-arm64" && "$host_arch" == "arm64") || ("$runtime" == "osx-x64" && "$host_arch" == "x86_64") ]]; then
            "$unzip_root/FreeX.app/Contents/MacOS/FreeX" --packaging-smoke | tee "$smoke_log"
            grep -q "Packaging smoke opened" "$smoke_log"
            grep -q "macOS Preview Workbook" "$smoke_log"
            grep -q "drawing_object_previews=3" "$smoke_log"
            grep -q "roundtrip_drawing_object_previews=3" "$smoke_log"
            grep -q "edited, saved, and reopened" "$smoke_log"

            smoke_file="$RUNNER_TEMP/freex-$runtime-smoke.csv"
            printf 'Name,Amount\nFreeX,42\n' > "$smoke_file"
            "$unzip_root/FreeX.app/Contents/MacOS/FreeX" --packaging-smoke "$smoke_file" | tee -a "$smoke_log"
            grep -q "Packaging smoke opened" "$smoke_log"
            grep -q "edited, saved, and reopened" "$smoke_log"
            echo "smoke_status=passed" >> "$evidence_path"

            launch_smoke_file="$RUNNER_TEMP/freex-$runtime-launch.csv"
            printf 'Name,Amount\nFreeX Launch,84\n' > "$launch_smoke_file"
            rm -f "$launch_smoke_report"
            /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f "$unzip_root/FreeX.app"
            open -W -n -b io.github.tony-xmelon.freex "$launch_smoke_file" --args --macos-launch-smoke "$launch_smoke_report" &
            launch_pid=$!
            for _ in {1..60}; do
              if [[ -f "$launch_smoke_report" ]]; then
                break
              fi
              if ! kill -0 "$launch_pid" 2>/dev/null; then
                break
              fi
              sleep 1
            done
            if [[ ! -f "$launch_smoke_report" ]]; then
              echo "macos_launch_smoke=missing_report" > "$launch_smoke_report"
              osascript -e 'tell application id "io.github.tony-xmelon.freex" to quit' || true
              wait "$launch_pid" || true
              cat "$launch_smoke_report" >> "$evidence_path"
              exit 1
            fi
            wait "$launch_pid" || true
            cat "$launch_smoke_report" >> "$evidence_path"
            grep -q "macos_launch_smoke=passed" "$launch_smoke_report"
            grep -q "window_shown=true" "$launch_smoke_report"
            grep -q "opened_source_path=.*freex-$runtime-launch.csv" "$launch_smoke_report"
            grep -q "viewport_rows=[1-9]" "$launch_smoke_report"
            grep -q "viewport_columns=[1-9]" "$launch_smoke_report"
            grep -q "new_sheet_button=true" "$launch_smoke_report"
            grep -q "native_file_menu=true" "$launch_smoke_report"
            grep -q "native_new_workbook_menu_item=true" "$launch_smoke_report"
            grep -q "native_open_menu_item=true" "$launch_smoke_report"
            grep -q "native_open_recent_menu_item=true" "$launch_smoke_report"
            grep -q "native_open_recent_item_count=[1-9]" "$launch_smoke_report"
            grep -q "native_save_menu_item=true" "$launch_smoke_report"
            grep -q "native_save_as_menu_item=true" "$launch_smoke_report"
            grep -q "native_close_workbook_menu_item=true" "$launch_smoke_report"
            grep -q "native_edit_menu=true" "$launch_smoke_report"
            grep -q "native_format_menu=true" "$launch_smoke_report"
            grep -q "native_view_menu=true" "$launch_smoke_report"
            grep -q "native_sheet_menu=true" "$launch_smoke_report"
            grep -q "native_help_menu=true" "$launch_smoke_report"
            grep -q "native_new_sheet_menu_item=true" "$launch_smoke_report"
            grep -q "native_rename_sheet_menu_item=true" "$launch_smoke_report"
            grep -q "native_duplicate_sheet_menu_item=true" "$launch_smoke_report"
            grep -q "native_move_sheet_left_menu_item=true" "$launch_smoke_report"
            grep -q "native_move_sheet_right_menu_item=true" "$launch_smoke_report"
            grep -q "native_hide_sheet_menu_item=true" "$launch_smoke_report"
            grep -q "native_unhide_sheet_menu_item=true" "$launch_smoke_report"
            grep -q "native_delete_sheet_menu_item=true" "$launch_smoke_report"
            grep -q "native_undo_menu_item=true" "$launch_smoke_report"
            grep -q "native_redo_menu_item=true" "$launch_smoke_report"
            grep -q "native_cut_menu_item=true" "$launch_smoke_report"
            grep -q "native_copy_menu_item=true" "$launch_smoke_report"
            grep -q "native_paste_menu_item=true" "$launch_smoke_report"
            grep -q "native_paste_special_menu_item=true" "$launch_smoke_report"
            grep -q "native_paste_special_comments_menu_item=true" "$launch_smoke_report"
            grep -q "native_paste_special_validation_menu_item=true" "$launch_smoke_report"
            grep -q "native_paste_special_all_except_borders_menu_item=true" "$launch_smoke_report"
            grep -q "native_paste_special_all_merging_conditional_formats_menu_item=true" "$launch_smoke_report"
            grep -q "native_paste_special_column_widths_menu_item=true" "$launch_smoke_report"
            grep -q "native_paste_special_formulas_and_number_formats_menu_item=true" "$launch_smoke_report"
            grep -q "native_paste_special_values_and_number_formats_menu_item=true" "$launch_smoke_report"
            grep -q "native_paste_special_values_and_source_formatting_menu_item=true" "$launch_smoke_report"
            grep -q "native_paste_special_keep_source_column_widths_menu_item=true" "$launch_smoke_report"
            grep -q "native_paste_special_paste_link_menu_item=true" "$launch_smoke_report"
            grep -q "native_select_all_menu_item=true" "$launch_smoke_report"
            grep -q "native_clear_contents_menu_item=true" "$launch_smoke_report"
            grep -q "native_bold_menu_item=true" "$launch_smoke_report"
            grep -q "native_italic_menu_item=true" "$launch_smoke_report"
            grep -q "native_underline_menu_item=true" "$launch_smoke_report"
            grep -q "native_double_underline_menu_item=true" "$launch_smoke_report"
            grep -q "native_strikethrough_menu_item=true" "$launch_smoke_report"
            grep -q "native_increase_font_size_menu_item=true" "$launch_smoke_report"
            grep -q "native_decrease_font_size_menu_item=true" "$launch_smoke_report"
            grep -q "native_fill_color_menu_item=true" "$launch_smoke_report"
            grep -q "native_clear_fill_menu_item=true" "$launch_smoke_report"
            grep -q "native_font_color_menu_item=true" "$launch_smoke_report"
            grep -q "native_fill_color_swatch_count=69" "$launch_smoke_report"
            grep -q "native_font_color_swatch_count=69" "$launch_smoke_report"
            grep -q "native_cell_styles_menu_item=true" "$launch_smoke_report"
            grep -q "native_cell_styles_preset_count=33" "$launch_smoke_report"
            grep -q "native_horizontal_text_menu_item=true" "$launch_smoke_report"
            grep -q "native_angle_counterclockwise_menu_item=true" "$launch_smoke_report"
            grep -q "native_angle_clockwise_menu_item=true" "$launch_smoke_report"
            grep -q "native_vertical_text_menu_item=true" "$launch_smoke_report"
            grep -q "native_rotate_text_up_menu_item=true" "$launch_smoke_report"
            grep -q "native_rotate_text_down_menu_item=true" "$launch_smoke_report"
            grep -q "native_currency_format_menu_item=true" "$launch_smoke_report"
            grep -q "native_percent_format_menu_item=true" "$launch_smoke_report"
            grep -q "native_comma_style_menu_item=true" "$launch_smoke_report"
            grep -q "native_increase_decimal_menu_item=true" "$launch_smoke_report"
            grep -q "native_decrease_decimal_menu_item=true" "$launch_smoke_report"
            grep -q "native_align_top_menu_item=true" "$launch_smoke_report"
            grep -q "native_align_middle_menu_item=true" "$launch_smoke_report"
            grep -q "native_align_bottom_menu_item=true" "$launch_smoke_report"
            grep -q "native_wrap_text_menu_item=true" "$launch_smoke_report"
            grep -q "native_decrease_indent_menu_item=true" "$launch_smoke_report"
            grep -q "native_increase_indent_menu_item=true" "$launch_smoke_report"
            grep -q "native_align_left_menu_item=true" "$launch_smoke_report"
            grep -q "native_align_center_menu_item=true" "$launch_smoke_report"
            grep -q "native_align_right_menu_item=true" "$launch_smoke_report"
            grep -q "native_show_formulas_menu_item=true" "$launch_smoke_report"
            grep -q "native_help_online_menu_item=true" "$launch_smoke_report"
            grep -q "native_send_feedback_menu_item=true" "$launch_smoke_report"
            grep -q "native_check_for_updates_menu_item=true" "$launch_smoke_report"
            grep -q "native_about_menu_item=true" "$launch_smoke_report"
            grep -q "native_legal_notices_menu_item=true" "$launch_smoke_report"
            grep -q "native_quit_menu_item=true" "$launch_smoke_report"
          else
            echo "Skipping launch smoke for $runtime on $host_arch host." | tee "$smoke_log"
            echo "smoke_status=skipped_host_arch_mismatch" >> "$evidence_path"
            echo "macos_launch_smoke=skipped_host_arch_mismatch" > "$launch_smoke_report"
          fi

          cat > "$tester_instructions_path" <<EOF
          # FreeX macOS App Preview ($runtime)

          This artifact is a preview build for macOS port validation. It is not a public release channel.

          Use osx-arm64 for Apple Silicon Macs and osx-x64 for Intel Macs. Unzip the GitHub Actions artifact wrapper first; these files are inside it.

          ## Download

          Download these files from the same GitHub Actions artifact:

          - $zip_name
          - $zip_name.sha256
          - freex-$runtime-macos-evidence.txt
          - freex-$runtime-macos-packaging-smoke.log
          - freex-$runtime-macos-launch-smoke.txt
          - freex-$runtime-macos-notarization.log

          ## Verify

          Run this in Terminal from the directory containing the downloaded files:

          \`\`\`bash
          shasum -a 256 -c $zip_name.sha256
          \`\`\`

          Expected result:

          \`\`\`text
          $zip_name: OK
          \`\`\`

          ## Open

          Unzip $zip_name, then open FreeX.app. If macOS Gatekeeper blocks the preview, check freex-$runtime-macos-evidence.txt first:

          - codesign_mode=$signing_mode
          - notarization_status=$notarization_status
          - stapler_validated=$stapler_validated
          - zip_sha256=$zip_sha256

          Ad-hoc signed or non-notarized previews may require Control-click or right-click > Open for trusted internal testing. Public distribution still requires Developer ID signing, accepted notarization, and stapling evidence.

          ## Report

          When filing feedback, include the runtime ($runtime), the GitHub Actions run, freex-$runtime-macos-evidence.txt, and the smoke logs when relevant.
          EOF

      - name: Upload app artifact
        uses: actions/upload-artifact@v7
        with:
          name: freex-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.runtime }}-macos-app
          path: |
            artifacts/freex-${{ matrix.runtime }}-macos-app.zip
            artifacts/freex-${{ matrix.runtime }}-macos-app.zip.sha256
            artifacts/freex-${{ matrix.runtime }}-macos-evidence.txt
            artifacts/freex-${{ matrix.runtime }}-macos-packaging-smoke.log
            artifacts/freex-${{ matrix.runtime }}-macos-launch-smoke.txt
            artifacts/freex-${{ matrix.runtime }}-macos-notarization.log
            artifacts/freex-${{ matrix.runtime }}-macos-tester-instructions.md
          if-no-files-found: error
