name: CodeQL

on:
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-csharp:
    name: Analyze C#
    runs-on: windows-latest
    timeout-minutes: 180
    permissions:
      contents: read
      security-events: write
      packages: read

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.300

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', 'Directory.Build.props', 'Directory.Build.targets', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: csharp
          build-mode: manual

      - name: Build analyzed solution
        shell: pwsh
        run: |
          dotnet build FreeSuite.CodeQL.slnx --configuration Release
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Parallel CodeQL build failed; retrying once with build servers and shared compilation disabled."
            dotnet build-server shutdown
            dotnet build FreeSuite.CodeQL.slnx --configuration Release --disable-build-servers -p:UseSharedCompilation=false -p:NodeReuse=false /nr:false -m:1
            if ($LASTEXITCODE -ne 0) { throw "Fallback CodeQL build failed with exit code $LASTEXITCODE." }
          }

      - name: Analyze
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          category: /language:csharp
