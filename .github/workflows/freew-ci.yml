name: FreeW CI

# Dedicated app-scoped validation lane. Release preparation invokes it directly before a
# tester-release workflow can publish FreeW or shared-library changes.
on:
  workflow_dispatch:

concurrency:
  group: freew-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  freew-tests:
    name: FreeW ${{ matrix.platform }} commit gate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
          - platform: linux
            runner: ubuntu-latest
          - platform: macos
            runner: macos-15-intel

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.300

      - name: Build (Release, 0 warnings enforced)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: dotnet build FreeW.slnx --configuration Release

      - name: Commit gate
        shell: pwsh
        run: pwsh -NoProfile -File tools/Invoke-TestGate.ps1 -Gate commit -App FreeW -Platform ${{ matrix.platform }} ${{ matrix.platform == 'windows' && '-NoBuild' || '' }}
