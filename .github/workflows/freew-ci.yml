name: FreeW CI

# Dedicated build + test gate for the FreeW word processor (freew/, FreeW*.slnx).
# Manual-only: dispatch via the Actions tab (workflow_dispatch), or it runs as part of
# app-tester-release.yml's FreeW test lane on every tester release.
#
# History: R121 made this manual-only from 2026-06-25 to 2026-08-06 (disabled during a merge
# push and never re-enabled, so FreeW.slnx silently stopped being built/tested by anything
# automated for six weeks). R124 restored automatic push/PR triggers to close that gap. As of
# this change, every push/PR to main was triggering a full FreeW build that reliably failed,
# which is pure waste rather than a useful gate - reverted to manual-only DELIBERATELY, not by
# accident. Coverage is not lost: app-tester-release.yml already runs the FreeW test lane
# (freew-release-tests, freew-avalonia-smoke-tests) on every manual tester release, so a
# FreeW-breaking change is still caught before it ships, just not on every individual commit.
on:
  workflow_dispatch:

concurrency:
  group: freew-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  freew-tests:
    name: FreeW test lane
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.111

      - name: Build (Release, 0 warnings enforced)
        shell: pwsh
        run: dotnet build FreeW.slnx --configuration Release

      - name: Test
        shell: pwsh
        run: dotnet test FreeW.slnx --configuration Release --no-build
