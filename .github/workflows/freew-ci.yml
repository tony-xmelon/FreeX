name: FreeW CI

# Dedicated build + test gate for the FreeW word processor (freew/, FreeW*.slnx).
# Runs automatically on every push/PR to main (mirroring ci.yml's default-tests lane),
# plus on demand via the Actions tab (workflow_dispatch) for ad-hoc validation.
#
# R121: this was manual-only (workflow_dispatch-only) from 2026-06-25 to 2026-08-06 --
# disabled during a merge push and never re-enabled, so FreeW.slnx silently stopped being
# built or tested by anything automated for six weeks. Restored to an automatic gate so a
# FreeW-breaking change on main is caught the same push/PR cycle it lands in.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: freew-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  freew-tests:
    name: FreeW test lane
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build (Release, 0 warnings enforced)
        shell: pwsh
        run: dotnet build FreeW.slnx --configuration Release

      - name: Test
        shell: pwsh
        run: dotnet test FreeW.slnx --configuration Release --no-build
