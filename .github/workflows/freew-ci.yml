name: FreeW CI

# Dedicated app-scoped commit gate. It avoids duplicate FreeX solution runs while ensuring a
# FreeW or shared-library change is validated before a tester-release workflow can publish it.
on:
  push:
    branches: [main]
    paths: ["freew/**", "shared/**", "eng/test-gates.json", "tools/Invoke-TestGate.ps1", ".github/workflows/freew-ci.yml"]
  pull_request:
    branches: [main]
    paths: ["freew/**", "shared/**", "eng/test-gates.json", "tools/Invoke-TestGate.ps1", ".github/workflows/freew-ci.yml"]
  workflow_dispatch:

concurrency:
  group: freew-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  freew-tests:
    name: FreeW ${{ matrix.platform }} commit gate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
          - platform: linux
            runner: ubuntu-latest
          - platform: macos
            runner: macos-15-intel

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build (Release, 0 warnings enforced)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: dotnet build FreeW.slnx --configuration Release

      - name: Commit gate
        shell: pwsh
        run: pwsh -NoProfile -File tools/Invoke-TestGate.ps1 -Gate commit -App FreeW -Platform ${{ matrix.platform }} ${{ matrix.platform == 'windows' && '-NoBuild' || '' }}
