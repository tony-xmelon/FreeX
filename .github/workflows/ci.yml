name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  default-tests:
    name: Default test lane
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Repository preflight
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\Test-RepositoryPreflight.ps1

      - name: Build
        shell: pwsh
        run: dotnet build FreeX.DefaultTests.slnx --configuration Release

      - name: Test
        shell: pwsh
        run: dotnet test FreeX.DefaultTests.slnx --configuration Release --no-build

  portable-macos:
    name: macOS portable lane
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build portable tests
        shell: pwsh
        run: dotnet build FreeX.DefaultTests.slnx --configuration Release

      - name: Test portable tests
        shell: pwsh
        run: dotnet test FreeX.DefaultTests.slnx --configuration Release --no-build

  ui-tests:
    name: UI test lane
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build
        shell: pwsh
        run: dotnet build FreeX.UiTests.slnx --configuration Release

      - name: Test
        shell: pwsh
        run: dotnet test FreeX.UiTests.slnx --configuration Release --no-build
