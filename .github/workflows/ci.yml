name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_ui_tests:
        description: Run the explicitly requested UI test lane
        required: true
        default: false
        type: boolean

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  default-tests:
    name: Default test lane
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.111

      - name: Repository preflight
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\Test-RepositoryPreflight.ps1

      - name: Build
        shell: pwsh
        run: dotnet build FreeX.slnx --configuration Release

      - name: Test
        shell: pwsh
        run: dotnet test FreeX.DefaultTests.slnx --configuration Release --no-build

  portable-macos:
    name: macOS portable lane
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.111

      - name: Build Avalonia project
        shell: pwsh
        run: dotnet build src/FreeX.App.Avalonia/FreeX.App.Avalonia.csproj --configuration Release

      - name: Build portable tests
        shell: pwsh
        run: dotnet build FreeX.PortableTests.slnx --configuration Release -m:1

      - name: Test portable tests
        shell: pwsh
        run: dotnet test FreeX.PortableTests.slnx --configuration Release --no-build

  ui-tests:
    name: UI test lane
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_ui_tests == true }}
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.111

      - name: Repository preflight
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools\Test-RepositoryPreflight.ps1

      - name: Build
        shell: pwsh
        run: dotnet build FreeX.UiTests.slnx --configuration Release

      - name: Test
        shell: pwsh
        run: dotnet test FreeX.UiTests.slnx --configuration Release --no-build
