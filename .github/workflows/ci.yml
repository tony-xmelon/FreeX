name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  freex-commit:
    name: FreeX commit gate
    runs-on: windows-latest
    timeout-minutes: 180

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Repository preflight
        shell: pwsh
        run: pwsh -NoProfile -File tools/Test-RepositoryPreflight.ps1

      - name: Build
        shell: pwsh
        run: dotnet build FreeX.slnx --configuration Release

      - name: Commit gate
        shell: pwsh
        run: pwsh -NoProfile -File tools/Invoke-TestGate.ps1 -Gate commit -App FreeX -Platform windows -NoBuild

  portable-linux:
    name: Linux portable lane
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build Avalonia project
        shell: pwsh
        run: dotnet build src/FreeX.App.Avalonia/FreeX.App.Avalonia.csproj --configuration Release

      - name: Build portable tests
        shell: pwsh
        run: dotnet build FreeX.DefaultTests.slnx --configuration Release

      - name: Commit gate
        shell: pwsh
        run: pwsh -NoProfile -File tools/Invoke-TestGate.ps1 -Gate commit -App FreeX -Platform linux -NoBuild

  portable-macos:
    name: macOS portable lane
    runs-on: macos-latest
    timeout-minutes: 120

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build Avalonia project
        shell: pwsh
        run: dotnet build src/FreeX.App.Avalonia/FreeX.App.Avalonia.csproj --configuration Release

      - name: Build portable tests
        shell: pwsh
        run: dotnet build FreeX.DefaultTests.slnx --configuration Release

      - name: Commit gate
        shell: pwsh
        run: pwsh -NoProfile -File tools/Invoke-TestGate.ps1 -Gate commit -App FreeX -Platform macos -NoBuild
