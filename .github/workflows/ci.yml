name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8

jobs:
  prepare:
    name: Select test gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout gate manifest
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Build test matrix from the repository contract
        id: matrix
        shell: pwsh
        run: pwsh -NoProfile -File tools/Get-TestGateMatrix.ps1 -Gate commit -GitHubOutputPath $env:GITHUB_OUTPUT

  preflight-static:
    name: Repository preflight (static)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-v2-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', 'Directory.Build.props', 'Directory.Build.targets') }}
          restore-keys: nuget-v2-${{ runner.os }}-
      - name: Run repository-static preflight
        shell: pwsh
        run: pwsh -NoProfile -File tools/Test-RepositoryPreflight.ps1 -Mode Static

  preflight-platform:
    name: Repository preflight (${{ matrix.platform }} behavior)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
          - platform: linux
            runner: ubuntu-latest
          - platform: macos
            runner: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-v2-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', 'Directory.Build.props', 'Directory.Build.targets') }}
          restore-keys: nuget-v2-${{ runner.os }}-
      - name: Run platform behavior preflight
        shell: pwsh
        run: pwsh -NoProfile -File tools/Test-RepositoryPreflight.ps1 -Mode Platform

  tests:
    name: ${{ matrix.app }} ${{ matrix.platform }} ${{ matrix.gateId }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ matrix.fetchDepth }}
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-v2-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', 'Directory.Build.props', 'Directory.Build.targets') }}
          restore-keys: nuget-v2-${{ runner.os }}-
      - name: Run isolated test gate
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/Invoke-TestGate.ps1 `
            -Gate "${{ matrix.gate }}" `
            -App "${{ matrix.app }}" `
            -Platform "${{ matrix.platform }}" `
            -GateId "${{ matrix.gateId }}" `
            -HangTimeout 15m `
            -ResultsDirectory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-${{ matrix.platform }}-${{ matrix.gateId }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: "**/TestResults/**"
          if-no-files-found: warn
          retention-days: 7

  quality-gate:
    # Keep the established required-check name so branch protection does not need migration.
    name: FreeX commit gate
    needs: [prepare, preflight-static, preflight-platform, tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate all app and platform gates
        shell: pwsh
        run: |
          $prepareResult = "${{ needs.prepare.result }}"
          $staticPreflightResult = "${{ needs.preflight-static.result }}"
          $platformPreflightResult = "${{ needs.preflight-platform.result }}"
          $testResult = "${{ needs.tests.result }}"
          if ($prepareResult -ne 'success' -or $staticPreflightResult -ne 'success' -or $platformPreflightResult -ne 'success' -or $testResult -ne 'success') {
            throw "Matrix result: $prepareResult; static preflight: $staticPreflightResult; platform preflight: $platformPreflightResult; test result: $testResult."
          }
