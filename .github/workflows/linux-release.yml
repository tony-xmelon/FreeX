name: Linux Release

# Manual-only release channel for the Linux Avalonia app, comparable to the
# Windows tester release. Builds versioned, checksummed linux-x64/linux-arm64
# tarballs + AppImages, validates artifact readiness and a promotion gate
# (accessibility evidence required for a public-preview candidate), and publishes
# them as GitHub release assets. Dispatch with:
#   gh workflow run linux-release.yml --ref <branch> -f release_version=0.1.0
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version, for example 0.1.0
        required: true
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: true
        default: true
        type: boolean
      public_preview_candidate:
        description: Promote as a public-preview candidate (requires all accessibility evidence inputs true)
        required: true
        default: false
        type: boolean
      accessibility_keyboard_only:
        description: Keyboard-only validation recorded
        required: true
        default: false
        type: boolean
      accessibility_screen_reader:
        description: Screen-reader (AT-SPI/Orca) validation recorded
        required: true
        default: false
        type: boolean
      accessibility_x11:
        description: X11 session validation recorded
        required: true
        default: false
        type: boolean
      accessibility_wayland:
        description: Wayland session validation recorded
        required: true
        default: false
        type: boolean
      accessibility_known_issues:
        description: Known accessibility issues reviewed or marked none
        required: true
        default: false
        type: boolean
      release_notes:
        description: Optional notes appended to the generated release notes
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: linux-release
  cancel-in-progress: false

jobs:
  build:
    name: Linux release build (${{ matrix.runtime }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - runtime: linux-x64
            arch: x86_64
            runner: ubuntu-latest
          - runtime: linux-arm64
            arch: aarch64
            runner: ubuntu-24.04-arm
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      FREEX_RUNTIME: ${{ matrix.runtime }}
      FREEX_ARCH: ${{ matrix.arch }}
      FREEX_APP_VERSION: ${{ inputs.release_version }}
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.111

      - name: Install Linux desktop dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libfontconfig1 libice6 libsm6 libx11-6 libx11-xcb1 \
            libxext6 libxrender1 libgl1 libglu1-mesa libegl1 \
            desktop-file-utils shared-mime-info

      - name: Build, package, and smoke-test release artifacts
        shell: bash
        run: |
          set -euo pipefail

          runtime="$FREEX_RUNTIME"
          version="$FREEX_APP_VERSION"
          artifact_root="$GITHUB_WORKSPACE/artifacts"
          evidence_path="$artifact_root/freex-$runtime-linux-evidence.txt"
          smoke_log="$artifact_root/freex-$runtime-linux-packaging-smoke.log"
          launch_smoke_report="$artifact_root/freex-$runtime-linux-launch-smoke.txt"
          packaged_product_launch_report="$RUNNER_TEMP/freex-$runtime-packaged-product-launch.txt"
          packaged_product_launch_log="$RUNNER_TEMP/freex-$runtime-packaged-product-launch.log"
          packaged_product_probe_home="$RUNNER_TEMP/freex-$runtime-packaged-product-home"
          app_diagnostics_dir="$artifact_root/freex-$runtime-linux-app-diagnostics"
          published="$RUNNER_TEMP/freex-$runtime-publish"
          validation_published="$RUNNER_TEMP/freex-$runtime-validation-publish"
          dist="$artifact_root"

          rm -rf "$packaged_product_probe_home"
          mkdir -p "$artifact_root" "$app_diagnostics_dir"
          {
            echo "runtime=$runtime"
            echo "arch=$FREEX_ARCH"
            echo "artifact_channel=internal-preview"
            echo "app_version=$version"
            echo "github_run_id=${GITHUB_RUN_ID}"
            echo "github_run_attempt=${GITHUB_RUN_ATTEMPT}"
          } > "$evidence_path"

          dotnet publish src/FreeX.App.Avalonia/FreeX.App.Avalonia.csproj \
            --configuration Release --framework net10.0 --runtime "$runtime" \
            --self-contained true -p:UseAppHost=true -p:PublishReadyToRun=false \
            -p:PublishSingleFile=false --output "$published"
          test -x "$published/FreeX"
          dotnet publish tools/FreeX.Validation.Avalonia/FreeX.Validation.Avalonia.csproj \
            --configuration Release --framework net10.0 --runtime "$runtime" \
            --self-contained true -p:UseAppHost=true -p:PublishReadyToRun=false \
            -p:PublishSingleFile=false --output "$validation_published"
          test -x "$validation_published/FreeX.Validation.Avalonia"

          desktop_file="src/FreeX.App.Avalonia/Packaging/linux/io.github.tony-xmelon.freex.desktop"
          desktop-file-validate "$desktop_file"
          {
            echo "desktop_entry_valid=true"
            echo "mime_definition_present=true"
            echo "icon_present=true"
          } >> "$evidence_path"

          tarball="$(src/FreeX.App.Avalonia/Packaging/linux/package-linux-app.sh \
            --runtime "$runtime" --published "$published" --version "$version" --output "$dist")"
          test -f "$tarball"
          tarball_name="$(basename "$tarball")"
          (cd "$dist" && sha256sum "$tarball_name" > "$tarball_name.sha256")
          (cd "$dist" && sha256sum -c "$tarball_name.sha256")
          {
            echo "tarball_name=$tarball_name"
            echo "tarball_sha256=$(cut -d ' ' -f 1 "$dist/$tarball_name.sha256")"
          } >> "$evidence_path"

          # Headless packaging smoke (hard gate).
          "$validation_published/FreeX.Validation.Avalonia" --packaging-smoke | tee "$smoke_log"
          grep -q "Packaging smoke opened" "$smoke_log"
          grep -q "format_cells_style_roundtrip=true" "$smoke_log"
          smoke_file="$RUNNER_TEMP/freex-$runtime-smoke.csv"
          printf 'Name,Amount\nFreeX,42\n' > "$smoke_file"
          "$validation_published/FreeX.Validation.Avalonia" --packaging-smoke "$smoke_file" | tee -a "$smoke_log"
          rt_count="$(grep -c "format_cells_style_roundtrip=true" "$smoke_log")"
          test "$rt_count" -ge 2
          {
            echo "format_cells_style_roundtrip=true"
            echo "format_cells_style_roundtrip_count=$rt_count"
            echo "packaging_smoke_status=passed"
          } >> "$evidence_path"

          # Bounded product probe against the actual published apphost.
          packaged_product_launch_file="$RUNNER_TEMP/freex-$runtime-packaged-product-launch.csv"
          printf 'Name,Amount\nFreeX Packaged Product,126\n' > "$packaged_product_launch_file"
          HOME="$packaged_product_probe_home" \
          XDG_DATA_HOME="$packaged_product_probe_home/.local/share" \
            xvfb-run -a bash tools/Run-PackagedProductLaunchProbe.sh \
              --executable "$published/FreeX" \
              --readiness-root "$packaged_product_probe_home" \
              --report "$packaged_product_launch_report" \
              --log "$packaged_product_launch_log" \
              -- "$packaged_product_launch_file"
          grep -Fqx "packaged_product_launch_status=passed" "$packaged_product_launch_report"
          grep -Fqx "packaged_product_executable=$published/FreeX" "$packaged_product_launch_report"
          cat "$packaged_product_launch_report" >> "$evidence_path"

          # GUI launch smoke under Xvfb (hard gate).
          launch_file="$RUNNER_TEMP/freex-$runtime-launch.csv"
          printf 'Name,Amount\nFreeX Launch,84\n' > "$launch_file"
          xvfb-run -a "$validation_published/FreeX.Validation.Avalonia" \
            --launch-smoke "$launch_smoke_report" \
            --launch-smoke-diagnostics-dir "$app_diagnostics_dir" "$launch_file"
          grep -q "window_shown=true" "$launch_smoke_report"
          grep -q "viewport_rows=[1-9]" "$launch_smoke_report"
          grep -q "native_file_menu=true" "$launch_smoke_report"
          echo "launch_smoke_status=passed" >> "$evidence_path"

          test -f "$app_diagnostics_dir/events.jsonl"
          grep -q '"eventName":"app_start"' "$app_diagnostics_dir/events.jsonl"
          echo "app_diagnostics_events_jsonl=true" >> "$evidence_path"

          # AppImage (release artifact; non-fatal evidence).
          appimage_status="skipped"
          tool="$RUNNER_TEMP/appimagetool"
          appimage="$dist/FreeX-$version-$FREEX_ARCH.AppImage"
          if curl -fsSL -o "$tool" \
               "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-$FREEX_ARCH.AppImage" \
             && chmod +x "$tool" \
             && APPIMAGE_EXTRACT_AND_RUN=1 src/FreeX.App.Avalonia/Packaging/linux/build-appimage.sh \
                  --runtime "$runtime" --published "$published" --version "$version" \
                  --output "$dist" --appimagetool "$tool" \
             && test -f "$appimage"; then
            (cd "$dist" && sha256sum "$(basename "$appimage")" > "$(basename "$appimage").sha256")
            appimage_status="built"
            echo "appimage_name=$(basename "$appimage")" >> "$evidence_path"
          else
            appimage_status="failed"
          fi
          echo "appimage_status=$appimage_status" >> "$evidence_path"

          # Debian package (distro-native install; non-fatal evidence).
          deb_status="skipped"
          case "$runtime" in linux-x64) deb_arch="amd64";; linux-arm64) deb_arch="arm64";; *) deb_arch="";; esac
          deb="$dist/freex_${version}_${deb_arch}.deb"
          if [[ -n "$deb_arch" ]] \
             && src/FreeX.App.Avalonia/Packaging/linux/build-deb.sh \
                  --runtime "$runtime" --published "$published" --version "$version" --output "$dist" \
             && test -f "$deb"; then
            (cd "$dist" && sha256sum "$(basename "$deb")" > "$(basename "$deb").sha256")
            deb_status="built"
            echo "deb_name=$(basename "$deb")" >> "$evidence_path"
          else
            deb_status="failed"
          fi
          echo "deb_status=$deb_status" >> "$evidence_path"

      - name: Upload release build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: freex-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.runtime }}-linux-app
          path: |
            artifacts/freex-${{ inputs.release_version }}-${{ matrix.runtime }}.tar.gz
            artifacts/freex-${{ inputs.release_version }}-${{ matrix.runtime }}.tar.gz.sha256
            artifacts/FreeX-${{ inputs.release_version }}-${{ matrix.arch }}.AppImage
            artifacts/FreeX-${{ inputs.release_version }}-${{ matrix.arch }}.AppImage.sha256
            artifacts/freex_${{ inputs.release_version }}_*.deb
            artifacts/freex_${{ inputs.release_version }}_*.deb.sha256
            artifacts/freex-${{ matrix.runtime }}-linux-evidence.txt
            artifacts/freex-${{ matrix.runtime }}-linux-packaging-smoke.log
            artifacts/freex-${{ matrix.runtime }}-linux-launch-smoke.txt
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish Linux release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: public-preview
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download build artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: downloaded-artifacts
          pattern: freex-${{ github.run_id }}-${{ github.run_attempt }}-*-linux-app

      - name: Validate promotion gate
        shell: pwsh
        run: |
          # Hashtable splat so switch parameters bind correctly (array splat would pass
          # "-Switch" strings as positional arguments, not switches).
          $params = @{
            ArtifactRoot       = "downloaded-artifacts"
            ExpectedRunId      = $env:GITHUB_RUN_ID
            ExpectedRunAttempt = $env:GITHUB_RUN_ATTEMPT
          }
          if ("${{ inputs.public_preview_candidate }}" -eq "true") { $params.PublicPreviewCandidate = $true }
          if ("${{ inputs.accessibility_keyboard_only }}" -eq "true") { $params.AccessibilityKeyboardOnly = $true }
          if ("${{ inputs.accessibility_screen_reader }}" -eq "true") { $params.AccessibilityScreenReader = $true }
          if ("${{ inputs.accessibility_x11 }}" -eq "true") { $params.AccessibilityX11 = $true }
          if ("${{ inputs.accessibility_wayland }}" -eq "true") { $params.AccessibilityWayland = $true }
          if ("${{ inputs.accessibility_known_issues }}" -eq "true") { $params.AccessibilityKnownIssuesReviewed = $true }
          ./tools/Test-LinuxPublicPreviewPromotion.ps1 @params

      - name: Stage release assets
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.release_version }}"
          stage="$GITHUB_WORKSPACE/release-assets"
          mkdir -p "$stage"
          find downloaded-artifacts -type f \( \
            -name 'freex-*.tar.gz' -o -name 'freex-*.tar.gz.sha256' -o \
            -name 'FreeX-*.AppImage' -o -name 'FreeX-*.AppImage.sha256' -o \
            -name 'freex_*.deb' -o -name 'freex_*.deb.sha256' -o \
            -name 'freex-*-linux-evidence.txt' \) -exec cp {} "$stage/" \;
          ls -la "$stage"
          {
            echo "tag=freex-linux-v$version"
            echo "title=FreeX Linux v$version"
          } >> "$GITHUB_OUTPUT"

          cat > "$stage/RELEASE_NOTES.md" <<EOF
          # FreeX Linux v$version

          Self-contained Linux build of the FreeX Avalonia app (linux-x64 and linux-arm64).

          - Channel: $([[ "${{ inputs.public_preview_candidate }}" == "true" ]] && echo public-preview-candidate || echo internal-preview)
          - Verify with: \`sha256sum -c <asset>.sha256\`
          - Tarball: extract and run \`install.sh\` (installs to ~/.local), then launch \`freex\`.
          - AppImage: \`chmod +x FreeX-$version-<arch>.AppImage && ./FreeX-$version-<arch>.AppImage\`
          - Debian/Ubuntu: \`sudo apt install ./freex_${version}_<arch>.deb\` (amd64 or arm64), then launch \`freex\`.

          A desktop session with X11 or Wayland is required; no system .NET install is needed.

          ${{ inputs.release_notes }}
          EOF
          cp artifacts/linux-preview-promotion-manifest.json "$stage/" 2>/dev/null || true

      - name: Create or update GitHub release (draft)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ steps.stage.outputs.tag }}"
          $title = "${{ steps.stage.outputs.title }}"
          $notes = "release-assets/RELEASE_NOTES.md"
          $assets = Get-ChildItem -LiteralPath "release-assets" -File |
            Where-Object { $_.Name -ne "RELEASE_NOTES.md" } |
            ForEach-Object { $_.FullName }
          if ($assets.Count -eq 0) { throw "No Linux release assets were staged." }

          $prerelease = if ("${{ inputs.prerelease }}" -eq "true") { "--prerelease" } else { "" }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
            gh release edit $tag --title $title --notes-file $notes $prerelease
          } else {
            # Always create as a draft first; promotion/un-drafting stays a manual decision.
            gh release create $tag @assets --target $env:GITHUB_SHA --title $title --notes-file $notes --draft $prerelease
          }
          Write-Host "Linux release '$tag' staged as draft. Review assets, then publish from the Releases page."
