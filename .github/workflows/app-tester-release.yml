name: App Tester Release

# The single public tester-release contract for every app/platform combination.
# Each package job is independently runnable through the app/platform inputs;
# the publish job only assembles the resulting assets under one app/version tag.
on:
  workflow_dispatch:
    inputs:
      app:
        description: App to release
        required: true
        default: all
        type: choice
        options:
          - all
          - FreeX
          - FreeW
          - FreeP
      platform:
        description: Platform lane to run
        required: true
        default: all
        type: choice
        options:
          - all
          - windows
          - linux
          - macos
      release_version:
        description: Release version, for example 0.8.151
        required: true
        type: string
      prerelease:
        description: Mark each app release as a prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: app-tester-release-${{ inputs.app }}-${{ inputs.release_version }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  prepare:
    name: Select release lanes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      verify_matrix: ${{ steps.select.outputs.verify_matrix }}
      package_matrix: ${{ steps.select.outputs.package_matrix }}
      publish_matrix: ${{ steps.select.outputs.publish_matrix }}
    steps:
      - name: Select requested app and platform lanes
        id: select
        shell: pwsh
        run: |
          $appInput = "${{ inputs.app }}"
          $platformInput = "${{ inputs.platform }}"
          $apps = if ($appInput -eq "all") { @("FreeX", "FreeW", "FreeP") } else { @($appInput) }
          $platforms = if ($platformInput -eq "all") { @("windows", "linux", "macos") } else { @($platformInput) }
          $lanes = @(
            @{ app = "FreeX"; platform = "windows"; runtime = "win-x64"; runner = "windows-latest" },
            @{ app = "FreeX"; platform = "linux"; runtime = "linux-x64"; runner = "ubuntu-latest" },
            @{ app = "FreeX"; platform = "linux"; runtime = "linux-arm64"; runner = "ubuntu-24.04-arm" },
            @{ app = "FreeX"; platform = "macos"; runtime = "osx-x64"; runner = "macos-15-intel" },
            @{ app = "FreeX"; platform = "macos"; runtime = "osx-arm64"; runner = "macos-15" },
            @{ app = "FreeW"; platform = "windows"; runtime = "win-x64"; runner = "windows-latest" },
            @{ app = "FreeW"; platform = "linux"; runtime = "linux-x64"; runner = "ubuntu-latest" },
            @{ app = "FreeW"; platform = "linux"; runtime = "linux-arm64"; runner = "ubuntu-24.04-arm" },
            @{ app = "FreeW"; platform = "macos"; runtime = "osx-x64"; runner = "macos-15-intel" },
            @{ app = "FreeW"; platform = "macos"; runtime = "osx-arm64"; runner = "macos-15" },
            @{ app = "FreeP"; platform = "windows"; runtime = "win-x64"; runner = "windows-latest" },
            @{ app = "FreeP"; platform = "linux"; runtime = "linux-x64"; runner = "ubuntu-latest" },
            @{ app = "FreeP"; platform = "linux"; runtime = "linux-arm64"; runner = "ubuntu-24.04-arm" },
            @{ app = "FreeP"; platform = "macos"; runtime = "osx-x64"; runner = "macos-15-intel" },
            @{ app = "FreeP"; platform = "macos"; runtime = "osx-arm64"; runner = "macos-15" }
          )
          $selectedLanes = @($lanes | Where-Object { $_.app -in $apps -and $_.platform -in $platforms })
          if ($selectedLanes.Count -eq 0) { throw "No release lanes were selected." }

          $verifyLanes = @(
            $selectedLanes |
              Group-Object { "$($_.app):$($_.platform)" } |
              ForEach-Object {
                $lane = $_.Group[0]
                @{ app = $lane.app; platform = $lane.platform; runner = $lane.runner }
              }
          )
          $verifyMatrix = @{ include = $verifyLanes } | ConvertTo-Json -Compress
          $packageMatrix = @{ include = $selectedLanes } | ConvertTo-Json -Compress
          $publishMatrix = @{ app = $apps } | ConvertTo-Json -Compress
          "verify_matrix=$verifyMatrix" >> $env:GITHUB_OUTPUT
          "package_matrix=$packageMatrix" >> $env:GITHUB_OUTPUT
          "publish_matrix=$publishMatrix" >> $env:GITHUB_OUTPUT

  verify:
    name: Verify ${{ matrix.app }} ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.verify_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate latest release source
        shell: pwsh
        run: |
          $isMainRelease = $env:GITHUB_REF -eq "refs/heads/main"
          $isFullReleaseBranch = $env:GITHUB_REF -like "refs/heads/codex/full-release-*"
          if (-not ($isMainRelease -or $isFullReleaseBranch)) {
            throw "Full app releases must run from refs/heads/main or a codex/full-release-* branch."
          }

          git fetch origin main:refs/remotes/origin/main --no-tags
          if ($LASTEXITCODE -ne 0) {
            throw "Could not fetch origin/main while validating the full release source."
          }

          git merge-base --is-ancestor origin/main HEAD
          if ($LASTEXITCODE -ne 0) {
            throw "Full release branches must contain the current origin/main commit."
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Run release test gate
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/Test-RepositoryPreflight.ps1
          if ($LASTEXITCODE -ne 0) { throw "Repository preflight failed with exit code $LASTEXITCODE." }
          pwsh -NoProfile -File tools/Invoke-TestGate.ps1 `
            -Gate release `
            -App "${{ matrix.app }}" `
            -Platform "${{ matrix.platform }}" `
            -ResultsDirectory TestResults
          if ($LASTEXITCODE -ne 0) { throw "Release gate failed with exit code $LASTEXITCODE." }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tester-${{ matrix.app }}-${{ github.run_id }}-${{ github.run_attempt }}-test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: warn

  package:
    name: Package ${{ matrix.app }} ${{ matrix.runtime }}
    needs: [prepare, verify]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.package_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Locate Inno Setup
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $compiler = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $compiler) {
            choco install innosetup --version 6.4.3 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Could not install the Inno Setup compiler." }
            $compiler = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path -LiteralPath $compiler)) { throw "Inno Setup compiler not found." }
          "INNO_SETUP_COMPILER=$compiler" >> $env:GITHUB_ENV

      - name: Publish self-contained tester package
        shell: pwsh
        env:
          # Optional public ingestion identifier embedded as assembly metadata.
          # An absent value keeps diagnostics local and does not block packaging.
          FreeFamilySentryDsn: ${{ secrets.FREE_FAMILY_SENTRY_DSN }}
          FreeFamilySentryEnvironment: tester-release
        run: |
          $version = "${{ inputs.release_version }}".Trim()
          if ([string]::IsNullOrWhiteSpace($version) -or $version -match "[`r`n]") {
            throw "release_version must be a non-empty single line."
          }

          tools/Publish-SisterAppTesterPackages.ps1 `
            -App "${{ matrix.app }}" `
            -Version $version `
            -Runtimes "${{ matrix.runtime }}" `
            -WindowsPackageMode SingleFile `
            -OutputDir artifacts\release

          tools/packaging/New-AppInstallers.ps1 `
            -Apps "${{ matrix.app }}" `
            -Platform "${{ matrix.platform }}" `
            -Version $version `
            -Runtime "${{ matrix.runtime }}" `
            -InputRoot artifacts\release `
            -OutputDir artifacts\release

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: tester-${{ matrix.app }}-${{ inputs.release_version }}-${{ matrix.runtime }}
          path: |
            artifacts/release/${{ matrix.app }}-v${{ inputs.release_version }}-${{ matrix.runtime }}.*
            artifacts/release/${{ matrix.app }}-v${{ inputs.release_version }}-${{ matrix.runtime }}-*
            artifacts/release/${{ matrix.app }}-${{ inputs.release_version }}-*-manifest.csv
          if-no-files-found: error
          retention-days: 14

  suite-package:
    name: Package Free Suite ${{ matrix.runtime }}
    needs: [prepare, package]
    if: inputs.app == 'all'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runtime: win-x64
            runner: windows-latest
          - platform: linux
            runtime: linux-x64
            runner: ubuntu-latest
          - platform: linux
            runtime: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: macos
            runtime: osx-x64
            runner: macos-15-intel
          - platform: macos
            runtime: osx-arm64
            runner: macos-15
    steps:
      - name: Checkout
        if: inputs.platform == 'all' || inputs.platform == matrix.platform
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download portable app packages
        if: inputs.platform == 'all' || inputs.platform == matrix.platform
        uses: actions/download-artifact@v7
        with:
          pattern: tester-*-${{ inputs.release_version }}-${{ matrix.runtime }}
          path: downloaded-artifacts
          merge-multiple: false

      - name: Locate Inno Setup
        if: (inputs.platform == 'all' || inputs.platform == matrix.platform) && matrix.platform == 'windows'
        shell: pwsh
        run: |
          $compiler = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $compiler) {
            choco install innosetup --version 6.4.3 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Could not install the Inno Setup compiler." }
            $compiler = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path -LiteralPath $compiler)) { throw "Inno Setup compiler not found." }
          "INNO_SETUP_COMPILER=$compiler" >> $env:GITHUB_ENV

      - name: Build unsigned suite installer
        if: inputs.platform == 'all' || inputs.platform == matrix.platform
        shell: pwsh
        run: |
          tools/packaging/New-AppInstallers.ps1 `
            -Apps FreeX,FreeW,FreeP `
            -Suite `
            -Platform "${{ matrix.platform }}" `
            -Version "${{ inputs.release_version }}" `
            -Runtime "${{ matrix.runtime }}" `
            -InputRoot downloaded-artifacts `
            -OutputDir artifacts\suite

      - name: Upload suite installer
        if: inputs.platform == 'all' || inputs.platform == matrix.platform
        uses: actions/upload-artifact@v7
        with:
          name: tester-FreeSuite-${{ inputs.release_version }}-${{ matrix.runtime }}
          path: artifacts/suite/FreeSuite-v${{ inputs.release_version }}-${{ matrix.runtime }}-*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish ${{ matrix.app }} release
    needs: [prepare, package]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.publish_matrix) }}
    steps:
      - name: Checkout release context
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download selected app packages
        uses: actions/download-artifact@v7
        with:
          pattern: tester-${{ matrix.app }}-${{ inputs.release_version }}-*
          path: downloaded-artifacts
          merge-multiple: false

      - name: Create or update tester release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $app = "${{ matrix.app }}"
          $version = "${{ inputs.release_version }}".Trim()
          $tag = "$($app.ToLowerInvariant())-v$version"
          $title = "$app v$version Tester Release"
          $assetRoot = Join-Path $env:GITHUB_WORKSPACE "release-assets"
          New-Item -ItemType Directory -Force -Path $assetRoot | Out-Null

          Get-ChildItem -LiteralPath "downloaded-artifacts" -Recurse -File |
            Where-Object { $_.Name -notlike "*-manifest.csv" } |
            ForEach-Object {
              Copy-Item -LiteralPath $_.FullName -Destination (Join-Path $assetRoot $_.Name) -Force
            }

          $assets = @(Get-ChildItem -LiteralPath $assetRoot -File | ForEach-Object { $_.FullName })
          if ($assets.Count -eq 0) {
            throw "No $app release assets were downloaded."
          }

          $notes = @'
          # {{APP}} v{{VERSION}} Tester Release

          Assets are built independently for each selected platform from commit {{SHA}}.

          ## Install and deploy

          ### Windows x64

          1. Download `{{APP}}-v{{VERSION}}-win-x64.exe` and its `.sha256` file.
          2. Verify the download: `Get-FileHash .\{{APP}}-v{{VERSION}}-win-x64.exe -Algorithm SHA256`; compare the hash with the `.sha256` file.
          3. Move the executable to the directory from which the user will run it, then launch it. It is self-contained and needs no .NET installation or installer.
          4. To update, close the app and replace the executable in that directory.

          ### Linux x64 and ARM64

          1. Choose `linux-x64` for Intel/AMD 64-bit systems or `linux-arm64` for 64-bit ARM systems. Download the matching `.zip` and `.sha256` file.
          2. Verify it with `sha256sum -c {{APP}}-v{{VERSION}}-linux-<architecture>.zip.sha256`.
          3. Extract it into a stable per-user directory, for example `unzip {{APP}}-v{{VERSION}}-linux-<architecture>.zip -d ~/{{APP}}`.
          4. Run `chmod +x ~/{{APP}}/{{APP}}` once, then start it with `~/{{APP}}/{{APP}}`. To update, close the app and replace the extracted directory.

          ### macOS Intel and Apple silicon

          1. Choose `osx-x64` for Intel Macs or `osx-arm64` for Apple silicon. Download the matching `.zip` and `.sha256` file.
          2. Verify it with `shasum -a 256 -c {{APP}}-v{{VERSION}}-osx-<architecture>.zip.sha256`.
          3. Extract it into a stable per-user directory, for example `unzip {{APP}}-v{{VERSION}}-osx-<architecture>.zip -d ~/{{APP}}`.
          4. Run `chmod +x ~/{{APP}}/{{APP}}` once, then start it with `~/{{APP}}/{{APP}}`. To update, close the app and replace the extracted directory.

          These tester packages are self-contained. Do not run them from inside the archive; keep the extracted Linux or macOS directory intact. The macOS assets are unsigned portable archives, not signed or notarized `.app` bundles.

          Each platform also includes an installable package: `-setup.exe` on Windows, `-installer.zip` on Linux, and `-apps.zip` containing an unsigned/unnotarized `.app` bundle on macOS. The original portable executable or archive remains available.
          '@
          $notes = $notes.
            Replace("{{APP}}", $app).
            Replace("{{VERSION}}", $version).
            Replace("{{SHA}}", $env:GITHUB_SHA)

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
            $notes | gh release edit $tag --title $title --notes-file -
          } else {
            $releaseArgs = @()
            if ("${{ inputs.prerelease }}" -eq "true") { $releaseArgs += "--prerelease" }
            $notes | gh release create $tag @assets --target $env:GITHUB_SHA --title $title --notes-file - @releaseArgs
          }

  publish-suite:
    name: Publish Free Suite release
    needs: suite-package
    if: inputs.app == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download suite packages
        uses: actions/download-artifact@v7
        with:
          pattern: tester-FreeSuite-${{ inputs.release_version }}-*
          path: downloaded-artifacts
          merge-multiple: true

      - name: Create or update suite release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ inputs.release_version }}".Trim()
          $tag = "free-suite-v$version"
          $title = "Free Suite v$version Tester Release"
          $assets = @(Get-ChildItem -LiteralPath downloaded-artifacts -File | ForEach-Object { $_.FullName })
          if ($assets.Count -eq 0) { throw "No suite packages were downloaded." }
          $notes = @'
          # Free Suite v{{VERSION}} Tester Release

          This release installs FreeX, FreeW, and FreeP together by invoking the same per-app installers shipped on each app's release page. It does not create separate suite-owned copies, so suite-to-individual upgrades and individual-to-suite upgrades keep the same installation and uninstaller identities. Portable artifacts remain available on the individual release pages.

          Windows uses an unsigned per-user setup executable. Linux uses an installer bundle whose `install.sh` defaults to `~/.local`. macOS contains all three `.app` bundles and an `install.sh` helper; those bundles are currently unsigned and unnotarized.
          '@.Replace("{{VERSION}}", $version)

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
            $notes | gh release edit $tag --title $title --notes-file -
          } else {
            $releaseArgs = @()
            if ("${{ inputs.prerelease }}" -eq "true") { $releaseArgs += "--prerelease" }
            $notes | gh release create $tag @assets --target $env:GITHUB_SHA --title $title --notes-file - @releaseArgs
          }
