name: Full Signed Release

# The single signed release contract for every app/platform combination.
# Each package job is independently runnable through the app/platform inputs;
# the publish job only assembles the resulting assets under one app/version tag.
on:
  workflow_dispatch:
    inputs:
      app:
        description: App to release
        required: true
        default: all
        type: choice
        options:
          - all
          - FreeX
          - FreeW
          - FreeP
      platform:
        description: Platform lane to run
        required: true
        default: all
        type: choice
        options:
          - all
          - windows
          - linux
          - macos
      release_version:
        description: Release version, for example 0.8.151
        required: true
        type: string
      prerelease:
        description: Mark each app release as a prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  # A version owns one immutable set of app and suite tags. Serialize every
  # app/platform selection for that version so partial dispatches cannot race.
  group: full-signed-release-${{ inputs.release_version }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  prepare:
    name: Select release lanes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      package_matrix: ${{ steps.select.outputs.package_matrix }}
      suite_matrix: ${{ steps.select.outputs.suite_matrix }}
      publish_matrix: ${{ steps.select.outputs.publish_matrix }}
      release_matrix: ${{ steps.release_tests.outputs.matrix }}
    steps:
      - name: Checkout release contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Select requested app and platform lanes
        id: select
        shell: pwsh
        run: |
          $appInput = "${{ inputs.app }}"
          $platformInput = "${{ inputs.platform }}"
          $apps = if ($appInput -eq "all") { @("FreeX", "FreeW", "FreeP") } else { @($appInput) }
          $platforms = if ($platformInput -eq "all") { @("windows", "linux", "macos") } else { @($platformInput) }
          $lanes = @(
            @{ app = "FreeX"; platform = "windows"; runtime = "win-x64"; runner = "windows-latest" },
            @{ app = "FreeX"; platform = "linux"; runtime = "linux-x64"; runner = "ubuntu-latest" },
            @{ app = "FreeX"; platform = "linux"; runtime = "linux-arm64"; runner = "ubuntu-24.04-arm" },
            @{ app = "FreeX"; platform = "macos"; runtime = "osx-x64"; runner = "macos-15-intel" },
            @{ app = "FreeX"; platform = "macos"; runtime = "osx-arm64"; runner = "macos-15" },
            @{ app = "FreeW"; platform = "windows"; runtime = "win-x64"; runner = "windows-latest" },
            @{ app = "FreeW"; platform = "linux"; runtime = "linux-x64"; runner = "ubuntu-latest" },
            @{ app = "FreeW"; platform = "linux"; runtime = "linux-arm64"; runner = "ubuntu-24.04-arm" },
            @{ app = "FreeW"; platform = "macos"; runtime = "osx-x64"; runner = "macos-15-intel" },
            @{ app = "FreeW"; platform = "macos"; runtime = "osx-arm64"; runner = "macos-15" },
            @{ app = "FreeP"; platform = "windows"; runtime = "win-x64"; runner = "windows-latest" },
            @{ app = "FreeP"; platform = "linux"; runtime = "linux-x64"; runner = "ubuntu-latest" },
            @{ app = "FreeP"; platform = "linux"; runtime = "linux-arm64"; runner = "ubuntu-24.04-arm" },
            @{ app = "FreeP"; platform = "macos"; runtime = "osx-x64"; runner = "macos-15-intel" },
            @{ app = "FreeP"; platform = "macos"; runtime = "osx-arm64"; runner = "macos-15" }
          )
          $selectedLanes = @($lanes | Where-Object { $_.app -in $apps -and $_.platform -in $platforms })
          if ($selectedLanes.Count -eq 0) { throw "No release lanes were selected." }
          $suiteLanes = @(
            $lanes |
              Where-Object { $_.platform -in $platforms } |
              Group-Object runtime |
              ForEach-Object {
                $lane = $_.Group[0]
                @{ platform = $lane.platform; runtime = $lane.runtime; runner = $lane.runner }
              }
          )

          $packageMatrix = @{ include = $selectedLanes } | ConvertTo-Json -Compress
          $suiteMatrix = @{ include = $suiteLanes } | ConvertTo-Json -Compress
          $publishMatrix = @{ app = $apps } | ConvertTo-Json -Compress
          "package_matrix=$packageMatrix" >> $env:GITHUB_OUTPUT
          "suite_matrix=$suiteMatrix" >> $env:GITHUB_OUTPUT
          "publish_matrix=$publishMatrix" >> $env:GITHUB_OUTPUT

      - name: Select full release-only test matrix
        id: release_tests
        shell: pwsh
        run: pwsh -NoProfile -File tools/Get-TestGateMatrix.ps1 -Gate release -GitHubOutputPath $env:GITHUB_OUTPUT

  candidate:
    name: Verify immutable release candidate
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate latest release source
        shell: pwsh
        run: |
          $version = "${{ inputs.release_version }}".Trim()
          $apps = if ("${{ inputs.app }}" -eq "all") { @("FreeX", "FreeW", "FreeP") } else { @("${{ inputs.app }}") }
          $allowedTagRefs = @($apps | ForEach-Object { "refs/tags/$($_.ToLowerInvariant())-v$version" })
          if ("${{ inputs.app }}" -eq "all") { $allowedTagRefs += "refs/tags/free-suite-v$version" }

          $isMainRelease = $env:GITHUB_REF -eq "refs/heads/main"
          $isTaggedContinuation = $allowedTagRefs -ccontains $env:GITHUB_REF
          if (-not ($isMainRelease -or $isTaggedContinuation)) {
            throw "Full app releases must start from refs/heads/main or continue from an immutable tag for the requested version."
          }
          Write-Host "Pinned immutable release candidate $env:GITHUB_SHA from $env:GITHUB_REF. Later main commits do not invalidate this run."

      - name: Validate version and reject conflicting immutable tags
        shell: pwsh
        run: |
          $version = "${{ inputs.release_version }}".Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') {
            throw "release_version must be a filesystem-safe semantic version such as 0.8.182."
          }
          $apps = if ("${{ inputs.app }}" -eq "all") { @("FreeX", "FreeW", "FreeP") } else { @("${{ inputs.app }}") }
          $tags = @($apps | ForEach-Object { "$($_.ToLowerInvariant())-v$version" })
          if ("${{ inputs.app }}" -eq "all") { $tags += "free-suite-v$version" }
          foreach ($tag in $tags) {
            $remoteRefs = @(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}")
            if ($LASTEXITCODE -ne 0) { throw "Could not resolve remote tag '$tag'." }
            if ($remoteRefs.Count -eq 0) { continue }
            $peeled = @($remoteRefs | Where-Object { $_ -match '\^\{\}$' })
            $tagSha = (($peeled + $remoteRefs)[0] -split "\`t")[0]
            if ($tagSha -cne $env:GITHUB_SHA) {
              throw "Tag '$tag' is immutable at $tagSha; choose a new version before running full release tests."
            }
          }

      - name: Require successful exact-SHA CI and CodeQL attestations
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pwsh -NoProfile -File tools/Test-GitHubReleaseCandidate.ps1 `
            -Repository $env:GITHUB_REPOSITORY `
            -CommitSha $env:GITHUB_SHA

  release-tests:
    name: Release test ${{ matrix.app }} ${{ matrix.platform }} ${{ matrix.displayGateId }}
    needs: [prepare, candidate]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.release_matrix) }}
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ matrix.fetchDepth }}
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-v2-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', 'Directory.Build.props', 'Directory.Build.targets') }}
          restore-keys: nuget-v2-${{ runner.os }}-

      - name: Run isolated release test gate
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/Invoke-TestGate.ps1 `
            -Gate release `
            -App "${{ matrix.app }}" `
            -Platform "${{ matrix.platform }}" `
            -GateId "${{ matrix.gateId }}" `
            -PartitionIndex ${{ matrix.partitionIndex }} `
            -PartitionCount ${{ matrix.partitionCount }} `
            -RetryFailedProjectCount 1 `
            -HangTimeout 30m `
            -ResultsDirectory TestResults
      - name: Upload release test diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-tests-${{ matrix.platform }}-${{ matrix.displayGateId }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: "**/TestResults/**"
          if-no-files-found: warn
          retention-days: 14

  release-gate:
    name: FreeX full release gate
    needs: [prepare, candidate, release-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate immutable-candidate coverage
        shell: pwsh
        run: |
          $prepareResult = "${{ needs.prepare.result }}"
          $candidateResult = "${{ needs.candidate.result }}"
          $releaseTestResult = "${{ needs.release-tests.result }}"
          if ($prepareResult -ne 'success' -or $candidateResult -ne 'success' -or $releaseTestResult -ne 'success') {
            throw "Preparation: $prepareResult; exact-SHA integration attestations: $candidateResult; release-only tests: $releaseTestResult."
          }

  package:
    name: Package ${{ matrix.app }} ${{ matrix.runtime }}
    # Packaging is immutable-candidate work and can overlap release-only tests. Publication still
    # waits for release-gate, so a failed test can never publish the speculative package artifacts.
    needs: [prepare, candidate]
    runs-on: ${{ matrix.runner }}
    environment: public-preview
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      # Fifteen release-test entries get runner priority; five speculative package jobs
      # still overlap them without exceeding the observed 20-job account concurrency cap.
      max-parallel: 5
      matrix: ${{ fromJSON(needs.prepare.outputs.package_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-v2-${{ runner.os }}-${{ hashFiles('global.json', 'Directory.Packages.props', 'Directory.Build.props', 'Directory.Build.targets') }}
          restore-keys: nuget-v2-${{ runner.os }}-

      - name: Cache pinned SBOM tool
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/sbom-tool
          key: sbom-tool-${{ runner.os }}-${{ runner.arch }}-4.1.5

      - name: Authenticate to Azure Artifact Signing
        if: matrix.platform == 'windows'
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Prepare Artifact Signing client
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          dotnet tool install --global vpk --version 1.2.0
          if ($LASTEXITCODE -ne 0) { throw "Could not install the pinned Velopack signing client bundle." }
          az account get-access-token --resource https://codesigning.azure.net --output none
          if ($LASTEXITCODE -ne 0) { throw "GitHub OIDC identity could not obtain an Artifact Signing access token." }

      - name: Publish self-contained tester package
        shell: pwsh
        env:
          # Optional public ingestion identifier embedded as assembly metadata.
          # An absent value keeps diagnostics local and does not block packaging.
          FreeFamilySentryDsn: ${{ secrets.FREE_FAMILY_SENTRY_DSN }}
          FreeFamilySentryEnvironment: tester-release
          MACOS_CODESIGN_CERTIFICATE_P12: ${{ secrets.MACOS_CODESIGN_CERTIFICATE_P12 }}
          MACOS_CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CODESIGN_CERTIFICATE_PASSWORD }}
          MACOS_DEVELOPER_ID_APPLICATION: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          $version = "${{ inputs.release_version }}".Trim()
          if ([string]::IsNullOrWhiteSpace($version) -or $version -match "[`r`n]") {
            throw "release_version must be a non-empty single line."
          }

          if ("${{ matrix.platform }}" -eq "windows") {
            tools/Publish-WindowsVelopackPackage.ps1 `
              -App "${{ matrix.app }}" `
              -Version $version `
              -RuntimeIdentifier "${{ matrix.runtime }}" `
              -Configuration Release `
              -OutputDir artifacts\release `
              -ArtifactSigningMetadataPath tools\signing\metadata.json
          } elseif ("${{ matrix.platform }}" -eq "linux") {
            tools/Publish-SisterAppTesterPackages.ps1 `
              -App "${{ matrix.app }}" `
              -Version $version `
              -Runtimes "${{ matrix.runtime }}" `
              -Configuration Release `
              -OutputDir artifacts\release
            tools/packaging/New-AppInstallers.ps1 `
              -Apps "${{ matrix.app }}" `
              -Platform linux `
              -Version $version `
              -Runtime "${{ matrix.runtime }}" `
              -InputRoot artifacts\release `
              -OutputDir artifacts\release
          } else {
            tools/Publish-SisterAppTesterPackages.ps1 `
              -App "${{ matrix.app }}" `
              -Version $version `
              -Runtimes "${{ matrix.runtime }}" `
              -Configuration Release `
              -OutputDir artifacts/release
            tools/packaging/New-SignedMacOsReleasePackages.ps1 `
              -Apps "${{ matrix.app }}" `
              -Version $version `
              -Runtime "${{ matrix.runtime }}" `
              -InputRoot artifacts/release `
              -OutputDir artifacts/release
          }

          tools/Test-ReleasePackageContents.ps1 `
            -Scope App `
            -Apps "${{ matrix.app }}" `
            -Version $version `
            -Runtime "${{ matrix.runtime }}" `
            -InputRoot artifacts\release

      - name: Generate SBOM and validate package inventory
        shell: pwsh
        run: |
          $app = "${{ matrix.app }}"
          $version = "${{ inputs.release_version }}"
          $runtime = "${{ matrix.runtime }}"
          $prefix = "$app-v$version-$runtime"
          $payloadNames = if ($runtime -like "win-*") {
            @("$prefix.exe", "$prefix-setup.exe")
          } elseif ($runtime -like "linux-*") {
            @("$prefix.zip", "$prefix-installer.zip")
          } else {
            @("$prefix.zip", "$prefix-apps.zip")
          }
          $sbomTool = if ($IsWindows) { "artifacts/sbom-tool/sbom-tool.exe" } else { "artifacts/sbom-tool/sbom-tool" }
          if (-not (Test-Path -LiteralPath $sbomTool -PathType Leaf)) {
            dotnet tool install --tool-path artifacts/sbom-tool Microsoft.Sbom.DotNetTool --version 4.1.5
            if ($LASTEXITCODE -ne 0) { throw "Could not install Microsoft.Sbom.DotNetTool 4.1.5." }
          }
          tools/New-ReleaseSbom.ps1 `
            -Name $app `
            -Version $version `
            -CommitSha $env:GITHUB_SHA `
            -Runtime $runtime `
            -InputRoot artifacts/release `
            -PayloadNames $payloadNames `
            -OutputPath "artifacts/release/$prefix.spdx.json" `
            -SbomToolPath $sbomTool
          tools/New-ReleaseArtifactManifest.ps1 `
            -Scope App `
            -Apps $app `
            -Version $version `
            -CommitSha $env:GITHUB_SHA `
            -Runtimes $runtime `
            -InputRoot artifacts/release `
            -OutputPath "artifacts/release/$prefix-manifest.json"

      - name: Install and uninstall individual package
        shell: pwsh
        run: |
          tools/Test-ReleaseInstallation.ps1 `
            -Platform "${{ matrix.platform }}" `
            -Apps "${{ matrix.app }}" `
            -Version "${{ inputs.release_version }}" `
            -Runtime "${{ matrix.runtime }}" `
            -InputRoot artifacts/release

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tester-${{ matrix.app }}-${{ inputs.release_version }}-${{ matrix.runtime }}
          path: |
            artifacts/release/${{ matrix.app }}-v${{ inputs.release_version }}-${{ matrix.runtime }}.*
            artifacts/release/${{ matrix.app }}-v${{ inputs.release_version }}-${{ matrix.runtime }}-*
            artifacts/release/velopack-${{ matrix.app }}-${{ matrix.runtime }}/**
          if-no-files-found: error
          retention-days: 14

  suite-package:
    name: Package Free Suite ${{ matrix.runtime }}
    needs: [prepare, package]
    if: inputs.app == 'all'
    runs-on: ${{ matrix.runner }}
    environment: public-preview
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.suite_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download portable app packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tester-*-${{ inputs.release_version }}-${{ matrix.runtime }}
          path: downloaded-artifacts
          merge-multiple: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400

      - name: Cache pinned SBOM tool
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/sbom-tool
          key: sbom-tool-${{ runner.os }}-${{ runner.arch }}-4.1.5

      - name: Validate downloaded app packages
        shell: pwsh
        run: |
          foreach ($app in @("FreeX", "FreeW", "FreeP")) {
            tools/New-ReleaseArtifactManifest.ps1 `
              -Scope App `
              -Apps $app `
              -Version "${{ inputs.release_version }}" `
              -CommitSha $env:GITHUB_SHA `
              -Runtimes "${{ matrix.runtime }}" `
              -InputRoot downloaded-artifacts `
              -OutputPath "artifacts/precheck/$app-v${{ inputs.release_version }}-${{ matrix.runtime }}-validated.json" `
              -RequireSourceManifests
          }

      - name: Authenticate to Azure Artifact Signing
        if: matrix.platform == 'windows'
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Prepare Artifact Signing client
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          dotnet tool install --global vpk --version 1.2.0
          if ($LASTEXITCODE -ne 0) { throw "Could not install the pinned Artifact Signing client bundle." }
          az account get-access-token --resource https://codesigning.azure.net --output none
          if ($LASTEXITCODE -ne 0) { throw "GitHub OIDC identity could not obtain an Artifact Signing access token." }

      - name: Build signed suite installer
        shell: pwsh
        env:
          MACOS_CODESIGN_CERTIFICATE_P12: ${{ secrets.MACOS_CODESIGN_CERTIFICATE_P12 }}
          MACOS_CODESIGN_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CODESIGN_CERTIFICATE_PASSWORD }}
          MACOS_DEVELOPER_ID_APPLICATION: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          $version = "${{ inputs.release_version }}"
          $platform = "${{ matrix.platform }}"
          if ($platform -eq "windows") {
            $suite = tools/packaging/New-FreeSuiteWindowsBootstrapper.ps1 `
              -Version $version `
              -InputRoot downloaded-artifacts `
              -OutputDir artifacts/suite
            tools/Invoke-WindowsArtifactSigning.ps1 `
              -Files $suite `
              -MetadataPath tools/signing/metadata.json
            $name = Split-Path -Leaf $suite
            $hash = (Get-FileHash -LiteralPath $suite -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $name" | Set-Content -LiteralPath "$suite.sha256" -NoNewline -Encoding ascii
          } elseif ($platform -eq "linux") {
            tools/packaging/New-AppInstallers.ps1 `
              -Apps FreeX,FreeW,FreeP `
              -Suite `
              -Platform linux `
              -Version $version `
              -Runtime "${{ matrix.runtime }}" `
              -InputRoot downloaded-artifacts `
              -OutputDir artifacts/suite
          } else {
            tools/packaging/New-SignedMacOsReleasePackages.ps1 `
              -Apps FreeX,FreeW,FreeP `
              -Suite `
              -Version $version `
              -Runtime "${{ matrix.runtime }}" `
              -InputRoot downloaded-artifacts `
              -OutputDir artifacts/suite
          }

          tools/Test-ReleasePackageContents.ps1 `
            -Scope Suite `
            -Apps FreeX,FreeW,FreeP `
            -Version "${{ inputs.release_version }}" `
            -Runtime "${{ matrix.runtime }}" `
            -InputRoot artifacts\suite

      - name: Generate suite SBOM and validate inventory
        shell: pwsh
        run: |
          $version = "${{ inputs.release_version }}"
          $runtime = "${{ matrix.runtime }}"
          $prefix = "FreeSuite-v$version-$runtime"
          $payloadName = if ($runtime -like "win-*") { "$prefix-setup.exe" } elseif ($runtime -like "linux-*") { "$prefix-installer.zip" } else { "$prefix.pkg" }
          Get-ChildItem -LiteralPath downloaded-artifacts -Recurse -File -Filter "*-v$version-$runtime-manifest.json" |
            Copy-Item -Destination artifacts/suite
          $sbomTool = if ($IsWindows) { "artifacts/sbom-tool/sbom-tool.exe" } else { "artifacts/sbom-tool/sbom-tool" }
          if (-not (Test-Path -LiteralPath $sbomTool -PathType Leaf)) {
            dotnet tool install --tool-path artifacts/sbom-tool Microsoft.Sbom.DotNetTool --version 4.1.5
            if ($LASTEXITCODE -ne 0) { throw "Could not install Microsoft.Sbom.DotNetTool 4.1.5." }
          }
          tools/New-ReleaseSbom.ps1 `
            -Name FreeSuite `
            -Version $version `
            -CommitSha $env:GITHUB_SHA `
            -Runtime $runtime `
            -InputRoot artifacts/suite `
            -PayloadNames $payloadName `
            -OutputPath "artifacts/suite/$prefix.spdx.json" `
            -SbomToolPath $sbomTool
          tools/New-ReleaseArtifactManifest.ps1 `
            -Scope Suite `
            -Apps FreeX,FreeW,FreeP `
            -Version $version `
            -CommitSha $env:GITHUB_SHA `
            -Runtimes $runtime `
            -InputRoot artifacts/suite `
            -OutputPath "artifacts/suite/$prefix-manifest.json" `
            -RequireSourceManifests

      - name: Install, transition, and uninstall suite package
        shell: pwsh
        run: |
          tools/Test-ReleaseInstallation.ps1 `
            -Platform "${{ matrix.platform }}" `
            -Apps FreeX,FreeW,FreeP `
            -Suite `
            -Version "${{ inputs.release_version }}" `
            -Runtime "${{ matrix.runtime }}" `
            -InputRoot .

      - name: Upload suite installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tester-FreeSuite-${{ inputs.release_version }}-${{ matrix.runtime }}
          path: |
            artifacts/suite/FreeSuite-v${{ inputs.release_version }}-${{ matrix.runtime }}-*
            artifacts/suite/FreeSuite-v${{ inputs.release_version }}-${{ matrix.runtime }}.spdx.json
            artifacts/suite/FreeSuite-v${{ inputs.release_version }}-${{ matrix.runtime }}.spdx.json.sha256
            artifacts/suite/FreeX-v${{ inputs.release_version }}-${{ matrix.runtime }}-manifest.json
            artifacts/suite/FreeW-v${{ inputs.release_version }}-${{ matrix.runtime }}-manifest.json
            artifacts/suite/FreeP-v${{ inputs.release_version }}-${{ matrix.runtime }}-manifest.json
          if-no-files-found: error
          retention-days: 14

  publication-gate:
    name: Validate complete release inventory
    needs: [prepare, release-gate, package, suite-package]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Require every selected package before publication
        shell: pwsh
        run: |
          $prepareResult = "${{ needs.prepare.result }}"
          $releaseGateResult = "${{ needs.release-gate.result }}"
          $packageResult = "${{ needs.package.result }}"
          $suiteResult = "${{ needs.suite-package.result }}"
          $requiresSuite = "${{ inputs.app }}" -eq "all"
          if ($prepareResult -ne 'success' -or $releaseGateResult -ne 'success' -or $packageResult -ne 'success') {
            throw "Preparation: $prepareResult; release tests: $releaseGateResult; app packages: $packageResult."
          }
          if ($requiresSuite -and $suiteResult -ne 'success') {
            throw "Full-suite packaging must succeed before any release is published; result: $suiteResult."
          }
          if (-not $requiresSuite -and $suiteResult -notin @('skipped', 'success')) {
            throw "Unexpected suite packaging result for an app-only release: $suiteResult."
          }

      - name: Checkout immutable tag context
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Reject every conflicting release tag before the first publication
        shell: pwsh
        run: |
          $version = "${{ inputs.release_version }}".Trim()
          $apps = if ("${{ inputs.app }}" -eq "all") { @("FreeX", "FreeW", "FreeP") } else { @("${{ inputs.app }}") }
          $tags = @($apps | ForEach-Object { "$($_.ToLowerInvariant())-v$version" })
          if ("${{ inputs.app }}" -eq "all") { $tags += "free-suite-v$version" }
          foreach ($tag in $tags) {
            $remoteRefs = @(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}")
            if ($LASTEXITCODE -ne 0) { throw "Could not resolve remote tag '$tag'." }
            if ($remoteRefs.Count -eq 0) { continue }
            $peeled = @($remoteRefs | Where-Object { $_ -match '\^\{\}$' })
            $tagSha = (($peeled + $remoteRefs)[0] -split "`t")[0]
            if ($tagSha -cne $env:GITHUB_SHA) {
              throw "Tag '$tag' is immutable at $tagSha; refusing publication from $env:GITHUB_SHA."
            }
          }

  publish:
    name: Publish ${{ matrix.app }} release
    needs: [prepare, publication-gate]
    runs-on: ubuntu-latest
    environment: public-preview
    timeout-minutes: 20
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.publish_matrix) }}
    steps:
      - name: Checkout release context
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download selected app packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tester-${{ matrix.app }}-${{ inputs.release_version }}-*
          path: downloaded-artifacts
          merge-multiple: false

      - name: Create or update signed release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $app = "${{ matrix.app }}"
          $version = "${{ inputs.release_version }}".Trim()
          $tag = "$($app.ToLowerInvariant())-v$version"
          $title = "$app v$version"
          $assetRoot = Join-Path $env:GITHUB_WORKSPACE "release-assets"
          New-Item -ItemType Directory -Force -Path $assetRoot | Out-Null

          Get-ChildItem -LiteralPath "downloaded-artifacts" -Recurse -File |
            ForEach-Object {
              Copy-Item -LiteralPath $_.FullName -Destination (Join-Path $assetRoot $_.Name) -Force
            }

          $runtimes = switch ("${{ inputs.platform }}") {
            "windows" { @("win-x64") }
            "linux" { @("linux-x64", "linux-arm64") }
            "macos" { @("osx-x64", "osx-arm64") }
            default { @("win-x64", "linux-x64", "linux-arm64", "osx-x64", "osx-arm64") }
          }
          tools/New-ReleaseArtifactManifest.ps1 `
            -Scope App `
            -Apps $app `
            -Version $version `
            -CommitSha $env:GITHUB_SHA `
            -Runtimes $runtimes `
            -InputRoot $assetRoot `
            -OutputPath (Join-Path $assetRoot "$app-v$version-release-manifest.json") `
            -RequireRuntimeManifests `
            -StageLegalBundle

          $assets = @(Get-ChildItem -LiteralPath $assetRoot -File | ForEach-Object { $_.FullName })
          if ($assets.Count -eq 0) {
            throw "No $app release assets were downloaded."
          }

          $notes = @'
          # {{APP}} v{{VERSION}}

          Assets are built independently for each selected platform from commit {{SHA}}.

          ## Install and deploy

          ### Windows x64

          1. Download `{{APP}}-v{{VERSION}}-win-x64.exe` and its `.sha256` file.
          2. Verify the download: `Get-FileHash .\{{APP}}-v{{VERSION}}-win-x64.exe -Algorithm SHA256`; compare the hash with the `.sha256` file.
          3. The standalone executable and `-setup.exe` are Authenticode signed by Freevia through Azure Artifact Signing. Use the Velopack setup for an installed, self-updating copy, or run the standalone executable directly.

          ### Linux x64 and ARM64

          1. Choose `linux-x64` for Intel/AMD 64-bit systems or `linux-arm64` for 64-bit ARM systems. Download the matching `.zip` and `.sha256` file.
          2. Verify it with `sha256sum -c {{APP}}-v{{VERSION}}-linux-<architecture>.zip.sha256`.
          3. Extract it into a stable per-user directory, for example `unzip {{APP}}-v{{VERSION}}-linux-<architecture>.zip -d ~/{{APP}}`.
          4. Run `chmod +x ~/{{APP}}/{{APP}}` once, then start it with `~/{{APP}}/{{APP}}`. To update, close the app and replace the extracted directory.

          ### macOS Intel and Apple silicon

          1. Choose `osx-x64` for Intel Macs or `osx-arm64` for Apple silicon. Download the matching `.zip` and `.sha256` file.
          2. Verify it with `shasum -a 256 -c {{APP}}-v{{VERSION}}-osx-<architecture>.zip.sha256`.
          3. Prefer the matching `-apps.zip`; it contains a Developer ID signed, notarized, and stapled `.app` bundle plus an install helper.

          Each platform includes a portable artifact and an installable package: signed Velopack `-setup.exe` on Windows, `-installer.zip` on Linux, and `-apps.zip` containing a signed/notarized/stapled `.app` bundle on macOS. Linux integrity is covered by SHA-256 checksums, manifests, and SPDX SBOMs.
          '@
          $notes = $notes.
            Replace("{{APP}}", $app).
            Replace("{{VERSION}}", $version).
            Replace("{{SHA}}", $env:GITHUB_SHA)

          gh release view $tag *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          $remoteRefs = @(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}")
          if ($LASTEXITCODE -ne 0) { throw "Could not resolve remote tag '$tag'." }
          if ($remoteRefs.Count -gt 0) {
            $peeled = @($remoteRefs | Where-Object { $_ -match '\^\{\}$' })
            $tagSha = (($peeled + $remoteRefs)[0] -split "`t")[0]
            if ($tagSha -cne $env:GITHUB_SHA) {
              throw "Tag '$tag' is immutable at $tagSha; refusing to replace it with assets from $env:GITHUB_SHA. Use a new version."
            }
          } elseif ($releaseExists) {
            throw "Existing release '$tag' has no resolvable remote tag."
          }
          if ($releaseExists) {
            gh release upload $tag @assets --clobber
            $prerelease = "${{ inputs.prerelease }}".ToLowerInvariant()
            $notes | gh release edit $tag --title $title --notes-file - "--prerelease=$prerelease"
          } else {
            $releaseArgs = @()
            if ("${{ inputs.prerelease }}" -eq "true") { $releaseArgs += "--prerelease" }
            $notes | gh release create $tag @assets --target $env:GITHUB_SHA --title $title --notes-file - @releaseArgs
          }

  publish-suite:
    name: Publish Free Suite release
    needs: [suite-package, publication-gate]
    if: inputs.app == 'all'
    runs-on: ubuntu-latest
    environment: public-preview
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout release context
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download suite packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tester-FreeSuite-${{ inputs.release_version }}-*
          path: downloaded-artifacts
          merge-multiple: true

      - name: Create or update suite release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ inputs.release_version }}".Trim()
          $tag = "free-suite-v$version"
          $title = "Free Suite v$version"
          $assetRoot = Join-Path $env:GITHUB_WORKSPACE "suite-release-assets"
          New-Item -ItemType Directory -Force -Path $assetRoot | Out-Null
          Get-ChildItem -LiteralPath downloaded-artifacts -File | Copy-Item -Destination $assetRoot
          $runtimes = switch ("${{ inputs.platform }}") {
            "windows" { @("win-x64") }
            "linux" { @("linux-x64", "linux-arm64") }
            "macos" { @("osx-x64", "osx-arm64") }
            default { @("win-x64", "linux-x64", "linux-arm64", "osx-x64", "osx-arm64") }
          }
          tools/New-ReleaseArtifactManifest.ps1 `
            -Scope Suite `
            -Apps FreeX,FreeW,FreeP `
            -Version $version `
            -CommitSha $env:GITHUB_SHA `
            -Runtimes $runtimes `
            -InputRoot $assetRoot `
            -OutputPath (Join-Path $assetRoot "FreeSuite-v$version-release-manifest.json") `
            -RequireRuntimeManifests `
            -StageLegalBundle
          $assets = @(Get-ChildItem -LiteralPath $assetRoot -File | ForEach-Object { $_.FullName })
          if ($assets.Count -eq 0) { throw "No suite packages were downloaded." }
          $notes = @'
          # Free Suite v{{VERSION}}

          This release installs FreeX, FreeW, and FreeP together by invoking the same per-app installers shipped on each app's release page. It does not create separate suite-owned copies, so suite-to-individual upgrades and individual-to-suite upgrades keep the same installation and uninstaller identities. Portable artifacts remain available on the individual release pages.

          Windows uses a Freevia Authenticode-signed .NET bootstrapper containing the three signed Velopack installers; it has no Inno dependency. Linux uses an installer bundle whose `install.sh` defaults to `~/.local`, protected by SHA-256 checksums, manifests, and an SPDX SBOM. macOS uses a Developer ID Installer-signed, notarized, and stapled `.pkg` containing all three signed/notarized/stapled `.app` bundles.
          '@.Replace("{{VERSION}}", $version)

          gh release view $tag *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          $remoteRefs = @(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}")
          if ($LASTEXITCODE -ne 0) { throw "Could not resolve remote tag '$tag'." }
          if ($remoteRefs.Count -gt 0) {
            $peeled = @($remoteRefs | Where-Object { $_ -match '\^\{\}$' })
            $tagSha = (($peeled + $remoteRefs)[0] -split "`t")[0]
            if ($tagSha -cne $env:GITHUB_SHA) {
              throw "Tag '$tag' is immutable at $tagSha; refusing to replace it with assets from $env:GITHUB_SHA. Use a new version."
            }
          } elseif ($releaseExists) {
            throw "Existing release '$tag' has no resolvable remote tag."
          }
          if ($releaseExists) {
            gh release upload $tag @assets --clobber
            $prerelease = "${{ inputs.prerelease }}".ToLowerInvariant()
            $notes | gh release edit $tag --title $title --notes-file - "--prerelease=$prerelease"
          } else {
            $releaseArgs = @()
            if ("${{ inputs.prerelease }}" -eq "true") { $releaseArgs += "--prerelease" }
            $notes | gh release create $tag @assets --target $env:GITHUB_SHA --title $title --notes-file - @releaseArgs
          }

  verify-publication:
    name: Verify published release inventory
    needs: [publish, publish-suite]
    if: ${{ always() && needs.publish.result == 'success' && (inputs.app != 'all' || needs.publish-suite.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout tag verification context
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify tags, prerelease state, and complete remote assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ inputs.release_version }}".Trim()
          $expectedPrerelease = "${{ inputs.prerelease }}" -eq "true"
          $apps = if ("${{ inputs.app }}" -eq "all") { @("FreeX", "FreeW", "FreeP") } else { @("${{ inputs.app }}") }
          $runtimes = switch ("${{ inputs.platform }}") {
            "windows" { @("win-x64") }
            "linux" { @("linux-x64", "linux-arm64") }
            "macos" { @("osx-x64", "osx-arm64") }
            default { @("win-x64", "linux-x64", "linux-arm64", "osx-x64", "osx-arm64") }
          }

          function Assert-Release([string]$Tag, [string[]]$RequiredAssets) {
            $remoteRefs = @(git ls-remote origin "refs/tags/$Tag" "refs/tags/$Tag^{}")
            if ($LASTEXITCODE -ne 0 -or $remoteRefs.Count -eq 0) { throw "Published tag '$Tag' could not be resolved." }
            $peeled = @($remoteRefs | Where-Object { $_ -match '\^\{\}$' })
            $tagSha = (($peeled + $remoteRefs)[0] -split "`t")[0]
            if ($tagSha -cne $env:GITHUB_SHA) { throw "Published tag '$Tag' targets $tagSha instead of $env:GITHUB_SHA." }

            $release = gh release view $Tag --json isPrerelease,assets,url | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw "Could not inspect published release '$Tag'." }
            if ([bool]$release.isPrerelease -ne $expectedPrerelease) {
              throw "Release '$Tag' prerelease state is '$($release.isPrerelease)'; expected '$expectedPrerelease'."
            }
            $assetNames = @($release.assets | ForEach-Object { [string]$_.name })
            $emptyAssets = @($release.assets | Where-Object { [long]$_.size -le 0 } | ForEach-Object { [string]$_.name })
            if ($emptyAssets.Count -gt 0) { throw "Release '$Tag' contains empty assets: $($emptyAssets -join ', ')." }
            $missing = @($RequiredAssets | Where-Object { $_ -notin $assetNames })
            if ($missing.Count -gt 0) { throw "Release '$Tag' is missing assets: $($missing -join ', ')." }
            Write-Host "Verified $Tag at $($release.url) with $($assetNames.Count) non-empty assets."
          }

          foreach ($app in $apps) {
            $required = @("$app-v$version-release-manifest.json")
            foreach ($runtime in $runtimes) {
              $prefix = "$app-v$version-$runtime"
              $payloads = if ($runtime -like "win-*") { @("$prefix.exe", "$prefix-setup.exe") } elseif ($runtime -like "linux-*") { @("$prefix.zip", "$prefix-installer.zip") } else { @("$prefix.zip", "$prefix-apps.zip") }
              $required += $payloads
              $required += @($payloads | ForEach-Object { "$_.sha256" })
              $required += @("$prefix-manifest.json", "$prefix.spdx.json", "$prefix.spdx.json.sha256")
            }
            Assert-Release -Tag "$($app.ToLowerInvariant())-v$version" -RequiredAssets $required
          }

          if ("${{ inputs.app }}" -eq "all") {
            $required = @("FreeSuite-v$version-release-manifest.json")
            foreach ($runtime in $runtimes) {
              $prefix = "FreeSuite-v$version-$runtime"
              $payload = if ($runtime -like "win-*") { "$prefix-setup.exe" } elseif ($runtime -like "linux-*") { "$prefix-installer.zip" } else { "$prefix.pkg" }
              $required += @($payload, "$payload.sha256", "$prefix-manifest.json", "$prefix.spdx.json", "$prefix.spdx.json.sha256")
              $required += @("FreeX-v$version-$runtime-manifest.json", "FreeW-v$version-$runtime-manifest.json", "FreeP-v$version-$runtime-manifest.json")
            }
            Assert-Release -Tag "free-suite-v$version" -RequiredAssets $required
          }
