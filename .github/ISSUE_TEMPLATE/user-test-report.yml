name: FreeX user test report (Free-family)
description: Report a crash or problem in FreeX, FreeW, or FreeP.
title: "[User test]: "
labels:
  - user-testing
  - needs-triage
body:
  - type: dropdown
    id: app
    attributes:
      label: App
      options:
        - FreeX
        - FreeW
        - FreeP
        - Suite installer or shared component
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: App version/build
      description: Paste the version shown in the app and, if possible, the downloaded artifact name (for example, a tester-release asset).
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows x64
        - Linux x64
        - Linux arm64
        - macOS Apple silicon
        - macOS Intel
        - Other or unknown
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation type
      options:
        - Standalone executable or extracted archive
        - Individual-app installer
        - Suite installer
        - MSIX
        - Other or unknown
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical - crash, data loss, or cannot open/save
        - High - major workflow blocked
        - Medium - feature broken or confusing
        - Low - polish or minor issue
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Tell us exactly what you did before the problem appeared.
      placeholder: |
        1. Opened...
        2. Clicked...
        3. Saw...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What did you expect the app to do?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Optional diagnostics and crash reports
      description: Each app can write local diagnostics (for example, %LOCALAPPDATA%\FreeX\Diagnostics on Windows, with FreeW or FreeP replacing FreeX). Attach only files you have reviewed and sanitized; do not upload a private document, path, account detail, credential, or other sensitive information.
      placeholder: Attach events.jsonl, logs, screenshots, or CrashReports/*.json when useful.
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS version, desktop environment where relevant, display scaling, and anything unusual about the test machine.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I reviewed the text and attachments and removed information I do not want posted publicly.
          required: true
