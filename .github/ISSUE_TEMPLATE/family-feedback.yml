name: Free-family feedback
description: Suggest an improvement or share usability feedback for FreeX, FreeW, or FreeP.
title: "[Feedback]: "
labels:
  - user-testing
  - needs-triage
body:
  - type: dropdown
    id: app
    attributes:
      label: App or area
      options:
        - FreeX
        - FreeW
        - FreeP
        - Suite installation or updates
        - Shared experience
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: Feedback
      description: Describe the workflow, the difficulty or opportunity, and the outcome you would prefer.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Optional app version or downloaded artifact name.
    validations:
      required: false
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - Linux
        - macOS
        - Not platform-specific
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I reviewed the text and attachments and removed information I do not want posted publicly.
          required: true
